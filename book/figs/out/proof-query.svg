<svg viewBox="0 0 680 430" width="100%" role="img" aria-label="Flowchart. Two boxes, the assumptions (P and Q well-formed, x in P, y in Q) and the claim turned round (x AND y is not in R), both feed s.check(): can all of them hold at once for some n-bit values? No: unsat, the claim holds for every input of n bits. Yes: sat, and s.model() gives values that break it. A third answer, unknown, means a timeout or limit stopped the search." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>What the solver is asked</title><defs><marker id="ah-proof-query" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect x="14" y="10" width="318" height="104" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="173.0" y="30" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">assumptions</text><text x="173.0" y="54" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">P and Q are well-formed: v &amp; m == 0</text><text x="173.0" y="73" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">x is in P and y is in Q: x &amp; ~m == v</text><rect x="348" y="10" width="318" height="104" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="507.0" y="30" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">the claim, turned round</text><text x="507.0" y="54" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">R = tnum_and(P, Q)</text><text x="507.0" y="73" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">(x &amp; y) &amp; ~R.m != R.v</text><path d="M173.0,114.0 L173.0,140.0 L300.0,140.0 L300.0,160.0" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-proof-query)"/><path d="M507.0,114.0 L507.0,140.0 L380.0,140.0 L380.0,160.0" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-proof-query)"/><polygon points="150,232 340,166 530,232 340,298" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="340" y="210" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">s.check()</text><text x="340" y="234" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328">can all of them hold at once</text><text x="340" y="254" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328">for some n-bit values?</text><path d="M340.0,298.0 L340.0,346.0" fill="none" stroke="#0F6E56" stroke-width="3" marker-end="url(#ah-proof-query)"/><text x="328" y="316" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#0F6E56" font-weight="700">no</text><rect x="190" y="348" width="300" height="70" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2.6"/><text x="340.0" y="368" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#0F6E56" font-weight="700">unsat</text><text x="340.0" y="392" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">the claim holds for every input of n bits</text><path d="M530.0,232.0 L530.0,312.0 L604.0,312.0 L604.0,346.0" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-proof-query)"/><text x="540" y="218" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">yes</text><rect x="530" y="348" width="140" height="70" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="600.0" y="368" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">sat</text><text x="600.0" y="392" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">s.model() breaks it</text><text x="14" y="300" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">a third answer, unknown: a timeout</text><text x="14" y="318" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">or a resource limit stopped the</text><text x="14" y="336" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">search, and nothing is proved</text></svg>