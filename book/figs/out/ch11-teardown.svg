<svg viewBox="0 0 680 580" width="100%" role="img" aria-label="A timeline in three columns: the exiting loader, the RCU callback and the kworkers. In the exiting loader: kill(SIGTERM) at 0; at 0.6 ms the link fd is released and bpf_perf_link_release() detaches; perf_event_detach_bpf_prog() waits about 25 ms in synchronize_rcu_tasks_trace(); at 25.7 ms the program goes 3 to 2 (the perf event) and 2 to 1 (the link), the prog fd 1 to 0 with the ID freed and bpf_prog_put_deferred() calling call_rcu(), and the map fds are released (write_counts 2 to 1, .rodata 2 to 1). An RCU grace period of about 9 ms follows. At 34.5 ms the RCU callback runs __bpf_prog_put_rcu() then bpf_prog_free(), and a kworker runs bpf_prog_free_deferred(), used_maps 1 to 0 and 1 to 0; at 34.6 ms a kworker runs bpf_map_free_deferred(): htab_map_free(), array_map_free()." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>What the kernel did when the write counter’s loader was killed</title><defs><marker id="ah-11-4p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><defs><marker id="ah-11-4p-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="ah-11-4p-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker></defs><text x="8" y="16" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">time</text><text x="182.0" y="16" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">the exiting loader</text><line x1="182.0" y1="28" x2="182.0" y2="534" stroke="#C9CCCF" stroke-width="1" stroke-dasharray="2 4"/><text x="388.0" y="16" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">RCU callback</text><line x1="388.0" y1="28" x2="388.0" y2="534" stroke="#C9CCCF" stroke-width="1" stroke-dasharray="2 4"/><text x="574.0" y="16" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">kworkers</text><line x1="574.0" y1="28" x2="574.0" y2="534" stroke="#C9CCCF" stroke-width="1" stroke-dasharray="2 4"/><rect x="64" y="30" width="236" height="46" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.2"/><text x="72" y="44" text-anchor="start" dominant-baseline="central" font-size="15" fill="#1F2328" font-weight="700" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">kill(SIGTERM)</tspan></text><text x="72" y="62" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">files close as the process exits</tspan></text><text x="8" y="44" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">0</text><rect x="64" y="86" width="236" height="46" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.2"/><text x="72" y="100" text-anchor="start" dominant-baseline="central" font-size="15" fill="#1F2328" font-weight="700" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">link fd: </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">bpf_link_release()</tspan></text><text x="72" y="118" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">bpf_perf_link_release()</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">: detach</tspan></text><text x="8" y="100" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">0.6 ms</text><rect x="64" y="142" width="236" height="64" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2" stroke-dasharray="6 4"/><text x="72" y="156" text-anchor="start" dominant-baseline="central" font-size="15" fill="#0F6E56" font-weight="700" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">waits ≈ 25 ms</tspan></text><text x="72" y="174" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">perf_event_detach_bpf_prog()</tspan></text><text x="72" y="192" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">in </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">synchronize_rcu_tasks_trace()</tspan></text><rect x="64" y="216" width="236" height="46" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.2"/><text x="72" y="230" text-anchor="start" dominant-baseline="central" font-size="15" fill="#1F2328" font-weight="700" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">program: 3 → 2, the perf event’s</tspan></text><text x="72" y="248" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">then 2 → 1, the link’s own</tspan></text><text x="8" y="230" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">25.7 ms</text><rect x="64" y="272" width="236" height="64" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.2"/><text x="72" y="286" text-anchor="start" dominant-baseline="central" font-size="15" fill="#1F2328" font-weight="700" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">prog fd: 1 → 0, ID freed</tspan></text><text x="72" y="304" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">bpf_prog_put_deferred()</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">:</tspan></text><text x="72" y="322" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">call_rcu()</tspan></text><text x="8" y="286" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">25.7 ms</text><rect x="64" y="346" width="236" height="46" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.2"/><text x="72" y="360" text-anchor="start" dominant-baseline="central" font-size="15" fill="#1F2328" font-weight="700" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">map fds: </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">bpf_map_release()</tspan></text><text x="72" y="378" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">write_counts</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif"> 2 → 1, </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">.rodata</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif"> 2 → 1</tspan></text><text x="8" y="360" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">25.7 ms</text><rect x="308" y="272" width="160" height="100" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2" stroke-dasharray="6 4"/><text x="316" y="286" text-anchor="start" dominant-baseline="central" font-size="15" fill="#0F6E56" font-weight="700" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">RCU grace period</tspan></text><text x="316" y="304" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">≈ 9 ms: every CPU</tspan></text><text x="316" y="322" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">that might still run</tspan></text><text x="316" y="340" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">count_writes</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif"> has</tspan></text><text x="316" y="358" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">passed a quiescent state</tspan></text><path d="M300,286 L306,286" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-11-4p-k)"/><rect x="308" y="412" width="160" height="46" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.2"/><text x="316" y="426" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-weight="700" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">__bpf_prog_put_rcu()</tspan></text><text x="316" y="444" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">then </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">bpf_prog_free()</tspan></text><text x="8" y="426" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">34.5 ms</text><rect x="476" y="412" width="196" height="46" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.2"/><text x="484" y="426" text-anchor="start" dominant-baseline="central" font-size="15" fill="#1F2328" font-weight="700" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">bpf_prog_free_deferred()</tspan></text><text x="484" y="444" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">used_maps</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">: 1 → 0 and 1 → 0</tspan></text><path d="M388,372 L388,410" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-11-4p-k)"/><path d="M468,426 L474,426" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-11-4p-k)"/><rect x="476" y="470" width="196" height="64" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.2"/><text x="484" y="484" text-anchor="start" dominant-baseline="central" font-size="15" fill="#1F2328" font-weight="700" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">bpf_map_free_deferred()</tspan></text><text x="484" y="502" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">htab_map_free()</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">,</tspan></text><text x="484" y="520" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">array_map_free()</tspan></text><text x="8" y="484" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">34.6 ms</text><path d="M574,458 L574,468" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-11-4p-k)"/><rect x="64" y="550" width="36" height="20" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.2"/><text x="110" y="560" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">runs in this column</text><rect x="268" y="550" width="36" height="20" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2" stroke-dasharray="6 4"/><text x="314" y="560" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#0F6E56" font-weight="700">a wait</text><path d="M400,560 L436,560" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-11-4p-k)"/><text x="446" y="560" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">hands on to another column</text></svg>