<svg viewBox="0 0 680 648" width="100%" role="img" aria-label="A flowchart. hashmap.bpf.c with vmlinux.h and bpf_helpers.h goes through the front end (clang parses the C, expands SEC() and __uint() and writes LLVM IR), the middle (LLVM at -O2: locals into registers, dead code removed) and the BPF back end in llvm/lib/Target/BPF: instruction selection, register allocation, frame layout, a check for a stack reaching 512 bytes, a check for a used XADD return value, and the object writer, ending in hashmap.bpf.o. A yes at either check stops the build. Beside the stages, joined by dashed lines: BPFAbstractMemberAccess at the pipeline start, BPFAdjustOpt and BPFIRPeephole in the middle, BPFCheckAndAdjustIR before selection and BPFMISimplifyPatchable after it." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>The write counter through clang: front end, middle, BPF back end</title><defs><marker id="ah-10-1p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><defs><marker id="ah-10-1p-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="ah-10-1p-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker></defs><rect x="8" y="8" width="364" height="32" rx="16" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190.0" y="24" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#1F2328" font-weight="700" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">hashmap.bpf.c</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif"> + </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">vmlinux.h</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif"> + </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">bpf_helpers.h</tspan></text><text x="394" y="24" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">your C, and the headers it includes</text><path d="M190.0,40 L190.0,55" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#ah-10-1p-k)"/><rect x="8" y="56" width="364" height="46" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190.0" y="71" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">Front end · clang</text><text x="190.0" y="88" text-anchor="middle" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">parses the C, expands </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">SEC()</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif"> and </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">__uint()</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">, writes LLVM IR</tspan></text><path d="M190.0,102 L190.0,125" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#ah-10-1p-k)"/><text x="180.0" y="114" text-anchor="end" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">IR</text><rect x="8" y="126" width="364" height="46" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190.0" y="141" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#1F2328" font-weight="700" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">Middle · LLVM at </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">-O2</tspan></text><text x="190.0" y="158" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">general passes: locals into registers, dead code removed</text><path d="M190.0,172 L190.0,189" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#ah-10-1p-k)"/><rect x="8" y="190" width="364" height="402" rx="5" fill="#EEF0F1" stroke="#4A5056" stroke-width="1.2"/><text x="190.0" y="207" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#1F2328" font-weight="700" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">BPF back end · </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">llvm/lib/Target/BPF</tspan></text><rect x="22" y="224" width="336" height="46" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190.0" y="239" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">instruction selection</text><text x="190.0" y="256" text-anchor="middle" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">IR operations become BPF instructions (</tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">BPFInstrInfo.td</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">)</tspan></text><path d="M190.0,270 L190.0,283" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#ah-10-1p-k)"/><rect x="22" y="284" width="336" height="46" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190.0" y="299" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">register allocation</text><text x="190.0" y="316" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">values go to r0–r9; r10 stays the frame pointer</text><path d="M190.0,330 L190.0,343" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#ah-10-1p-k)"/><rect x="22" y="344" width="336" height="46" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190.0" y="359" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">frame layout</text><text x="190.0" y="376" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">stack slots below r10, at most 512 bytes</text><path d="M190.0,390 L190.0,403" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#ah-10-1p-k)"/><polygon points="72.0,428 190.0,404 308.0,428 190.0,452" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190.0" y="428" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328">stack reaches 512 bytes?</text><path d="M190.0,452 L190.0,469" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#ah-10-1p-k)"/><text x="200.0" y="461" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">no</text><polygon points="72.0,494 190.0,470 308.0,494 190.0,518" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190.0" y="494" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328">XADD's return value used?</text><path d="M190.0,518 L190.0,535" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#ah-10-1p-k)"/><text x="200.0" y="527" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">no</text><rect x="22" y="536" width="336" height="46" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190.0" y="551" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">object writer</text><text x="190.0" y="568" text-anchor="middle" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">bytes, relocations, and </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">BTFDebug</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">: </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">.BTF</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">, </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">.BTF.ext</tspan></text><path d="M190.0,582 L190.0,607" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#ah-10-1p-k)"/><rect x="8" y="608" width="364" height="32" rx="16" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190.0" y="624" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#1F2328" font-weight="700" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">hashmap.bpf.o</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">: an ELF object with code, maps, license, BTF</tspan></text><path d="M308.0,428 L386,428" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#ah-10-1p-k)"/><text x="316.0" y="417" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">yes</text><text x="394" y="410" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328" font-weight="700">stops the build:</text><text x="394" y="428" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">"Looks like the BPF stack limit is exceeded"</text><text x="394" y="446" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#4A5056">BPFRegisterInfo.cpp</text><path d="M308.0,494 L386,494" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#ah-10-1p-k)"/><text x="316.0" y="483" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">yes</text><text x="394" y="476" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-weight="700" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">stops the build on </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">-mcpu=v1</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif"> and </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">v2</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">:</tspan></text><text x="394" y="494" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">"Invalid usage of the XADD return value"</text><text x="394" y="512" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#4A5056">BPFMIPreEmitChecking</text><text x="394" y="78" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#0F6E56" font-weight="700">BPFAbstractMemberAccess</text><text x="394" y="96" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">pipeline start: a CO-RE field read</text><text x="394" y="114" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">becomes a named, patchable constant</text><path d="M388,78 L382,78 L382,114 L192.0,114" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-dasharray="5 4"/><circle cx="192.0" cy="114" r="3" fill="#0F6E56"/><text x="394" y="146" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#0F6E56" font-weight="700">BPFAdjustOpt · BPFIRPeephole</text><text x="394" y="164" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">steer general passes toward code</text><text x="394" y="182" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">the kernel's checker can follow</text><path d="M388,146 L372,149" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-dasharray="5 4"/><circle cx="372" cy="149" r="3" fill="#0F6E56"/><text x="394" y="212" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#0F6E56" font-weight="700">BPFCheckAndAdjustIR</text><text x="394" y="230" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">last IR fix-ups before selection</text><path d="M388,212 L372,207" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-dasharray="5 4"/><circle cx="372" cy="207" r="3" fill="#0F6E56"/><text x="394" y="262" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#0F6E56" font-weight="700">BPFMISimplifyPatchable</text><text x="394" y="280" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">folds the CO-RE constant into</text><text x="394" y="298" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">the instruction that uses it</text><path d="M388,262 L358,247" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-dasharray="5 4"/><circle cx="358" cy="247" r="3" fill="#0F6E56"/><path d="M394,590 L434,590" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#ah-10-1p-k)"/><text x="442" y="590" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">the build, top to bottom</text><path d="M394,614 L434,614" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-dasharray="5 4"/><text x="442" y="614" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#0F6E56">where a pass of the BPF target runs</text></svg>