<svg viewBox="0 0 680 454" width="100%" role="img" aria-label="bpf_check() in verifier.c runs once each time a program is loaded, in three phases: 1, check the shape (jumps in range, no dead code, loops found), bpf_check_cfg() in cfg.c; 2, walk every path, do_check() in verifier.c, where do_check_insn() picks a checker by kind of instruction (check_alu_op, check_load_mem, check_helper_call, check_cond_jmp_op) and bpf_is_state_visited() in states.c asks whether a state was seen; the thick path runs from do_check_insn() to check_load_mem(), check_mem_access() and verbose() at line 6322, which calls reg_type_str() in log.c to word the type; 3, rewrite for running (ctx field loads, helper calls, small fixes), bpf_do_misc_fixups() and more in fixups.c." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>Where the verifier lives in Linux v7.2</title><defs><marker id="ah-12-2p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><defs><marker id="ah-12-2p-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="ah-12-2p-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="ah-12-2p-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker></defs><rect x="190" y="8" width="300" height="50" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="340" y="24" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#1F2328" font-weight="700" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">bpf_check()</tspan><tspan font-family=