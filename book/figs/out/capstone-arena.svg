<svg viewBox="0 0 680 304" width="100%" role="img" aria-label="The loader maps the arena, 4 MiB at 0x7fdbcae5e000, of which 28 pages are in use. Pages 0 to 26, 110,592 bytes from bpf_arena_alloc_pages, hold the sketch: a header with w = 2719, d = 5, kmin and top, then five rows of 2,719 eight-byte counters, 108,760 bytes. Page 27, from bpf_alloc, holds the sixteen nodes of the table, each with next, tid and est, linked by next. The header's top holds 0x7fdbcae79e78, the first node. The program's .bss, one page mapped by the loader, holds g.sk = 0x7fdbcae5e000. Every pointer is an address in the loader's mapping, so it reads everything with loads and no bpf() call." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>The sketch and the table of the heaviest in one arena, as the loader sees them</title><defs><marker id="ah-cap-arena" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="14" y="16" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">the loader’s mapping of the arena: 4 MiB at 0x7fdbcae5e000 (1,024 pages, 28 in use)</text><rect x="14" y="40" width="470" height="120" rx="3" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><rect x="14" y="40" width="110" height="120" rx="3" fill="#F3F4F2" stroke="#1F2328" stroke-width="1.3"/><text x="69" y="60" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">header</text><text x="24" y="86" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">w = 2719</text><text x="24" y="106" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">d = 5</text><text x="24" y="126" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">kmin</text><text x="24" y="146" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">top</text><text x="304" y="62" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">c[5][2719]: the counters</text><text x="304" y="84" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">108,760 bytes, 8 a counter</text><rect x="140" y="100" width="330" height="8" rx="1" fill="#F3F4F2" stroke="#867F71" stroke-width="0.8"/><rect x="140" y="111" width="330" height="8" rx="1" fill="#F3F4F2" stroke="#867F71" stroke-width="0.8"/><rect x="140" y="122" width="330" height="8" rx="1" fill="#F3F4F2" stroke="#867F71" stroke-width="0.8"/><rect x="140" y="133" width="330" height="8" rx="1" fill="#F3F4F2" stroke="#867F71" stroke-width="0.8"/><rect x="140" y="144" width="330" height="8" rx="1" fill="#F3F4F2" stroke="#867F71" stroke-width="0.8"/><text x="249" y="176" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">pages 0 to 26: 110,592 bytes from bpf_arena_alloc_pages() in init</text><rect x="500" y="40" width="166" height="120" rx="3" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="583" y="58" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">page 27</text><text x="583" y="176" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">from bpf_alloc()</text><rect x="516" y="74" width="134" height="16" rx="2" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2.0"/><text x="583" y="82" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14" fill="#1F2328">next · tid · est</text><rect x="516" y="94" width="134" height="16" rx="2" fill="#F3F4F2" stroke="#0F6E56" stroke-width="1.2"/><text x="583" y="102" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14" fill="#1F2328">next · tid · est</text><rect x="516" y="114" width="134" height="16" rx="2" fill="#F3F4F2" stroke="#0F6E56" stroke-width="1.2"/><text x="583" y="122" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14" fill="#1F2328">next · tid · est</text><rect x="516" y="134" width="134" height="16" rx="2" fill="#F3F4F2" stroke="#0F6E56" stroke-width="1.2"/><text x="583" y="142" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14" fill="#1F2328">… 16 nodes</text><path d="M652,82 L660,82 L660,92 L652,92" fill="none" stroke="#0F6E56" stroke-width="1.4" marker-end="url(#ah-cap-arena)"/><path d="M652,102 L660,102 L660,112 L652,112" fill="none" stroke="#0F6E56" stroke-width="1.4" marker-end="url(#ah-cap-arena)"/><path d="M652,122 L660,122 L660,132 L652,132" fill="none" stroke="#0F6E56" stroke-width="1.4" marker-end="url(#ah-cap-arena)"/><path d="M66,148 L66,200 L494,200 L494,82 L514,82" fill="none" stroke="#0F6E56" stroke-width="2.2" marker-end="url(#ah-cap-arena)"/><text x="280" y="214" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#0F6E56">top = 0x7fdbcae79e78, the first node</text><rect x="14" y="252" width="230" height="44" rx="3" fill="#F3F4F2" stroke="#1F2328" stroke-width="1.3"/><text x="129" y="266" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">.bss: one page, mmap()ed</text><text x="129" y="285" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">g.sk = 0x7fdbcae5e000</text><path d="M30,252 L30,162" fill="none" stroke="#1F2328" stroke-width="2.0" marker-end="url(#ah-cap-arena)"/><text x="262" y="262" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">the program stores each pointer as an address of this mapping;</text><text x="262" y="282" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">the loader reads all of it with loads, and no bpf() call</text></svg>