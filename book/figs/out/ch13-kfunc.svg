<svg viewBox="0 0 680 418" width="100%" role="img" aria-label="Left, when the kernel is built and boots: __bpf_kfunc struct task_struct *bpf_task_from_pid(s32 pid) in helpers.c; BTF_KFUNCS_START(generic_btf_ids) and BTF_ID_FLAGS(func, bpf_task_from_pid, KF_ACQUIRE | KF_RET_NULL), whose .BTF_ids entry holds 0 until resolve_btfids writes the BTF ID, 82636, as the kernel is linked; kfunc_init(), a late_initcall, calls register_btf_kfunc_id_set(BPF_PROG_TYPE_TRACING, &amp;generic_kfunc_set); the TRACING hook also holds tracepoint programs and five more types get the set. Right, when the counter calls a kfunc: clang emits call -0x1 with R_BPF_64_32 bpf_task_from_pid for an extern __ksym; libbpf writes src_reg 2 and imm 82636 from /sys/kernel/btf/vmlinux; check_kfunc_call() looks the ID up in the set for this hook, checks the arguments against the BTF prototype, R0=trusted_ptr_or_null_task_struct(id=2), KF_RET_NULL means r0 must be tested before use and KF_ACQUIRE that refs=2 must be released before exit; kallsyms_lookup_name() and the rewrite give call bpf_task_from_pid#279936." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>A kfunc registered when the kernel boots and checked when a program that calls it is loaded</title><defs><marker id="ah-13-4p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><defs><marker id="ah-13-4p-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="ah-13-4p-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker></defs><text x="152.0" y="14" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">when the kernel is built and boots</text><text x="512.0" y="14" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">when the counter calls a kfunc</text><rect x="8" y="32" width="288" height="50" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="17" y="48" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-weight="700" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">__bpf_kfunc struct task_struct *</tspan></text><text x="17" y="66" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-weight="700" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">bpf_task_from_pid(s32 pid)</tspan></text><text x="287" y="66" text-anchor="end" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">helpers.c</text><path d="M152.0,82 L152.0,99" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-13-4p-k)"/><rect x="8" y="100" width="288" height="122" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="17" y="116" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">BTF_KFUNCS_START(generic_btf_ids)</tspan></text><text x="17" y="134" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">BTF_ID_FLAGS(func, bpf_task_from_pid,</tspan></text><text x="33" y="152" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-weight="700" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">KF_ACQUIRE | KF_RET_NULL)</tspan></text><text x="17" y="170" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">.BTF_ids</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif"> holds 0 until</tspan></text><text x="17" y="188" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">resolve_btfids</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif"> writes the BTF ID,</tspan></text><text x="17" y="206" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">82636, as the kernel is linked</tspan></text><path d="M152.0,222 L152.0,239" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-13-4p-k)"/><rect x="8" y="240" width="288" height="140" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="17" y="256" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-weight="700" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">kfunc_init()</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">, a late_initcall:</tspan></text><text x="17" y="274" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">register_btf_kfunc_id_set(</tspan></text><text x="33" y="292" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">BPF_PROG_TYPE_TRACING,</tspan></text><text x="33" y="310" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">&amp;generic_kfunc_set)</tspan></text><text x="17" y="328" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">the TRACING hook also holds</tspan></text><text x="17" y="346" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">tracepoint programs; five more</tspan></text><text x="17" y="364" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">types get the set</tspan></text><rect x="352" y="32" width="320" height="50" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="361" y="48" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">clang: extern … </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">bpf_task_from_pid()</tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace"> __ksym</tspan></text><text x="361" y="66" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-weight="700" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">call -0x1  R_BPF_64_32 bpf_task_from_pid</tspan></text><path d="M512.0,82 L512.0,99" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-13-4p-k)"/><rect x="352" y="100" width="320" height="50" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="361" y="116" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">libbpf, from </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">/sys/kernel/btf/vmlinux</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">:</tspan></text><text x="361" y="134" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-weight="700" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">src_reg 2 (kfunc call), imm 82636</tspan></text><path d="M512.0,150 L512.0,167" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-13-4p-k)"/><rect x="352" y="168" width="320" height="104" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2.6"/><text x="361" y="184" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#0F6E56" font-weight="700" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">check_kfunc_call()</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">: in a set for this hook?</tspan></text><text x="361" y="202" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">then arguments against the BTF prototype:</tspan></text><text x="361" y="220" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">R0=trusted_ptr_or_null_task_struct(id=2)</tspan></text><text x="361" y="238" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">KF_RET_NULL</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">: test r0 before any use;</tspan></text><text x="361" y="256" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">KF_ACQUIRE</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">: release refs=2 before exit</tspan></text><path d="M512.0,272 L512.0,289" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-13-4p-k)"/><rect x="352" y="290" width="320" height="50" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="361" y="306" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">kallsyms_lookup_name()</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">, then the rewrite:</tspan></text><text x="361" y="324" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-weight="700" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">call bpf_task_from_pid#279936</tspan></text><path d="M296,270 L324,270 L324,184 L350,184" fill="none" stroke="#0F6E56" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-13-4p-a)"/><path d="M8,404 L48,404" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-13-4p-k)"/><text x="56" y="404" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">the next step</text><path d="M170,404 L210,404" fill="none" stroke="#0F6E56" stroke-width="2" stroke-dasharray="6 4"/><text x="218" y="404" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#0F6E56">the check looks the BTF ID up in the sets registered for the hook</text></svg>