<svg viewBox="0 0 680 400" width="100%" role="img" aria-label="Four rows, each a question with a yes cell and a no cell: ring buffer or a map with keys; array or hash; LRU hash or keep the type; per-CPU form or one value added in place. The write counter’s cells have thick accent outlines" font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>Choosing a map in four questions asked in order</title><defs><marker id="ah-15-5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="120.0" y="12" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-weight="700" xml:space="preserve">ask in order</text><text x="352.0" y="12" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-weight="700" xml:space="preserve">yes</text><text x="570.0" y="12" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-weight="700" xml:space="preserve">no</text><rect x="4" y="30" width="232" height="66" rx="5" fill="#E4E6E8" stroke="#4A5056" stroke-width="0.9"/><text x="14" y="54.0" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" xml:space="preserve">Must user space see every</text><text x="14" y="72.0" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" xml:space="preserve">event, in order, soon?</text><rect x="246" y="30" width="212" height="66" rx="5" fill="#FFFFFF" stroke="#4A5056" stroke-width="0.9"/><text x="256" y="45" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-weight="600" xml:space="preserve">RINGBUF</text><text x="256" y="64" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" xml:space="preserve">one buffer for all CPUs;</text><text x="256" y="81" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" xml:space="preserve">stop here</text><rect x="464" y="30" width="212" height="66" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2.4"/><text x="474" y="45" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#0F6E56" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-weight="600" xml:space="preserve">a map with keys</text><text x="474" y="64" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" xml:space="preserve">go on to the next</text><text x="474" y="81" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" xml:space="preserve">question</text><line x1="120.0" y1="96" x2="120.0" y2="107" stroke="#4A5056" stroke-width="1.2" marker-end="url(#ah-15-5)"/><rect x="4" y="108" width="232" height="66" rx="5" fill="#E4E6E8" stroke="#4A5056" stroke-width="0.9"/><text x="14" y="132.0" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" xml:space="preserve">Are the keys small integers</text><text x="14" y="150.0" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" xml:space="preserve">known in advance?</text><rect x="246" y="108" width="212" height="66" rx="5" fill="#FFFFFF" stroke="#4A5056" stroke-width="0.9"/><text x="256" y="123" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-weight="600" xml:space="preserve">ARRAY</text><text x="256" y="142" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" xml:space="preserve">every entry exists; the</text><text x="256" y="159" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" xml:space="preserve">lookup is inlined</text><rect x="464" y="108" width="212" height="66" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2.4"/><text x="474" y="123" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#0F6E56" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-weight="600" xml:space="preserve">HASH</text><text x="474" y="142" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" xml:space="preserve">made in advance, up to</text><text x="474" y="159" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">max_entries</tspan></text><line x1="120.0" y1="174" x2="120.0" y2="185" stroke="#4A5056" stroke-width="1.2" marker-end="url(#ah-15-5)"/><rect x="4" y="186" width="232" height="66" rx="5" fill="#E4E6E8" stroke="#4A5056" stroke-width="0.9"/><text x="14" y="210.0" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" xml:space="preserve">Can the set of keys outgrow</text><text x="14" y="228.0" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">max_entries</tspan>: threads, flows?</text><rect x="246" y="186" width="212" height="66" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2.4"/><text x="256" y="201" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#0F6E56" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-weight="600" xml:space="preserve">LRU_HASH</text><text x="256" y="220" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" xml:space="preserve">evicts the least recently</text><text x="256" y="237" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" xml:space="preserve">used entry to make room</text><rect x="464" y="186" width="212" height="66" rx="5" fill="#FFFFFF" stroke="#4A5056" stroke-width="0.9"/><text x="474" y="201" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-weight="600" xml:space="preserve">keep the type</text><text x="474" y="220" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" xml:space="preserve">a full <tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">HASH</tspan> refuses a</text><text x="474" y="237" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" xml:space="preserve">new key with <tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">‑E2BIG</tspan></text><line x1="120.0" y1="252" x2="120.0" y2="263" stroke="#4A5056" stroke-width="1.2" marker-end="url(#ah-15-5)"/><rect x="4" y="264" width="232" height="66" rx="5" fill="#E4E6E8" stroke="#4A5056" stroke-width="0.9"/><text x="14" y="288.0" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" xml:space="preserve">Do several CPUs write one</text><text x="14" y="306.0" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" xml:space="preserve">key at the same moment?</text><rect x="246" y="264" width="212" height="66" rx="5" fill="#FFFFFF" stroke="#4A5056" stroke-width="0.9"/><text x="256" y="279" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-weight="600" xml:space="preserve">PERCPU_ form</text><text x="256" y="298" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" xml:space="preserve">memory × CPUs, and the</text><text x="256" y="315" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" xml:space="preserve">reader adds the copies</text><rect x="464" y="264" width="212" height="66" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2.4"/><text x="474" y="279" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#0F6E56" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-weight="600" xml:space="preserve">one value, added in place</text><text x="474" y="298" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" xml:space="preserve">__sync_fetch_and_add()</text><text x="474" y="315" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" xml:space="preserve">through the lookup’s pointer</text><text x="8" y="350" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#0F6E56" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-weight="600" xml:space="preserve">Thick accent outlines mark the write counter’s answers.</text><rect x="20" y="366" width="640" height="28" rx="6" fill="#E4E6E8" stroke="#4A5056" stroke-width="0.75"/><text x="340" y="380" text-anchor="middle" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" xml:space="preserve">Then check the contexts table: a sleepable program cannot use a perf buffer.</text></svg>