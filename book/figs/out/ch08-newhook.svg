<svg viewBox="0 0 680 352" width="100%" role="img" aria-label="Five rows. The page cache calls through a function pointer in the struct_ops table, struct cachebpf_ops, when it sets up a cgroup, needs room, a page comes in, a page is read and a page leaves; the pointers are filled when the policy loads by its five BPF programs, policy_init, evict_folios, folio_added, folio_accessed and folio_removed. The call sites are 210 lines. The programs call kfuncs, list_create, list_add, list_move and more, the eviction-list API, 750 lines; the verifier and registration, which kfuncs and which callbacks, take 80 + 580 lines." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>What cache_ext added to the kernel to make a new hook</title><defs><marker id="ah-8-4p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><defs><marker id="ah-8-4p-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="ah-8-4p-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="ah-8-4p-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker></defs><text x="110" y="16" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">the page cache</text><text x="110" y="36" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">five events</text><text x="345.0" y="16" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">struct_ops table</text><text x="345.0" y="36" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">struct cachebpf_ops</text><text x="578" y="16" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">the policy</text><text x="578" y="36" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">five BPF programs</text><rect x="264" y="51" width="162" height="158" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2.2"/><text x="196" y="70" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328">set up a cgroup</text><path d="M204,70 L268,70" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-8-4p-k)"/><rect x="270" y="58" width="150" height="24" rx="3" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="345.0" y="70" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">function pointer</text><path d="M488,70 L422,70" fill="none" stroke="#0F6E56" stroke-width="2.8" marker-end="url(#ah-8-4p-t)"/><text x="496" y="70" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">policy_init</text><text x="196" y="100" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328">needs room</text><path d="M204,100 L268,100" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-8-4p-k)"/><rect x="270" y="88" width="150" height="24" rx="3" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="345.0" y="100" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">function pointer</text><path d="M488,100 L422,100" fill="none" stroke="#0F6E56" stroke-width="2.8" marker-end="url(#ah-8-4p-t)"/><text x="496" y="100" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">evict_folios</text><text x="196" y="130" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328">a page comes in</text><path d="M204,130 L268,130" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-8-4p-k)"/><rect x="270" y="118" width="150" height="24" rx="3" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="345.0" y="130" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">function pointer</text><path d="M488,130 L422,130" fill="none" stroke="#0F6E56" stroke-width="2.8" marker-end="url(#ah-8-4p-t)"/><text x="496" y="130" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">folio_added</text><text x="196" y="160" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328">a page is read</text><path d="M204,160 L268,160" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-8-4p-k)"/><rect x="270" y="148" width="150" height="24" rx="3" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="345.0" y="160" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">function pointer</text><path d="M488,160 L422,160" fill="none" stroke="#0F6E56" stroke-width="2.8" marker-end="url(#ah-8-4p-t)"/><text x="496" y="160" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">folio_accessed</text><text x="196" y="190" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328">a page leaves</text><path d="M204,190 L268,190" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-8-4p-k)"/><rect x="270" y="178" width="150" height="24" rx="3" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="345.0" y="190" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">function pointer</text><path d="M488,190 L422,190" fill="none" stroke="#0F6E56" stroke-width="2.8" marker-end="url(#ah-8-4p-t)"/><text x="496" y="190" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">folio_removed</text><text x="110" y="228" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">210 lines of call sites</text><text x="345.0" y="228" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#0F6E56">filled in when the policy loads</text><path d="M578,202 L578,256" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-8-4p-k)"/><text x="588" y="230" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">the programs call</text><rect x="346" y="258" width="330" height="54" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text font-weight="700" x="511" y="276" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#1F2328" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">kfuncs: </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">list_create, list_add, list_move, …</tspan></text><text x="511" y="297" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">the eviction-list API the programs call · 750 lines</text><rect x="8" y="258" width="324" height="54" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="170" y="276" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">the verifier and registration</text><text x="170" y="297" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">which kfuncs, which callbacks · 80 + 580 lines</text><path d="M8,336 L50,336" fill="none" stroke="#1F2328" stroke-width="1.5"/><text x="58" y="336" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">the page cache calls through the table</text><path d="M300,336 L342,336" fill="none" stroke="#0F6E56" stroke-width="2.8"/><text x="350" y="336" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">a program fills a slot when the policy loads</text></svg>