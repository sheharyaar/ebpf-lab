<svg viewBox="0 0 680 626" width="100%" role="img" aria-label="Flowchart of bpf_is_state_visited in Linux v7.2. First: does a finished state saved at this instruction cover the current one? If yes the path is pruned. Second: is an earlier round of this path at this instruction identical? If yes the program is refused with infinite loop detected. Third: have two jumps and eight instructions passed since the last save? If yes a checkpoint is saved. Then the walk goes on." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>What the walk does at a prune point</title><defs><marker id="ah-walk-cp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect x="70" y="8" width="320" height="56" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="230.0" y="26.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">bpf_is_state_visited()</text><text x="230.0" y="47.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">at a jump, a jump target or after a call</text><path d="M230,64 L230,92" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-walk-cp)"/><polygon points="70,150 230,94 390,150 230,206" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="230" y="140" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328">does a finished state saved</text><text x="230" y="160" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328">here cover this one?</text><path d="M390,150 L452,150" fill="none" stroke="#0F6E56" stroke-width="3" marker-end="url(#ah-walk-cp)"/><text x="402" y="136" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#0F6E56" font-weight="700">yes</text><rect x="456" y="118" width="216" height="64" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2.6"/><text x="564.0" y="140.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#0F6E56" font-weight="700">path done: pruned</text><text x="564.0" y="162.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">the log says “25: safe”</text><text x="218" y="222" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">no</text><path d="M230,206 L230,250" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-walk-cp)"/><polygon points="70,306 230,250 390,306 230,362" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="230" y="296" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328">is an earlier round of this</text><text x="230" y="316" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328">path at this slot identical?</text><path d="M390,306 L452,306" fill="none" stroke="#1F2328" stroke-width="3" marker-end="url(#ah-walk-cp)"/><text x="402" y="292" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">yes</text><rect x="456" y="274" width="216" height="64" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="2.6"/><text x="564.0" y="296.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">refused: infinite loop</text><text x="564.0" y="318.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">-EINVAL, the load ends</text><text x="218" y="378" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">no</text><path d="M230,362 L230,406" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-walk-cp)"/><polygon points="70,462 230,406 390,462 230,518" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="230" y="452" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328">2 jumps and 8 instructions</text><text x="230" y="472" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328">since the last save?</text><path d="M390,462 L452,462" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-walk-cp)"/><text x="402" y="448" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">yes</text><rect x="456" y="436" width="216" height="52" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="564.0" y="462.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328">save a checkpoint</text><text x="218" y="534" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">no</text><path d="M230,518 L230,562" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-walk-cp)"/><path d="M564,488 L564,590 L392,590" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-walk-cp)"/><rect x="68" y="564" width="324" height="52" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="230.0" y="590.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328">walk on to the next instruction</text><text x="8" y="228" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">cover: at least as general in</text><text x="8" y="246" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">every live register and slot</text><text x="456" y="360" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">at bpf_loop, iterator and may_goto</text><text x="456" y="378" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">slots, a state within the earlier</text><text x="456" y="396" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">round’s also ends the path</text><text x="8" y="534" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">in a loop: 20 jumps</text><text x="8" y="552" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">or 100 instructions</text></svg>