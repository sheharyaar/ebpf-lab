<svg viewBox="0 0 680 542" width="100%" role="img" aria-label="Flowchart of the counter: slots 0 to 8, then the test at slot 9. Path 1 falls through to slots 10 and 11, then 12 to 24, 25 and the exit at 26, 24 instructions, saving states at slots 9 and 25. Path 2 jumps to slot 12 and stops at slot 25, where its state matches the saved one, after 12 instructions." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>The verifier walks the write counter: two paths, one cut short</title><defs><marker id="ah-4-2f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><defs><marker id="ah-4-2f-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker></defs><path d="M500,18 L548,18" fill="none" stroke="#1F2328" stroke-width="2.2"/><text x="556" y="18" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="600">path 1</text><path d="M500,42 L548,42" fill="none" stroke="#0F6E56" stroke-width="2.2" stroke-dasharray="7 5"/><text x="556" y="42" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#0F6E56" font-weight="600">path 2</text><rect x="200" y="10" width="280" height="54" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="340.0" y="28.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">slots 0–8</text><text x="340.0" y="48.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">put the key on the stack, look it up</text><polygon points="220,146 340,104 460,146 340,188" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="340" y="135" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">slot 9</text><text x="340" y="157" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328">r0 == 0 ?</text><rect x="200" y="224" width="280" height="54" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="340.0" y="242.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">slots 10–11</text><text x="340.0" y="262.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">read the count, add one</text><rect x="200" y="312" width="280" height="54" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="340.0" y="330.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">slots 12–24</text><text x="340.0" y="350.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">print, update the map</text><rect x="200" y="400" width="280" height="54" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="340.0" y="418.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">slot 25</text><text x="340.0" y="438.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">set the return value to 0</text><rect x="200" y="488" width="280" height="48" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="340.0" y="503.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">slot 26</text><text x="340.0" y="523.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">exit</text><path d="M340,64 L340,102" fill="none" stroke="#1F2328" stroke-width="2.2" marker-end="url(#ah-4-2f)"/><path d="M340,188 L340,222" fill="none" stroke="#1F2328" stroke-width="2.2" marker-end="url(#ah-4-2f)"/><path d="M340,278 L340,310" fill="none" stroke="#1F2328" stroke-width="2.2" marker-end="url(#ah-4-2f)"/><path d="M328,366 L328,398" fill="none" stroke="#1F2328" stroke-width="2.2" marker-end="url(#ah-4-2f)"/><path d="M340,454 L340,486" fill="none" stroke="#1F2328" stroke-width="2.2" marker-end="url(#ah-4-2f)"/><text x="328" y="84" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056" font-style="italic">r0 = map value or NULL</text><text x="352" y="204" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">no</text><text x="328" y="204" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056" font-style="italic">r0 = map value</text><path d="M460,146 L560,146 L560,339 L482,339" fill="none" stroke="#0F6E56" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ah-4-2f-2)"/><path d="M352,366 L352,398" fill="none" stroke="#0F6E56" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ah-4-2f-2)"/><text x="470" y="132" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#0F6E56" font-weight="700">yes</text><text x="572" y="214" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#0F6E56">jump to slot 12</text><text x="572" y="234" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#0F6E56" font-style="italic">r0 = 0</text><line x1="202" y1="146" x2="220" y2="146" stroke="#4A5056" stroke-width="1.2"/><rect x="98" y="134" width="104" height="24" rx="12" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="150" y="146" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">state saved</text><line x1="182" y1="427" x2="200" y2="427" stroke="#4A5056" stroke-width="1.2"/><rect x="78" y="415" width="104" height="24" rx="12" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="130" y="427" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">state saved</text><line x1="492" y1="414" x2="492" y2="440" stroke="#0F6E56" stroke-width="3"/><text x="502" y="418" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#0F6E56" font-weight="600">path 2 stops here:</text><text x="502" y="438" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#0F6E56">same state as the saved one</text><text x="502" y="458" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#0F6E56">12 instructions walked</text><text x="492" y="504" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="600">path 1 ends: 24 instructions</text><text x="492" y="524" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">36 walked in all</text></svg>