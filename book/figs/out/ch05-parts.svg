<svg viewBox="0 0 680 226" width="100%" role="img" aria-label="Log (b), seven lines, each named at the right, read from the bottom up: the statistics line, printed even on rejection; the reason in two lines, which rule failed and for which register; the instruction where the walk stopped, slot 10; the next C line; slot 9, an instruction, then what it changed; the C line, from the object's BTF." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>The parts of one rejection log</title><defs><marker id="ah-5-2p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><defs><marker id="ah-5-2p-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="ah-5-2p-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker></defs><text xml:space="preserve" x="46" y="23.0" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">; if (curr_val) { @ past.bpf.c:18</text><text x="676" y="23.0" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">the C line, from the object's BTF</text><text xml:space="preserve" x="46" y="53.0" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">9: (15) if r0 == 0x0 goto pc+2 ; R0=map_value(…,vs=8)</text><text x="676" y="53.0" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328" font-style="italic">an instruction, then what it changed</text><line x1="46" y1="38" x2="676" y2="38" stroke="#D3D6D9" stroke-width="0.8"/><text xml:space="preserve" x="46" y="83.0" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">; __atomic_fetch_add(…, *(curr_val + 1), …); @ past.bpf.c:19</text><text x="676" y="83.0" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">the next C line</text><line x1="46" y1="68" x2="676" y2="68" stroke="#D3D6D9" stroke-width="0.8"/><text xml:space="preserve" x="46" y="113.0" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328" font-weight="700">10: (79) r1 = *(u64 *)(r0 +8)</text><text x="676" y="113.0" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328" font-style="italic">where the walk stopped</text><line x1="46" y1="98" x2="676" y2="98" stroke="#D3D6D9" stroke-width="0.8"/><text xml:space="preserve" x="46" y="143.0" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#0F6E56" font-weight="700">invalid access to map value, value_size=8 off=8 size=8</text><text x="676" y="143.0" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#0F6E56" font-weight="600" font-style="italic">the reason: which rule failed,</text><line x1="46" y1="128" x2="676" y2="128" stroke="#D3D6D9" stroke-width="0.8"/><text xml:space="preserve" x="46" y="173.0" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#0F6E56" font-weight="700">R0 min value is out