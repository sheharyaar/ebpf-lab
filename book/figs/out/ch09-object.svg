<svg viewBox="0 0 680 502" width="100%" role="img" aria-label="The struct bpf_htab object, 896 bytes, holding struct bpf_map (type hash, key 4 B, value 8 B, max_entries 1024, id 7 and two counts, and an ops pointer to htab_map_ops with .map_lookup_elem, .map_update_elem, .map_get_next_key, .map_gen_lookup and 16 more), a random seed hashrnd and the buckets, elems and freelist pointers; 1024 buckets of 16 bytes, each a list head and a lock, bucket k holding a list of two elements; 1024 + 16 preallocated elements of 64 bytes, one drawn byte by byte: list 16, lru / pptr 24, hash 4 and 4 of rounding, key 8, value 8, so the value is at element + 56. 896 + 1024 × 16 + 1040 × 64 + 16 × 8 = 83,968 bytes, set aside before the first write." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>The hash map the loader created, in kernel memory</title><defs><marker id="ah-9-2p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><defs><marker id="ah-9-2p-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="ah-9-2p-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker></defs><rect x="8" y="8" width="240" height="228" rx="5" fill="#EEF0F1" stroke="#4A5056" stroke-width="1.2"/><text x="128" y="26" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#1F2328" font-weight="700" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">struct bpf_htab</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif"> · 896 B</tspan></text><rect x="20" y="42" width="216" height="132" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"