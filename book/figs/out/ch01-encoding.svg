<svg viewBox="0 0 680 366" width="100%" role="img" aria-label="Eight bytes cut two ways: the 1993 layout, op 16 bits, jt 8, jf 8, k 32 bits; the 2014 layout, opcode 8 bits, src and dst 4 bits each, offset 16 bits signed, immediate 32 bits signed. Slot 4 of the counter, bf a2 then six zero bytes, reads as r2 = r10: a move, src r10, dst r2, offset and immediate unused. Slot 8, 85 00 00 00 01 00 00 00, reads as call 1: the immediate 01 00 00 00 is 1, little-endian, helper 1." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>One eBPF instruction, field by field</title><defs><marker id="ah-1-2p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="20" y="12" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">1993 · classic BPF</text><rect x="20" y="24" width="156" height="34" rx="5" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.1"/><text x="98.0" y="41" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">op · 16 bits</text><rect x="180" y="24" width="76" height="34" rx="5" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.1"/><text x="218.0" y="41" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">jt · 8</text><rect x="260" y="24" width="76" height="34" rx="5" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.1"/><text x="298.0" y="41" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">jf · 8</text><rect x="340" y="24" width="316" height="34" rx="5" fill="#FFFFFF" strok