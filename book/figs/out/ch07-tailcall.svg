<svg viewBox="0 0 680 440" width="100%" role="img" aria-label="Program A calls bpf_tail_call(ctx, &amp;progs, 2). Three checks follow: is 2 below max_entries, fewer than 33 tail calls, does slot 2 hold a program; a no to any goes on at A's next instruction. With three yeses the count goes up by one, A's registers are freed and the code jumps into program B, slot 2 of the program array progs, past B's endbr64, nops, push %rbp and mov %rsp, %rbp, landing on a second endbr64 before B's own code." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>A tail call on x86</title><defs><marker id="ah-7-4p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><defs><marker id="ah-7-4p-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="ah-7-4p-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="ah-7-4p-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker></defs><rect x="30" y="8" width="260" height="58" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="160" y="25" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">program A</text><text x="160" y="47" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328" font-weight="700">bpf_tail_call(ctx, &amp;progs, 2)</text><path d="M160,66 L160,85" fill="none" stroke="#0F6E56" stroke-width="2.8" marker-end="url(#ah-7-4p-t)"/><polygon points="30,114 160,87 290,114 160,141" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="160" y="114" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#1F2328" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">is 2 below </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">max_entries</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">?</tspan></text><path d="M160,141 L160,161" fill="none" stroke="#0F6E56" stroke-width="2.8" marker-end="url(#ah-7-4p-t)"/><text x="170" y="152" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#0F6E56" font-weight="700">yes</text><path d="M290,114 L318,114" fill="none" stroke="#1F2328" stroke-width="1.5"/><text x="296" y="102" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">no</text><polygon points="30,190 160,163 290,190 160,217" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="160" y="190" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#1F2328" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">fewer than 33 tail calls?</tspan></text><path d="M160,217 L160,237" fill="none" stroke="#0F6E56" stroke-width="2.8" marker-end="url(#ah-7-4p-t)"/><text x="170" y="228" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#0F6E56" font-weight="700">yes</text><path d="M290,190 L318,190" fill="none" stroke="#1F2328" stroke-width="1.5"/><text x="296" y="178" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">no</text><polygon points="30,266 160,239 290,266 160,293" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="160" y="266" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#1F2328" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">does slot 2 hold a program?</tspan></text><path d="M160,293 L160,344" fill="none" stroke="#0F6E56" stroke-width="2.8" marker-end="url(#ah-7-4p-t)"/><text x="170" y="304" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#0F6E56" font-weight="700">yes</text><path d="M290,266 L318,266" fill="none" stroke="#1F2328" stroke-width="1.5"/><text x="296" y="254" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">no</text><path d="M318,114 L318,266" fill="none" stroke="#1F2328" stroke-width="1.5"/><path d="M318,190 L344,190" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-7-4p-k)"/><rect x="346" y="170" width="130" height="40" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="411" y="190" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328">A's next instruction</text><text x="560" y="16" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">progs</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">: a program array</tspan></text><text x="492" y="40" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">0</text><rect x="470" y="52" width="44" height="32" rx="4" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.2"/><text x="492" y="68" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">–</text><text x="540" y="40" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">1</text><rect x="518" y="52" width="44" height="32" rx="4" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.2"/><text x="540" y="68" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">C</text><text x="588" y="40" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">2</text><rect x="566" y="52" width="44" height="32" rx="4" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2.4"/><text x="588" y="68" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#0F6E56" font-weight="700">B</text><text x="636" y="40" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">3</text><rect x="614" y="52" width="44" height="32" rx="4" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.2"/><text x="636" y="68" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">–</text><rect x="30" y="344" width="260" height="44" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.6"/><text x="160" y="366" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328">count + 1, free A's registers</text><path d="M290,366 L398,366" fill="none" stroke="#0F6E56" stroke-width="2.8" marker-end="url(#ah-7-4p-t)"/><text x="344" y="354" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#0F6E56" font-weight="700">jump</text><rect x="400" y="234" width="276" height="172" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="538" y="252" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">program B</text><text x="416" y="276" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#4A5056">endbr64</text><text x="416" y="295" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">5-byte nop, 3-byte nop</text><text x="416" y="314" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#4A5056">push %rbp</text><text x="416" y="333" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#4A5056">mov %rsp, %rbp</text><path d="M590,268 h7 v65 h-7" fill="none" stroke="#4A5056" stroke-width="1.2"/><text x="605" y="300" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">skipped</text><text x="416" y="366" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#0F6E56" font-weight="700">endbr64</text><text x="486" y="366" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#0F6E56" font-style="italic">lands here</text><text x="416" y="388" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328">B's own code</text><path d="M30,424 L72,424" fill="none" stroke="#0F6E56" stroke-width="2.8"/><text x="80" y="424" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">the tail call taken</text><path d="M230,424 L272,424" fill="none" stroke="#1F2328" stroke-width="1.5"/><text x="280" y="424" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">a check fails</text></svg>