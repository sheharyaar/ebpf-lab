<svg viewBox="0 0 680 328" width="100%" role="img" aria-label="Three rows. The kernel build, once per kernel: kernel source and its config, DWARF, BTF made by pahole, published as /sys/kernel/btf/vmlinux, 6.5 MB on kernel 7.2. The build machine, once per header: bpftool btf dump reads that file and writes vmlinux.h, 166,183 lines; clang notes each read in the .bpf.o, code plus records. The machine that loads it, at every start: libbpf reads that machine's /sys/kernel/btf/vmlinux and answers each record from that kernel's types." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>Where vmlinux.h comes from, and where the kernel types are read again</title><defs><marker id="ah-3-1p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><defs><marker id="ah-3-1p-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="ah-3-1p-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="ah-3-1p-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker></defs><text x="24" y="14" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">the kernel build: once per kernel</text><rect x="24" y="28" width="124" height="52" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="86.0" y="44.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">kernel source</text><text x="86.0" y="65.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">and its config</text><rect x="176" y="28" width="124" height="52" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="238.0" y="44.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">DWARF</text><text x="238.0" y="65.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">compiler debug info</text><rect x="328" y="28" width="124" height="52" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="390.0" y="44.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">BTF</text><text x="390.0" y="65.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">pahole converts it</text><rect x="480" y="28" width="190" height="52" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="575.0" y="44.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328" font-weight="700">/sys/kernel/btf/vmlinux</text><text x="575.0" y="65.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">6.5 MB on kernel 7.2</text><path d="M148,54.0 L174,54.0" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-3-1p-k)"/><path d="M300,54.0 L326,54.0" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-3-1p-k)"/><path d="M452,54.0 L478,54.0" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-3-1p-k)"/><text x="24" y="116" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">the build machine: once per header</text><rect x="30" y="130" width="170" height="52" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="115.0" y="146.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328" font-weight="700">bpftool btf dump</text><text x="115.0" y="167.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">file … format c</text><rect x="228" y="130" width="120" height="52" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="288.0" y="146.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328" font-weight="700">vmlinux.h</text><text x="288.0" y="167.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">166,183 lines</text><rect x="376" y="130" width="120" height="52" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="436.0" y="146.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">clang</text><text x="436.0" y="167.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">notes each read</text><rect x="524" y="130" width="146" height="52" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="597.0" y="146.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">the .bpf.o</text><text x="597.0" y="167.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">code + records</text><path d="M200,156.0 L226,156.0" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-3-1p-k)"/><path d="M348,156.0 L374,156.0" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-3-1p-k)"/><path d="M496,156.0 L522,156.0" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-3-1p-k)"/><path d="M575,80 L575,98 L10,98 L10,156.0 L28,156.0" fill="none" stroke="#0F6E56" stroke-width="2.8" marker-end="url(#ah-3-1p-t)"/><text x="24" y="218" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">the machine that loads it: at every start</text><rect x="24" y="232" width="190" height="52" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="119.0" y="248.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328" font-weight="700">/sys/kernel/btf/vmlinux</text><text x="119.0" y="269.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">that machine's kernel</text><rect x="372" y="232" width="298" height="52" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.8"/><text x="521.0" y="248.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">libbpf, at load</text><text x="521.0" y="269.0" text-anchor="middle" dominant-baseline="central" 