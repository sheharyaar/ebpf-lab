<svg viewBox="0 0 680 678" width="100%" role="img" aria-label="Flowchart: user space writes a program into slot k; if its type, JIT, sleepable flag or expected_attach_type differ from the owner’s, the update stops with EINVAL. Otherwise the slot is exchanged; if no direct tail call names the slot, the update is done in a few microseconds. If one does, the kernel rewrites five bytes at each such call site, with interrupts to every CPU, and when the slot was emptied it also waits for an RCU grace period at each site." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>What one update of a program-array slot does</title><defs><marker id="ah-16-5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><defs><marker id="ah-16-5a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker></defs><rect x="40.0" y="8" width="300" height="56" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190.0" y="26.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">bpf_map_update_elem()</text><text x="190.0" y="47.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">user space puts a program in slot k</text><path d="M190,64 L190,88" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#ah-16-5)"/><polygon points="40,130 190,88 340,130 190,172" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190" y="120" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328"></text><text x="190" y="140" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328"></text><text x="190" y="112" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328">type, JIT, sleepable,</text><text x="190" y="130" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14" fill="#1F2328">expected_attach_type</text><text x="190" y="148" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328">as the owner’s?</text><path d="M340,130 L398,130" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#ah-16-5)"/><text x="350" y="118" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">no</text><text x="408" y="120" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="600">stops here: ‑EINVAL,</text><text x="408" y="140" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328">the slot is unchanged</text><path d="M190,172 L190,198" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#ah-16-5)"/><text x="180" y="185" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">yes</text><rect x="40.0" y="200" width="300" height="56" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190.0" y="218.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">xchg(&amp;ptrs[k], prog)</text><text x="190.0" y="239.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">the slot holds the new program</text><path d="M190,256 L190,280" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#ah-16-5)"/><polygon points="40,322 190,280 340,322 190,364" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190" y="312" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328">does a direct tail call</text><text x="190" y="332" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328">name this map and slot k?</text><path d="M340,322 L398,322" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#ah-16-5)"/><text x="350" y="310" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">no</text><text x="408" y="312" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="600">done: 0.8 to 3.7 µs</text><text x="408" y="332" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328">in all, as for any array</text><path d="M190,364 L190,390" fill="none" stroke="#0F6E56" stroke-width="2.4" marker-end="url(#ah-16-5a)"/><text x="180" y="377" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">yes</text><rect x="40.0" y="392" width="300" height="56" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2.6"/><text x="190.0" y="410.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">bpf_arch_poke_desc_update()</text><text x="190.0" y="431.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">rewrite 5 bytes at each such site</text><text x="408" y="400" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#0F6E56">for each site: an int3, then three</text><text x="408" y="420" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#0F6E56">rounds of interrupts to every CPU;</text><text x="408" y="440" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#0F6E56" font-weight="600">0.05 to 1.1 ms a site here</text><path d="M190,448 L190,472" fill="none" stroke="#0F6E56" stroke-width="2.4" marker-end="url(#ah-16-5a)"/><polygon points="40,514 190,472 340,514 190,556" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190" y="504" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328">was the slot</text><text x="190" y="524" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328">emptied?</text><path d="M340,514 L398,514" fill="none" stroke="#0F6E56" stroke-width="2.4" marker-end="url(#ah-16-5a)"/><text x="350" y="502" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">yes</text><rect x="400" y="486" width="270" height="56" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2.6"/><text x="535.0" y="504.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">synchronize_rcu()</text><text x="535.0" y="525.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">between its two patches</text><text x="535" y="556" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#0F6E56" font-weight="600">5 to 7 ms a site, both patches included</text><path d="M190,556 L190,590" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#ah-16-5)"/><text x="180" y="573" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">no</text><path d="M535,566 L535,614 L280,614" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#ah-16-5)"/><rect x="100" y="592" width="180" height="44" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190" y="614" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">done</text><text x="10" y="662" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#0F6E56">Thick accent outlines: work done once for every program whose direct tail call names the slot.</text></svg>