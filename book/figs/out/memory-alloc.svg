<svg viewBox="0 0 680 430" width="100%" role="img" aria-label="Box diagram of the BPF memory allocator. Each CPU has a cache with eleven size classes from 16 bytes to 4 KiB; the counter's 48-byte nodes use the 64-byte class. bpf_obj_new takes one object off the free list with interrupts off. bpf_obj_drop puts it on a waiting list, which joins the free list after an RCU grace period. irq_work on the same CPU keeps the free list between 32 and 96 objects, allocating batches from the kmalloc-cg-64 slab cache and giving objects back to it." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>Where bpf_obj_new gets its memory</title><defs><marker id="ah-mem-alloc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect x="10" y="8" width="250" height="54" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="135.0" y="25.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">bpf_obj_new()</text><text x="135.0" y="46.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">in the program, any context</text><rect x="420" y="8" width="250" height="54" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="545.0" y="25.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">bpf_obj_drop()</text><text x="545.0" y="46.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">in the program</text><rect x="10" y="96" width="660" height="240" rx="6" fill="#F3F4F2" stroke="#4A5056" stroke-width="1" stroke-dasharray="5 4"/><text x="80" y="124" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">one CPU’s cache: eleven size classes</text><rect x="320" y="112" width="26" height="24" rx="3" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="333" y="124" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">16</text><rect x="347" y="112" width="26" height="24" rx="3" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="360" y="124" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">32</text><rect x="374" y="112" width="26" height="24" rx="3" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2.6"/><text x="387" y="124" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#0F6E56" font-weight="700">64</text><rect x="401" y="112" width="26" height="24" rx="3" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="414" y="124" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">96</text><rect x="428" y="112" width="26" height="24" rx="3" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="441" y="124" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">128</text><rect x="455" y="112" width="26" height="24" rx="3" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="468" y="124" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">192</text><rect x="482" y="112" width="26" height="24" rx="3" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="495" y="124" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">256</text><rect x="509" y="112" width="26" height="24" rx="3" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="522" y="124" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">512</text><rect x="536" y="112" width="26" height="24" rx="3" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="549" y="124" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">1K</text><rect x="563" y="112" width="26" height="24" rx="3" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="576" y="124" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">2K</text><rect x="590" y="112" width="26" height="24" rx="3" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="603" y="124" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">4K</text><text x="80" y="152" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">a 48-byte node and its 8-byte header take the 64-byte class (accent)</text><rect x="30" y="174" width="250" height="60" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2.6"/><text x="155.0" y="194.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">free list</text><text x="155.0" y="215.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">kept between 32 and 96</text><rect x="400" y="174" width="250" height="60" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="525.0" y="194.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">waiting list</text><text x="525.0" y="215.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">dropped, maybe still in use</text><path d="M55,170 L55,66" fill="none" stroke="#0F6E56" stroke-width="3" marker-end="url(#ah-mem-alloc)"/><text x="66" y="80" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">one off the list, interrupts off</text><path d="M640,62 L640,170" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-mem-alloc)"/><path d="M396,204 L284,204" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-mem-alloc)"/><text x="340" y="190" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">after a grace period</text><rect x="30" y="262" width="620" height="54" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="340.0" y="279.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">irq_work on the same CPU</text><text x="340.0" y="300.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">below 32: allocate a batch; above 96: give some back</text><path d="M110,238 L110,258" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-mem-alloc)"/><path d="M200,258 L200,238" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-mem-alloc)"/><rect x="30" y="366" width="620" height="54" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="340.0" y="383.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">kmalloc-cg-64</text><text x="340.0" y="404.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">the kernel’s slab cache for 64-byte objects</text><path d="M250,320 L250,362" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-mem-alloc)"/><path d="M430,362 L430,320" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-mem-alloc)"/><text x="262" y="341" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">kmalloc_node()</text><text x="442" y="341" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">kfree()</text></svg>