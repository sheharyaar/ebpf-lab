<svg viewBox="0 0 680 344" width="100%" role="img" aria-label="Left: r0 return value, rax; r1 to r5 arguments 1 to 5, rdi, rsi, rdx, rcx, r8: caller-saved, a call may overwrite all six, r0 comes back holding the result. r6 to r9, long-lived values, rbx, r13, r14, r15: callee-saved, a call hands them back unchanged. r10, frame pointer, rbp: never written. x86-64 registers with no eBPF partner: r9, r10, r11, r12, rsp. Right: the 512-byte stack below r10, r10 − 8 a local variable, r10 − 16 a spilled register, r10 − 24 free, 60 more 8-byte slots, r10 − 512 the last slot, toward lower addresses; a spill *(u64 *)(r10 - 16) = r1 and a fill r1 = *(u64 *)(r10 - 16)." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>eBPF registers beside their x86-64 partners, what a call does to each, and the stack below r10</title><defs><marker id="ah-P-3p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><defs><marker id="ah-P-3p-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="ah-P-3p-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker></defs><text x="12" y="14" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">eBPF</text><text x="60" y="14" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">role</text><text x="170" y="14" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">x86-64</text><text x="236" y="14" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">after a call</text><line x1="8" y1="28" x2="396" y2="28" stroke="#1F2328" stroke-width="1.3"/><text x="12" y="44" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#0F6E56" font-weight="700">r0</text><text x="60" y="44" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">return value</text><text x="170" y="44" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#0F6E56">rax</text><text x="12" y="69" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#0F6E56" font-weight="700">r1</text><text x="60" y="69" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">argument 1</text><text x="170" y="69" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#0F6E56">rdi</text><text x="12" y="94" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#0F6E56" font-weight="700">r2</text><text x="60" y="94" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">argument 2</text><text x="170" y="94" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#0F6E56">rsi</text><text x="12" y="119" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#0F6E56" font-weight="700">r3</text><text x="60" y="119" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">argument 3</text><text x="170" y="119" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#0F6E56">rdx</text><text x="12" y="144" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#0F6E56" font-weight="700">r4</text><text x="60" y="144" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">argument 4</text><text x="170" y="144" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#0F6E56">rcx</text><text x="12" y="169" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#0F6E56" font-weight="700">r5</text><text x="60" y="169" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">argument 5</text><text x="170" y="169" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#0F6E56">r8</text><text x="12" y="194" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328" font-weight="700">r6</text><text x="60" y="194" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">long-lived values</text><text x="170" y="194" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">rbx</text><text x="12" y="219" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328" font-weight="700">r7</text><text x="170" y="219" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">r13</text><text x="12" y="244" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328" font-weight="700">r8</text><text x="170" y="244" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">r14</text><text x="12" y="269" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328" font-weight="700">r9</text><text x="170" y="269" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">r15</text><text x="12" y="294" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328" font-weight="700">r10</text><text x="60" y="294" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">frame pointer</text><text x="170" y="294" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">rbp</text><line x1="8" y1="181.5" x2="396" y2="181.5" stroke="#C9CCCF" stroke-width="1"/><line x1="8" y1="281.5" x2="396" y2="281.5" stroke="#C9CCCF" stroke-width="1"/><line x1="8" y1="306.5" x2="396" y2="306.5" stroke="#1F2328" stroke-width="1.3"/><path d="M222,35 h6 V178 h-6" fill="none" stroke="#0F6E56" stroke-width="3"/><text x="238" y="79.5" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#0F6E56" font-weight="700">caller-saved</text><text x="238" y="97.5" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#0F6E56">a call may overwrite</text><text x="238" y="115.5" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#0F6E56">all six; r0 comes back</text><text x="238" y="133.5" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#0F6E56">holding the result</text><path d="M222,185 h6 V278 h-6" fill="none" stroke="#1F2328" stroke-width="1.3"/><text x="238" y="213.5" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">callee-saved</text><text x="238" y="231.5" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">a call hands them</text><text x="238" y="249.5" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">back unchanged</text><path d="M222,285 h6 V303 h-6" fill="none" stroke="#4A5056" stroke-width="1.3"/><text x="238" y="294.0" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056" font-weight="700">never written</text><text x="8" y="328" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">x86-64 registers with no eBPF partner: r9 (sixth argument), r10, r11, r12, rsp</text><text x="545.0" y="14" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">the stack: 512 bytes below r10</text><text x="444" y="40" text-anchor="end" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328" font-weight="700">r10</text><line x1="452" y1="40" x2="638" y2="40" stroke="#1F2328" stroke-width="2.4"/><rect x="452" y="42" width="186" height="28" rx="3" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="460" y="56" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">r10 − 8</text><text x="630" y="56" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">a local variable</text><rect x="452" y="72" width="186" height="28" rx="3" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="460" y="86" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">r10 − 16</text><text x="630" y="86" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">a spilled register</text><rect x="452" y="102" width="186" height="28" rx="3" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="460" y="116" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">r10 − 24</text><text x="630" y="116" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">free</text><rect x="452" y="134" width="186" height="52" rx="3" fill="#FFFFFF" stroke="#4A5056" stroke-width="1" stroke-dasharray="4 3"/><text x="545.0" y="160" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">… 60 more 8-byte slots …</text><rect x="452" y="190" width="186" height="28" rx="3" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="460" y="204" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">r10 − 512</text><text x="630" y="204" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">the last slot</text><path d="M656,46 L656,214" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-P-3p-k)"/><text x="676" y="234" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">lower addresses</text><text x="422" y="262" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">spill:</text><text x="466" y="262" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">*(u64 *)(r10 - 16) = r1</text><text x="422" y="284" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">fill:</text><text x="466" y="284" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">r1 = *(u64 *)(r10 - 16)</text><text x="422" y="312" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">r10 is read-only, so each slot keeps</text><text x="422" y="330" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">one name for the whole function</text></svg>