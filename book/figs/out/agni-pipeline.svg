<svg viewBox="0 0 680 688" width="100%" role="img" aria-label="Flowchart. The verifier source with a wrapper per instruction is compiled by clang to LLVM IR; LLVM passes inline every call, fix the opcode and drop dead code; LLVMToSMT writes one SMT-LIB formula per instruction. Z3 checks the general specification; if it holds, the operator is sound. If not, the refined specification with inputs passed through the shared tail; if that holds, the operator is sound and the first violation is latent. If not, differential synthesis tries programs of one, two and three instructions; a program found shows the bug and is run in QEMU, otherwise the case is inspected by hand." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>From verifier.c to a verdict</title><defs><marker id="ah-agni-pipeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect x="20" y="8" width="340" height="58" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190.0" y="27.5" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">verifier.c + a wrapper</text><text x="190.0" y="48.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">clang turns them into LLVM IR</text><rect x="20" y="82" width="340" height="58" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190.0" y="101.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">LLVM passes</text><text x="190.0" y="122.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">inline every call, fix the opcode, drop dead code</text><rect x="20" y="156" width="340" height="58" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190.0" y="175.5" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">LLVMToSMT</text><text x="190.0" y="196.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">one SMT-LIB formula per instruction</text><path d="M190.0,66.0 L190.0,82.0" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-agni-pipeline)"/><path d="M190.0,140.0 L190.0,156.0" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-agni-pipeline)"/><text x="380" y="22" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">jump wrappers copy kernel code by hand,</text><text x="380" y="40" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">one copy per range of kernel versions</text><text x="380" y="100" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">no loops or recursion: the calls</text><text x="380" y="118" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">inline into one acyclic function</text><text x="380" y="174" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">5.10: BPF_AND 100 KB, BPF_SYNC 49 KB,</text><text x="380" y="192" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">BPF_JLT 739 KB</text><path d="M190.0,214.0 L190.0,228.0" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-agni-pipeline)"/><polygon points="40,270 190,228 340,270 190,312" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190" y="260" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">gen holds?</text><text x="190" y="281" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">Z3; inputs: any values</text><polygon points="40,376 190,334 340,376 190,418" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190" y="366" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">sro holds?</text><text x="190" y="387" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">inputs passed through the tail</text><path d="M190.0,312.0 L190.0,334.0" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-agni-pipeline)"/><text x="180" y="323" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">no</text><rect x="20" y="446" width="340" height="58" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190.0" y="465.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">differential synthesis</text><text x="190.0" y="486.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">programs of 1, 2, then 3 instructions</text><path d="M190.0,418.0 L190.0,446.0" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-agni-pipeline)"/><text x="180" y="431" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">no</text><path d="M190.0,504.0 L190.0,520.0" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-agni-pipeline)"/><polygon points="40,562 190,520 340,562 190,604" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190" y="552" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">program found?</text><text x="190" y="573" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">up to the time limit</text><path d="M340.0,270.0 L430.0,270.0" fill="none" stroke="#0F6E56" stroke-width="2.6" marker-end="url(#ah-agni-pipeline)"/><text x="350" y="257" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#0F6E56" font-weight="700">yes</text><rect x="430" y="241" width="240" height="58" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2.6"/><text x="550.0" y="260.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#0F6E56" font-weight="700">sound</text><text x="550.0" y="281.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">for every input, at 64 bits</text><path d="M340.0,376.0 L430.0,376.0" fill="none" stroke="#0F6E56" stroke-width="2.6" marker-end="url(#ah-agni-pipeline)"/><text x="350" y="363" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#0F6E56" font-weight="700">yes</text><rect x="430" y="347" width="240" height="58" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2.6"/><text x="550.0" y="366.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#0F6E56" font-weight="700">sound</text><text x="550.0" y="387.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">the gen violation is latent</text><path d="M340.0,562.0 L430.0,562.0" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-agni-pipeline)"/><text x="350" y="549" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">yes</text><rect x="430" y="533" width="240" height="58" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="550.0" y="552.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">a bug, shown</text><text x="550.0" y="573.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">the program runs in QEMU</text><path d="M190.0,604.0 L190.0,634.0" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-agni-pipeline)"/><text x="180" y="617" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">no</text><rect x="20" y="634" width="340" height="46" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.1"/><text x="190.0" y="657.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">inspect by hand: latent, or longer</text></svg>