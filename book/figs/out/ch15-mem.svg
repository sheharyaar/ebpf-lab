<svg viewBox="0 0 680 440" width="100%" role="img" aria-label="Horizontal bars of bytes per entry: array 8.3, mmapable array 12, LRU hash 80.9, hash 82, hash without preallocation 16.9 empty to 88.9 full, per-CPU array 136, per-CPU hash 209; below, the ring buffer, perf event array and arena with their reported memory" font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>Bytes per entry for seven map layouts at 1,024 entries, and three maps that hold no entries</title><defs><marker id="ah-15-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="8" y="14" text-anchor="start" dominant-baseline="central" font-size="15" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-weight="700" xml:space="preserve">bytes per entry: <tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">memlock</tspan> ÷ 1,024 entries, 16 possible CPUs</text><line x1="272.0" y1="32" x2="272.0" y2="244" stroke="#9EA3A8" stroke-width="0.6" stroke-dasharray="2 3"/><text x="272.0" y="256" text-anchor="middle" dominant-baseline="central" font-size="14.5" fill="#4A5056" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" xml:space="preserve">0</text><line x1="344.5" y1="32" x2="344.5" y2="244" stroke="#9EA3A8" stroke-width="0.6" stroke-dasharray="2 3"/><text x="344.5" y="256" text-anchor="middle" dominant-baseline="central" font-size="14.5" fill="#4A5056" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" xml:space="preserve">50</text><line x1="417.0" y1="32" x2="417.0" y2="244" stroke="#9EA3A8" stroke-width="0.6" stroke-dasharray="2 3"/><text x="417.0" y="256" text-anchor="middle" dominant-baseline="central" font-size="14.5" fill="#4A5056" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" xml:space="preserve">100</text><line x1="489.5" y1="32" x2="489.5" y2=