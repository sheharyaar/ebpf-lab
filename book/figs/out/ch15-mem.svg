ns-serif" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">memlock</tspan> 275,776 B; one buffer for all CPUs</text><text x="262" y="360" text-anchor="end" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" xml:space="preserve">PERF_EVENT_ARRAY</text><text x="272" y="360" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">memlock</tspan> 432 B; 266,240 B a CPU not counted there</text><text x="262" y="382" text-anchor="end" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" xml:space="preserve">ARENA, 1,024 pages</text><text x="272" y="382" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">memlock</tspan> 0 B; 256 pages touched charged 1.1–1.3 MB</text><rect x="20" y="406" width="640" height="28" rx="6" fill="#E4E6E8" stroke="#4A5056" stroke-width="0.75"/><text x="340" y="420" text-anchor="middle" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" xml:space="preserve">A layout pays for its entries when created, unless it allocates as keys arrive.</text></svg>