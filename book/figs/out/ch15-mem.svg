nt-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-weight="600" xml:space="preserve">80.9</text><text x="262" y="139.0" text-anchor="end" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" xml:space="preserve">HASH (the counter)</text><rect x="272" y="130" width="118.89999999999999" height="18" rx="2" fill="#E4E6E8" stroke="#4A5056" stroke-width="0.9"/><text x="398.9" y="139.0" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-weight="600" xml:space="preserve">82.0</text><text x="262" y="169.0" text-anchor="end" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" xml:space="preserve">HASH, NO_PREALLOC</text><rect x="272" y="160" width="24.504999999999995" height="18" rx="2" fill="#E4E6E8" stroke="#4A5056" stroke-width="0.9"/><rect x="296.505" y="160" width="104.39999999999999" height="18" rx="2" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.1" stroke-dasharray="4 3"/><text x="408.905" y="169.0" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-weight="600" xml:space="preserve">16.9 → 88.9</text><text x="262" y="199.0" text-anchor="end" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" xml:space="preserve">PERCPU_ARRAY</text><rect x="272" y="190" width="197.63500000000002" height="18" rx="2" fill="#0F6E56" stroke="#1F2328" stroke-width="0.9"/><text x="477.635" y="199.0" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#0F6E56" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-weight="600" xml:space="preserve">136.3</text><text x="262" y="229.0" text-anchor="end" dominant-baseline="central" font-size="14.5" fill="#1F2328" font-family="'Ubuntu Mono',