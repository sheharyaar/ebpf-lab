n font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">tested here, before the</tspan></text><text x="590.0" y="131.0" text-anchor="middle" dominant-baseline="central" font-size="14.5" fill="#0F6E56" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">program reads through it</tspan></text><line x1="326" y1="88" x2="326" y2="136" stroke="#C9CCCF" stroke-width="1"/><line x1="502" y1="88" x2="502" y2="136" stroke="#C9CCCF" stroke-width="1"/><line x1="8" y1="142" x2="676" y2="142" stroke="#C9CCCF" stroke-width="1"/><text x="12" y="170.0" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">r1 to r5</text><text x="12" y="190.0" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">the arguments</text><text x="238.0" y="160.0" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">r1</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif"> = the map</tspan></text><text x="238.0" y="179.0" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">r2 = &amp;key = r10 − 4</tspan></text><text x="238.0" y="198.0" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#4A5056" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">r3</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif"> to </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">r5</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">: –</tspan></text><text x="414.0" y