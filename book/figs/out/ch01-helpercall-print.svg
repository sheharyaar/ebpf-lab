<svg viewBox="0 0 680 360" width="100%" role="img" aria-label="A grid of the registers r0, r1 to r5, r6 to r9 and r10 against three moments. Before the call, at slots 4 to 7, r1 holds the map and r2 the key's address, r10 minus 4. After the call to bpf_map_lookup_elem at slot 8, r0 holds a pointer to the value or 0, r1 to r5 cannot be read, and r6 to r10 are kept. At slot 9 the program tests r0." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>One helper call, register by register, at three moments</title><defs><marker id="ah-1-4p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><defs><marker id="ah-1-4p-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="ah-1-4p-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker></defs><text x="238.0" y="16" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">slots 4 to 7, before the call</text><text x="414.0" y="16" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">after slot 8, the call</text><text x="414.0" y="37" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">bpf_map_lookup_elem</text><text x="414.0" y="56" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">helper 1, runs in the kernel</text><text x="590.0" 