<svg viewBox="0 0 680 484" width="100%" role="img" aria-label="Flowchart: slot 2 as compiled on 7.2 holds offset 0xb38 and a record asking for task_struct.pid. At load libbpf looks up struct task_struct by name in the target kernel's BTF and asks whether it has a field named pid. Yes, on Ubuntu 20.04's 5.4 kernel: slot 2 is rewritten with 0x8d8 and the kernel receives a plain load. No: slot 2 becomes a call to helper 195896080 and the load fails." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>One CO-RE relocation in the fork tracer, from compile to load on two other kernels</title><defs><marker id="ah-3-3p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><defs><marker id="ah-3-3p-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="ah-3-3p-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker></defs><rect x="20" y="10" width="300" height="58" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="170" y="29.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">slot 2, as compiled</text><text x="170" y="49.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">w4 = *(u32 *)(r1 + 0xb38)</text><text x="336" y="29" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">0xb38 = 2872:</text><text x="336" y="49" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">field 95 in the 7.2 header</text><path d="M170,68 L170,116" fill="none" stroke="#1F2328" stroke-width="2.2" marker-end="url(#ah-3-3p-k)"/><text x="182" y="83" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">clang adds a record for slot 2:</text><text x="182" y="102" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">task_struct.pid: offset?</text><rect x="20" y="118" width="300" height="58" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="170" y="137.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">libbpf, at load, on another kernel</text><text x="170" y="157.0" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#4A5056" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">looks up </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">struct task_struct</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif"> by name</tspan></text><path d="M170,176 L170,200" fill="none" stroke="#1F2328" stroke-width="2.2" marker-end="url(#ah-3-3p-k)"/><polygon points="18,264 170,202 322,264 170,326" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="170" y="244" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328">does the target kernel's</text><text x="170" y="264" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328" font-weight="700">struct task_struct</text><text x="170" y="284" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#1F2328" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">have a field named </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">pid</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">?</tspan></text><path d="M170,326 L170,392" fill="none" stroke="#1F2328" stroke-width="2.2" marker-end="url(#ah-3-3p-k)"/><text x="158" y="342" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">yes</text><text x="182" y="348" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-weight="700">Ubuntu 20.04's 5.4 kernel:</text><text x="182" y="367" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#4A5056" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">task_struct</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">: 9280 bytes, 213 fields</tspan></text><text x="182" y="386" text-anchor="start" dominant-baseline="central" font-size="14.5" fill="#4A5056" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">pid</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">: field 65, at byte 2264 = 0x8d8</tspan></text><rect x="20" y="394" width="300" height="58" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="170" y="413.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">slot 2, as loaded on that kernel</text><text x="170" y="433.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">w4 = *(u32 *)(r1 + 0x8d8)</text><text x="170" y="470" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">the kernel receives a plain load</text><path d="M322,264 L398,264" fill="none" stroke="#0F6E56" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ah-3-3p-a)"/><text x="332" y="251" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#0F6E56" font-weight="700">no</text><text x="400" y="195" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#0F6E56" font-style="italic">a kernel without that field,</text><text x="400" y="213" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#0F6E56" font-style="italic">say, after a rename</text><rect x="400" y="234" width="272" height="60" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1.6" stroke-dasharray="7 5"/><text x="536.0" y="254" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#0F6E56" font-weight="700">slot 2 becomes a call to</text><text x="536.0" y="275" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#0F6E56">helper 195896080, "bad relo"</text><path d="M536.0,294 L536.0,324" fill="none" stroke="#0F6E56" stroke-width="2.2" stroke-dasharray="7 5"/><line x1="518.0" y1="325" x2="554.0" y2="325" stroke="#0F6E56" stroke-width="3"/><text x="536.0" y="344" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#0F6E56" font-weight="700">the load fails here:</text><text x="536.0" y="363" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#0F6E56">failed to resolve CO-RE relocation …</text><path d="M400,428 L440,428" fill="none" stroke="#1F2328" stroke-width="2.2"/><text x="448" y="428" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">on Ubuntu 20.04's 5.4 kernel</text><path d="M400,452 L440,452" fill="none" stroke="#0F6E56" stroke-width="2.2" stroke-dasharray="7 5"/><text x="448" y="452" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#0F6E56">on a kernel without that field</text></svg>