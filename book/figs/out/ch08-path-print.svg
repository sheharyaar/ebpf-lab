<svg viewBox="0 0 680 318" width="100%" role="img" aria-label="The write system call as a row of five stages, write(), syscall entry, vfs_write(), security_file_permission() and the file's write(), returning under the row to the process. Above the row: the sys_enter_write tracepoint at syscall entry, a kprobe or fentry program at the entry of vfs_write(), an LSM program at the permission check, which may refuse the write and end it there. Below the return line: fexit as vfs_write() returns and the sys_exit_write tracepoint." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>One write() call and every hook it passes</title><defs><marker id="ah-8-1p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><defs><marker id="ah-8-1p-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="ah-8-1p-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker></defs><rect x="8" y="112" width="92" height="56" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="54.0" y="131.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">write()</text><text x="54.0" y="151.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">a process</text><rect x="126" y="112" width="116" height="56" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="184.0" y="131.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">syscall entry</text><text x="184.0" y="151.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">into the kernel</text><rect x="268" y="112" width="110" height="56" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="323.0" y="131.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">vfs_write()</text><text x="323.0" y="151.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">every write</text><rect x="404" y="112" width="140" height="56" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="474.0" y="131.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">security_file_</text><text x="474.0" y="150.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">permission()</text><rect x="570" y="112" width="102" height="56" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="621.0" y="131.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">the file's</text><text x="621.0" y="151.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#4A5056">write()</text><path d="M100,140.0 L124,140.0" fill="none" stroke="#1F2328" stroke-width="2.2" marker-end="url(#ah-8-1p-k)"/><path d="M242,140.0 L266,140.0" fill="none" stroke="#1F2328" stroke-width="2.2" marker-end="url(#ah-8-1p-k)"/><path d="M378,140.0 L402,140.0" fill="none" stroke="#1F2328" stroke-width="2.2" marker-end="url(#ah-8-1p-k)"/><path d="M544,140.0 L568,140.0" fill="none" stroke="#1F2328" stroke-width="2.2" marker-end="url(#ah-8-1p-k)"/><text x="8" y="92" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">on the way in</text><path d="M621,168 L621,234 L54,234 L54,170" fill="none" stroke="#1F2328" stroke-width="2.2" marker-end="url(#ah-8-1p-k)"/><text x="66" y="250" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">on the way back out</text><line x1="184" y1="76" x2="184" y2="112" stroke="#4A5056" stroke-width="1.3"/><circle cx="184" cy="112" r="3.2" fill="#1F2328"/><rect x="106.0" y="30" width="140" height="46" rx="8" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.1"/><text x="176" y="44" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328" font-weight="700">sys_enter_write</text><text x="176" y="63" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">tracepoint: the counter</text><line x1="323" y1="76" x2="323" y2="112" stroke="#4A5056" stroke-width="1.3"/><circle cx="323" cy="112" r="3.2" fill="#1F2328"/><rect x="257.0" y="30" width="132" height="46" rx="8" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.1"/><text x="323" y="44" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328" font-weight="700">kprobe · fentry</text><text x="323" y="63" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">function entry</text><line x1="474" y1="76" x2="474" y2="112" stroke="#4A5056" stroke-width="1.3"/><circle cx="474" cy="112" r="3.2" fill="#1F2328"/><rect x="406.0" y="30" width="136" height="46" rx="8" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.1"/><text x="474" y="44" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328" font-weight="700">LSM program</text><text x="474" y="63" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">may refuse the write</text><line x1="184" y1="262" x2="184" y2="234" stroke="#4A5056" stroke-width="1.3"/><circle cx="184" cy="234" r="3.2" fill="#1F2328"/><rect x="120.0" y="262" width="128" height="46" rx="8" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.1"/><text x="184" y="276" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328" font-weight="700">sys_exit_write</text><text x="184" y="295" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">tracepoint</text><line x1="323" y1="262" x2="323" y2="234" stroke="#4A5056" stroke-width="1.3"/><circle cx="323" cy="234" r="3.2" fill="#1F2328"/><rect x="258.0" y="262" width="192" height="46" rx="8" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.1"/><text x="354" y="276" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328" font-weight="700">fexit</text><text x="354" y="295" text-anchor="middle" dominant-baseline="central" font-size="14.5" fill="#4A5056" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">sees what </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">vfs_write()</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif"> returned</tspan></text><path d="M474,168 L474,206" fill="none" stroke="#0F6E56" stroke-width="2.2" stroke-dasharray="6 4"/><line x1="458" y1="207" x2="490" y2="207" stroke="#0F6E56" stroke-width="3"/><text x="452" y="200" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#0F6E56" font-weight="700">refused: the write ends here</text><path d="M474,280 L514,280" fill="none" stroke="#1F2328" stroke-width="2.2"/><text x="522" y="280" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">the call</text><path d="M474,302 L514,302" fill="none" stroke="#0F6E56" stroke-width="2.2" stroke-dasharray="6 4"/><text x="522" y="302" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#0F6E56">refused by the LSM program</text></svg>