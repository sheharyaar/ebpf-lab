<svg viewBox="0 0 680 736" width="100%" role="img" aria-label="Flowchart. bpf_obj_new returns n or NULL. If NULL there is nothing to give back. Otherwise the program owns n and may write any field. Before exit it must free it with bpf_obj_drop, park it in a map value with bpf_kptr_xchg, or link it into a tree with bpf_rbtree_add under the lock; if none, the load is refused with Unreleased reference. After the add, n is a non-owning reference that may write fields until bpf_spin_unlock, after which it is unusable. In a later run bpf_rbtree_remove under the lock returns it owned again, and the questions start over." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>An owning reference from bpf_obj_new to exit</title><defs><marker id="ah-mem-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect x="80" y="6" width="300" height="48" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="230.0" y="20.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">n = bpf_obj_new(T)</text><text x="230.0" y="41.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">from this CPU’s cache</text><path d="M230,54 L230,68" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-mem-life)"/><polygon points="100,106 230,72 360,106 230,140" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="230" y="96" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328">did it return</text><text x="230" y="116" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328">NULL?</text><path d="M360,106 L426,106" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-mem-life)"/><text x="370" y="93" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">yes</text><rect x="430" y="86" width="244" height="40" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="552.0" y="106.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328">nothing to give back</text><text x="220" y="150" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">no</text><path d="M230,140 L230,154" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-mem-life)"/><rect x="80" y="158" width="300" height="48" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="230.0" y="172.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">n-&gt;tid = tid</text><text x="230.0" y="193.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">owned: any field, no lock</text><path d="M230,206 L230,220" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-mem-life)"/><polygon points="100,258 230,224 360,258 230,292" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="230" y="248" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328">freed in</text><text x="230" y="268" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328">this program?</text><path d="M360,258 L426,258" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-mem-life)"/><text x="370" y="245" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">yes</text><rect x="430" y="234" width="244" height="48" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="552.0" y="248.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">bpf_obj_drop(n)</text><text x="552.0" y="269.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">freed after a grace period</text><text x="220" y="302" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">no</text><path d="M230,292 L230,306" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-mem-life)"/><polygon points="100,344 230,310 360,344 230,378" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="230" y="334" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328">parked in a</text><text x="230" y="354" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328">map value?</text><path d="M360,344 L426,344" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-mem-life)"/><text x="370" y="331" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">yes</text><rect x="430" y="320" width="244" height="48" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="552.0" y="334.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">bpf_kptr_xchg(&amp;v-&gt;p, n)</text><text x="552.0" y="355.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">the map value owns it</text><text x="220" y="388" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">no</text><path d="M230,378 L230,392" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-mem-life)"/><polygon points="100,430 230,396 360,430 230,464" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="230" y="420" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328">linked into</text><text x="230" y="440" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328">a tree?</text><path d="M360,430 L426,430" fill="none" stroke="#0F6E56" stroke-width="3" marker-end="url(#ah-mem-life)"/><text x="370" y="417" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#0F6E56" font-weight="700">no</text><rect x="430" y="403" width="244" height="54" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2.6"/><text x="552.0" y="420.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#0F6E56" font-weight="700">refused at load</text><text x="552.0" y="442.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">Unreleased reference id=…</text><text x="220" y="474" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">yes</text><path d="M230,464 L230,478" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-mem-life)"/><rect x="80" y="482" width="300" height="48" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="230.0" y="496.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">bpf_rbtree_add(root, n)</text><text x="230.0" y="517.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">inside bpf_spin_lock(): the tree owns it</text><path d="M230,530 L230,544" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-mem-life)"/><rect x="80" y="548" width="300" height="48" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="230.0" y="562.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">n-&gt;count++</text><text x="230.0" y="583.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">non-owning: fields only</text><path d="M230,596 L230,610" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-mem-life)"/><rect x="80" y="614" width="300" height="48" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="230.0" y="628.0"