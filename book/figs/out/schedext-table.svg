<svg viewBox="0 0 680 532" width="100%" role="img" aria-label="Box diagram. Left: the kernel copy of struct sched_ext_ops inside the struct_ops map simple_ops, with members select_cpu, enqueue, dequeue (NULL), dispatch, running, stopping, enable, init and exit, then 28 more NULL pointers and the data members name, set to simple, and timeout_ms, set to 0. Each filled member points at a trampoline in one 4 KiB page, and each trampoline calls its JIT-compiled program, from simple_select_cpu (240 bytes) to simple_exit (201 bytes). At the top the scheduler core calls sch-&gt;ops.enqueue, which reaches simple_enqueue through the enqueue member and its trampoline." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>The struct_ops table of scx_simple</title><defs><marker id="ah-scx-table" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="132.0" y="84" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">kernel copy of sched_ext_ops</text><text x="132.0" y="102" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">in the struct_ops map simple_ops</text><text x="361.0" y="84" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">trampolines</text><text x="361.0" y="102" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">one 4 KiB page</text><text x="583.0" y="84" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open San