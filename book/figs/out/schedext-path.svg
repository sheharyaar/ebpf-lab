<svg viewBox="0 0 680 730" width="100%" role="img" aria-label="Flowchart. A task becomes runnable in try_to_wake_up and ops.select_cpu looks for an idle CPU. If one was found, scx_bpf_dsq_insert puts the task in that CPU local dispatch queue and ops.enqueue is skipped. Otherwise ops.enqueue puts it in SHARED_DSQ in virtual-time order, where it waits. When a CPU looks for its next task in pick_task_scx, it runs the first task of its local or the global queue, calling ops.running; if both are empty it calls ops.dispatch, which moves one task from SHARED_DSQ, and looks again, at most 32 rounds. ops.stopping charges the time used; a task still runnable goes back to ops.enqueue." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>A task through scx_simple</title><defs><marker id="ah-scx-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect x="30" y="10" width="310" height="52" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="185.0" y="26.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">try_to_wake_up()</text><text x="185.0" y="47.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">a task becomes runnable</text><path d="M185,62 L185,86" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-scx-path)"/><rect x="30" y="88" width="310" height="52" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="185.0" y="104.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">ops.select_cpu()</text><text x="185.0" y="125.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">simple_select_cpu: look for an idle CPU</text><path d="M185,140 L185,166" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-scx-path)"/><polygon points="45,222 185,168 325,222 185,276" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="185" y="212" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328">an idle CPU</text><text x="185" y="232" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328">was found?</text><path d="M325,222 L407,222" fill="none" stroke="#0F6E56" stroke-width="3" marker-end="url(#ah-scx-path)"/><text x="335" y="208" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#0F6E56" font-weight="700">yes</text><rect x="410" y="194" width="260" height="56" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2.6"/><text x="540.0" y="212.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#0F6E56" font-weight="700">scx_bpf_dsq_insert()</text><text x="540.0" y="233.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">into that CPU’s local DSQ</text><text x="530" y="270" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">ops.enqueue() is skipped</text><path d="M540,250 L540,412 L343,412" fill="none" stroke="#0F6E56" stroke-width="3" marker-end="url(#ah-scx-path)"/><text x="173" y="290" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">no</text><path d="M185,276 L185,304" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-scx-path)"/><rect x="30" y="306" width="310" height="52" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="185.0" y="322.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">ops.enqueue()</text><text x="185.0" y="343.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">simple_enqueue: into SHARED_DSQ, vtime order</text><text x="350" y="332" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">waits there</text><path d="M185,358 L185,384" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-scx-path)"/><rect x="30" y="386" width="310" height="52" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="185.0" y="402.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">pick_task_scx()</text><text x="185.0" y="423.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">a CPU looks for its next task</text><path d="M185,438 L185,464" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-scx-path)"/><polygon points="45,520 185,466 325,520 185,574" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="185" y="510" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328">a task in its local</text><text x="185" y="530" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328">or the global DSQ?</text><path d="M325,520 L407,520" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-scx-path)"/><text x="335" y="506" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">yes</text><rect x="410" y="492" width="260" height="56" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="540.0" y="510.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">ops.running()</text><text x="540.0" y="531.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">the first one runs, up to 20 ms</text><text x="173" y="588" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">no</text><path d="M185,574 L185,602" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-scx-path)"/><rect x="30" y="604" width="310" height="52" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="185.0" y="620.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">ops.dispatch()</text><text x="185.0" y="641.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">simple_dispatch: move one from SHARED_DSQ</text><path d="M30,630 L14,630 L14,520 L42,520" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-scx-path)"/><text x="30" y="676" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">then look again, at most 32 rounds</text><path d="M540,548 L540,578" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-scx-path)"/><rect x="410" y="580" width="260" height="56" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="540.0" y="598.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">ops.stopping()</text><text x="540.0" y="619.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">charges the time it used to vtime</text><text x="410" y="654" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">still runnable: back to ops.enqueue()</text><text x="410" y="672" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">asleep: done until the next wake-up</text><path d="M30,712 L78,712" fill="none" stroke="#0F6E56" stroke-width="3"/><text x="88" y="712" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">the shortcut when an idle CPU was found</text><path d="M380,712 L428,712" fill="none" stroke="#1F2328" stroke-width="1.8"/><text x="438" y="712" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">every other way through</text></svg>