<svg viewBox="0 0 680 440" width="100%" role="img" aria-label="Two panels. Left, hXDP (OSDI 2020): an XDP program as bytecode goes to a compiler that drops bounds checks and zeroing and packs up to four instructions a row, then runs on Sephirot, a VLIW core with four lanes that issues one row a cycle at 156.25 MHz; below it a helper unit takes one call a cycle and one memory area holds all maps; about 15 percent of the FPGA, 6.53 Mpps on the simple firewall. Right, eHDL (ASPLOS 2023): the same bytecode goes through high-level synthesis, which groups independent instructions into stages and takes hours per program, giving a pipeline of stages with a different packet in each; below it one helper block per call site and a map memory with hazards across stages; 6.5 to 13.3 percent of the FPGA, 148 Mpps at 100 Gb/s of 64-byte packets. Helpers and maps are drawn thick in the accent in both panels." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>hXDP and eHDL: one processor for every program, or a circuit for each</title><defs><marker id="ah-epilogue-hw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><line x1="340" y1="6" x2="340" y2="402" stroke="#B8BCC0" stroke-width="1.2" stroke-dasharray="5 4"/><text x="170.0" y="14" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">hXDP, OSDI 2020</text><text x="170.0" y="34" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">one processor runs every program</text><text x="510.0" y="14" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">eHDL, ASPLOS 2023</text><text x="510.0" y="34" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">a new circuit for each program</text><rect x="60.0" y="50" width="220" height="34" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="170.0" y="67.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">XDP program, as bytecode</text><path d="M170.0,84 L170.0,104" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#ah-epilogue-hw)"/><rect x="400.0" y="50" width="220" height="34" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="510.0" y="67.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">XDP program, as bytecode</text><path d="M510.0,84 L510.0,104" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#ah-epilogue-hw)"/><rect x="12" y="106" width="316" height="60" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="170.0" y="117.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">compiler</text><text x="170.0" y="137.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">drops bounds checks and zeroing,</text><text x="170.0" y="155.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">packs up to 4 instructions a row</text><rect x="352" y="106" width="316" height="60" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="510.0" y="117.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">high-level synthesis</text><text x="510.0" y="137.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">groups independent instructions</text><text x="510.0" y="155.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">into stages; hours per program</text><path d="M170.0,166 L170.0,186" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#ah-epilogue-hw)"/><path d="M510.0,166 L510.0,186" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#ah-epilogue-hw)"/><rect x="12" y="188" width="316" height="96" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="170.0" y="204" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">Sephirot, a VLIW core</text><rect x="24" y="220" width="67" height="30" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.1"/><text x="57.5" y="235" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">lane 1</text><rect x="99" y="220" width="67" height="30" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.1"/><text x="132.5" y="235" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">lane 2</text><rect x="174" y="220" width="67" height="30" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.1"/><text x="207.5" y="235" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">lane 3</text><rect x="249" y="220" width="67" height="30" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.1"/><text x="282.5" y="235" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">lane 4</text><text x="170.0" y="268" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">one row a cycle, at 156.25 MHz</text><rect x="352" y="188" width="316" height="96" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="510.0" y="204" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">a pipeline of stages</text><rect x="362" y="220" width="62" height="30" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.1"/><text x="393" y="235" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">stage 1</text><path d="M424,235 L440,235" fill="none" stroke="#1F2328" stroke-width="1.3" marker-end="url(#ah-epilogue-hw)"/><rect x="440" y="220" width="62" height="30" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.1"/><text x="471" y="235" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">stage 2</text><path d="M502,235 L534,235" fill="none" stroke="#1F2328" stroke-width="1.3" marker-end="url(#ah-epilogue-hw)"/><text x="549" y="235" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">…</text><path d="M564,235 L596,235" fill="none" stroke="#1F2328" stroke-width="1.3" marker-end="url(#ah-epilogue-hw)"/><rect x="596" y="220" width="62" height="30" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.1"/><text x="627" y="235" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">stage n</text><text x="510.0" y="268" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">a different packet in every stage</text><path d="M90.0,284 L90.0,304" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#ah-epilogue-hw)"/><path d="M250.0,284 L250.0,304" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#ah-epilogue-hw)"/><path d="M430.0,284 L430.0,304" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#ah-epilogue-hw)"/><path d="M590.0,284 L590.0,304" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#ah-epilogue-hw)"/><rect x="12" y="306" width="152" height="52" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2.6"/><text x="88.0" y="322.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#0F6E56" font-weight="700">helper unit</text><text x="88.0" y="342.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">one call a cycle</text><rect x="176" y="306" width="152" height="52" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2.6"/><text x="252.0" y="322.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#0F6E56" font-weight="700">maps memory</text><text x="252.0" y="342.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">one area, all maps</text><rect x="352" y="306" width="152" height="52" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2.6"/><text x="428.0" y="322.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#0F6E56" font-weight="700">helper blocks</text><text x="428.0" y="342.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">one per call site</text><rect x="516" y="306" width="152" height="52" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2.6"/><text x="592.0" y="322.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#0F6E56" font-weight="700">map memory</text><text x="592.0" y="342.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">hazards across stages</text><text x="170.0" y="376" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">about 15% of the FPGA</text><text x="170.0" y="394" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">6.53 Mpps on the simple firewall</text><text x="510.0" y="376" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">6.5 to 13.3% of the FPGA</text><text x="510.0" y="394" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">148 Mpps: 100 Gb/s of 64-byte packets</text><rect x="150" y="414" width="34" height="18" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2.6"/><text x="192" y="423" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">where both designs did the most work: helpers and maps</text></svg>