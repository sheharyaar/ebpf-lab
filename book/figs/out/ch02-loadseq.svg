<svg viewBox="0 0 680 446" width="100%" role="img" aria-label="Two lifelines, the loader through libbpf and the kernel. hashmap_bpf__open_and_load(): BPF_MAP_CREATE twice, answered with two map descriptors that libbpf moves onto the numbers already in the code; BPF_PROG_LOAD for a tracepoint program of 27 slots, answered with the program, checked and rewritten. hashmap_bpf__attach(): perf_event_open on the tracepoint, answered with a perf event descriptor; BPF_LINK_CREATE with program and event, answered with a link descriptor, and the program runs." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>What open_and_load() and attach() ask of the kernel, in order</title><defs><marker id="ah-2-3p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><defs><marker id="ah-2-3p-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="ah-2-3p-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="ah-2-3p-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5056"/></marker></defs><rect x="30" y="8" width="132" height="46" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="96" y="24" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">loader</text><text x="96" y="43" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">through libbpf</text><rect x="538" y="8" width="132" height="46" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="604" y="31" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">kernel</text><line x1="96" y1="54" x2="96" y2="404" stroke="#4A5056" stroke-width="1.2"/><line x1="604" y1="54" x2="604" y2="404" stroke="#4A5056" stroke-width="1.2"/><rect x="8" y="63" width="664" height="26" fill="#EEF0F1"/><text x="16" y="76" text-anchor="start" dominant-baseline="central" font-size="15" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">hashmap_bpf__open_and_load()</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">: the objects are created</tspan></text><text x="16" y="107" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">1</text><text x="350.0" y="105" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">BPF_MAP_CREATE</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">, twice</tspan></text><path d="M96,116 L602,116" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-2-3p-k)"/><text x="16" y="141" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">2</text><text x="350.0" y="139" text-anchor="middle" dominant-baseline="central" font-size="14.5" fill="#4A5056" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">two map descriptors, moved onto the numbers in the code</tspan></text><path d="M604,150 L98,150" fill="none" stroke="#4A5056" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-2-3p-g)"/><text x="16" y="175" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">3</text><text x="350.0" y="173" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">BPF_PROG_LOAD</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">, </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">TRACEPOINT</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">, 27 slots</tspan></text><path d="M96,184 L602,184" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-2-3p-k)"/><text x="16" y="209" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">4</text><text x="350.0" y="207" text-anchor="middle" dominant-baseline="central" font-size="14.5" fill="#4A5056" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">the program, checked and rewritten</tspan></text><path d="M604,218 L98,218" fill="none" stroke="#4A5056" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-2-3p-g)"/><rect x="8" y="237" width="664" height="26" fill="#EEF0F1"/><text x="16" y="250" text-anchor="start" dominant-baseline="central" font-size="15" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">hashmap_bpf__attach()</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">: the objects are connected</tspan></text><text x="16" y="281" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">5</text><text x="350.0" y="279" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">perf_event_open</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif"> on the tracepoint</tspan></text><path d="M96,290 L602,290" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-2-3p-k)"/><text x="16" y="315" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">6</text><text x="350.0" y="313" text-anchor="middle" dominant-baseline="central" font-size="14.5" fill="#4A5056" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">perf event descriptor</tspan></text><path d="M604,324 L98,324" fill="none" stroke="#4A5056" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-2-3p-g)"/><text x="16" y="349" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">7</text><text x="350.0" y="347" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">BPF_LINK_CREATE</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">, program plus event</tspan></text><path d="M96,358 L602,358" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-2-3p-k)"/><text x="16" y="383" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">8</text><text x="350.0" y="381" text-anchor="middle" dominant-baseline="central" font-size="14.5" fill="#4A5056" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">link descriptor, and the program runs</tspan></text><path d="M604,392 L98,392" fill="none" stroke="#4A5056" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-2-3p-g)"/><path d="M204,430 L244,430" fill="none" stroke="#1F2328" stroke-width="1.8"/><text x="252" y="430" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">the loader asks</text><path d="M390,430 L430,430" fill="none" stroke="#4A5056" stroke-width="1.5" stroke-dasharray="6 4"/><text x="438" y="430" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">the kernel answers</text></svg>