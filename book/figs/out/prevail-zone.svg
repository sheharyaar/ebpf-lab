<svg viewBox="0 0 680 486" width="100%" role="img" aria-label="Constraint graph of four variables: r3, the offset of r5, the offset of r0, and the packet length len. Slot 5 gives r5.off minus r3 equals 0; slots 6 and 7 give r0.off minus r5.off equals 1; slot 8, not taken, gives r0.off minus len at most 0. Adding the constraints along the path from r5.off to len gives r5.off minus len at most minus 1, drawn dashed: the read at slot 9 fits in every round. Below, the interval domain after widening keeps r3 and r5.off in 0 to infinity and len in 1 to 65535, with no relation, so it cannot bound r5.off minus len." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>One packet check as difference constraints</title><defs><marker id="ah-prevail-zone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><ellipse cx="110" cy="60" rx="70" ry="30" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.4"/><text x="110" y="52" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">r3</text><text x="110" y="72" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">the round, i</text><ellipse cx="110" cy="210" rx="70" ry="30" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.4"/><text x="110" y="202" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">r5.off</text><text x="110" y="222" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">byte to read</text><ellipse cx="420" cy="210" rx="70" ry="30" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.4"/><text x="420" y="202" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">r0.off</text><text x="420" y="222" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">r5 + 1</text><ellipse cx="420" cy="360" rx="70" ry="30" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.4"/><text x="420" y="352" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">len</text><text x="420" y="372" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">packet end</text><path d="M110.0,90.0 L110.0,180.0" fill="none" stroke="#1F2328" stroke-width="2"/><text x="122" y="135" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">r5.off - r3 = 0</text><text x="122" y="154" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">slot 5: r5 = data + r3</text><path d="M180.0,210.0 L350.0,210.0" fill="none" stroke="#1F2328" stroke-width="2"/><text x="265.0" y="196" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">r0.off - r5.off = 1</text><text x="265.0" y="226" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">slots 6 and 7</text><path d="M420.0,240.0 L420.0,330.0" fill="none" stroke="#1F2328" stroke-width="2"/><text x="432" y="276" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">r0.off - len &lt;= 0</text><text x="432" y="295" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">slot 8, not taken</text><path d="M130.0,239.0 L350.0,360.0" fill="none" stroke="#0F6E56" stroke-width="2.6" stroke-dasharray="8 5"/><text x="24" y="318" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#0F6E56" font-weight="700">r5.off - len &lt;= -1</text><text x="24" y="338" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#0F6E56">the sum along the path: the read</text><text x="24" y="356" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#0F6E56">at slot 9 fits, in every round</text><rect x="20" y="412" width="640" height="62" rx="5" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.1" stroke-dasharray="6 4"/><text x="36" y="432" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">intervals alone, after widening:</text><text x="36" y="454" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">r3 in [0, +oo], r5.off in [0, +oo], len in [1, 65535]: no edge, so no bound on r5.off - len</text><text x="660" y="60" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">solid: a fact the instruction adds</text><text x="660" y="80" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#0F6E56">dashed: derived by closure</text></svg>