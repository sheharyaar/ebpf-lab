<svg viewBox="0 0 680 374" width="100%" role="img" aria-label="The loader process holds descriptors for the two maps, write_counts and hashmap_.rodata, for the program count_writes and for the link. In the kernel the link holds the program and the sys_enter_write tracepoint, as a perf event, the perf event holds the program as well, and the program holds both maps. A pin, a file in /sys/fs/bpf, holds whatever it names with no process at all." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>Who holds whom after load and attach</title><defs><marker id="ah-2-4p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><defs><marker id="ah-2-4p-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="ah-2-4p-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="ah-2-4p-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker></defs><text x="113" y="14" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">the loader process</text><text x="483" y="14" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">in the kernel</text><rect x="8" y="28" width="210" height="254" rx="6" fill="#EEF0F1" stroke="#4A5056" stroke-width="1"/><rect x="20" y="40" width="186" height="32" rx="5" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.1"/><text x="113" y="56" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">map fd · write_counts</text><path d="M206,56 L288,56" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-2-4p-k)"/><rect x="20" y="106" width="186" height="32" rx="5" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.1"/><text x="113" y="122" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">map fd · …_.rodata</text><path d="M206,122 L288,122" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-2-4p-k)"/><rect x="20" y="172" width="186" height="32" rx="5" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.1"/><text x="113" y="188" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">program fd</text><path d="M206,188 L288,188" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-2-4p-k)"/><rect x="20" y="238" width="186" height="32" rx="5" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.1"/><text x="113" y="254" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">link fd</text><path d="M206,254 L288,254" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-2-4p-k)"/><rect x="290" y="34.0" width="180" height="44" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="380.0" y="47" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">write_counts</text><text x="380.0" y="68" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">the hash map</text><rect x="290" y="100.0" width="180" height="44" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="380.0" y="113" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">hashmap_.rodata</text><text x="380.0" y="134" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">the bpf_printk string</text><rect x="290" y="166.0" width="180" height="44" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="380.0" y="179" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">count_writes</text><text x="380.0" y="200" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">the program, 27 slots</text><rect x="290" y="232.0" width="180" height="44" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="380.0" y="245" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">link</text><text x="380.0" y="266" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">one program on one hook</text><rect x="500" y="232.0" width="176" height="44" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="588.0" y="245" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">sys_enter_write</text><text x="588.0" y="266" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">tracepoint, as a perf event</text><path d="M380.0,232.0 L380.0,212.0" fill="none" stroke="#0F6E56" stroke-width="2.8" marker-end="url(#ah-2-4p-t)"/><path d="M470,254 L498,254" fill="none" stroke="#0F6E56" stroke-width="2.8" marker-end="url(#ah-2-4p-t)"/><path d="M380.0,166.0 L380.0,146.0" fill="none" stroke="#0F6E56" stroke-width="2.8" marker-end="url(#ah-2-4p-t)"/><path d="M470,180 L486,180 L486,56 L472,56" fill="none" stroke="#0F6E56" stroke-width="2.8" marker-end="url(#ah-2-4p-t)"/><path d="M588.0,232.0 L588.0,196 L472,196" fill="none" stroke="#0F6E56" stroke-width="2.8" marker-end="url(#ah-2-4p-t)"/><rect x="8" y="298" width="210" height="34" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3" stroke-dasharray="6 4"/><text x="113" y="315" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#1F2328" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">a pin: a file in </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">/sys/fs/bpf</tspan></text><path d="M218,315 L380.0,315 L380.0,278.0" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-2-4p-k)"/><text x="392.0" y="315" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">holds whatever it names, with no process at all</text><path d="M20,358 L62,358" fill="none" stroke="#0F6E56" stroke-width="2.8"/><text x="70" y="358" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">one kernel object holds another</text><path d="M290,358 L332,358" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-dasharray="6 4"/><text x="340" y="358" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">a descriptor or a pin holds an object</text></svg>