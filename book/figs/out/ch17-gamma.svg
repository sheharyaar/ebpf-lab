<svg viewBox="0 0 680 272" width="100%" role="img" aria-label="Left: x from γ(00x1) = {1, 3} and y from γ(0x10) = {2, 6}, as intervals [1, 3] and [2, 6]; every real sum x + y: 1 + 2 = 3, 1 + 6 = 7, 3 + 2 = 5, 3 + 6 = 9. Right, on the sixteen values 0 to 15: the real sums 3, 5, 7, 9; tnum_add(00x1, 0x10) = xxx1, whose γ holds the 8 odd values; interval addition [1, 3] + [2, 6] = [3, 9], 7 values; the values both answers allow, the real sums again." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>Concretization and a sound abstract addition on four bits</title><defs><marker id="ah-17-2p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="8" y="14" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">every real sum x + y</text><text x="92.0" y="40" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#4A5056">y = 2</text><text x="150.0" y="40" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#4A5056">y = 6</text><text x="33.0" y="68.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#4A5056">x = 1</text><rect x="66" y="54" width="52" height="28" rx="3" fill="#DCEFE8" stroke="#0F6E56" stroke-width="2"/><text x="92.0" y="68.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#0F6E56" font-weight="700">3</text><rect x="124" y="54" width="52" height="28" rx="3" fill="#DCEFE8" stroke="#0F6E56" stroke-width="2"/><text x="150.0" y="68.0" text-anchor="middle" dominant-baseline