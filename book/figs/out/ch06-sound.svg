troke-dasharray="4 3"/><text x="454" y="278" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">a real result left out</text></svg>