<svg viewBox="0 0 680 296" width="100%" role="img" aria-label="r1 holds 1 or 3, tnum 00x1, then r1 += 1. Three rows on the values 0 to 7: the real results, 1+1 and 3+1, are 2 and 4; tnum_add() says 0xx0, which allows 0, 2, 4 and 6: sound, it holds both real results, but imprecise, 0 and 6 never happen; a buggy answer, 0010, allows only 2: unsound, it misses 4, so a check passes that should fail." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>Sound and precise, on one addition</title><defs><marker id="ah-6-3p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="8" y="14" text-anchor="start" dominant-baseline="central" font-size="16" font-weight="700" fill="#1F2328" xml:space="preserve"><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">r1</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif"> holds 1 or 3: tnum </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">00x1</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">.   Then  </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">r1 += 1</tspan><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">.</tspan></text><text x="203.0" y="44" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">0</text><text x="261.0" y="44" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">1</text><text x="319.0" y="44" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">2</text><text x="377.0" y="44" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">3</text><text x="435.0" y="44" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">4</text><text x="493.0" y="44" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">5</text><text x="551.0" y="44" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">6</text><text x="609.0" y="44" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">7</text><line x1="8" y1="58" x2="676" y2="58" stroke="#1F2328" stroke-width="1.3"/><text x="8" y="75.0" text-anchor="start" dominant-baseline="central" font-size="15" font-weight="700" fill="#1F2328" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">real results</tspan></text><text x="8" y="95.0" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">1+1 and 3+1</text><rect x="176" y="70" width="54" height="28" rx="3" fill="#FFFFFF" stroke="#C9CCCF" stroke-width="0.8"/><rect x="234" y="70" width="54" height="28" rx="3" fill="#FFFFFF" stroke="#C9CCCF" stroke-width="0.8"/><rect x="292" y="70" width="54" height="28" rx="3" fill="#DCEFE8" stroke="#0F6E56" stroke-width="1.8"/><rect x="350" y="70" width="54" height="28" rx="3" fill="#FFFFFF" stroke="#C9CCCF" stroke-width="0.8"/><rect x="408" y="70" width="54" height="28" rx="3" fill="#DCEFE8" stroke="#0F6E56" stroke-width="1.8"/><rect x="466" y="70" width="54" height="28" rx="3" fill="#FFFFFF" stroke="#C9CCCF" stroke-width="0.8"/><rect x="524" y="70" width="54" height="28" rx="3" fill="#FFFFFF" stroke="#C9CCCF" stroke-width="0.8"/><rect x="582