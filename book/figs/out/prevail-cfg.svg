<svg viewBox="0 0 680 596" width="100%" role="img" aria-label="Flowchart of sum_once at N = 16 with the interval state the toy fixpoint keeps at each point. Slots 0 to 4 load data and end and compute data plus 16; slot 5 tests whether that is past the end, and exits if so; otherwise the packet length is at least 16. Slots 6 and 7 set w2 and r3 to 0. The loop body, slots 8 to 12 with the loop head at 8, reads one byte at r1 plus r3; at the head r3 is in [0, 15] after the fixpoint, so the read at offset 0 to 15 fits a packet of at least 16 bytes. Slot 13 tests r3 &gt;= 16; if not, slot 14 jumps back to 8 with r3 in [1, 15]; if so, r3 is 16 and slots 15 to 18 return 1 or 2." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>One state per node</title><defs><marker id="ah-prevail-cfg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect x="40" y="8" width="300" height="58" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190.0" y="27.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">slots 0 to 4</text><text x="190.0" y="48.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">r1 = data, r2 = end, r3 = data + 16</text><path d="M190.0,66.0 L190.0,84.0" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-prevail-cfg)"/><polygon points="50.0,126 190.0,84 330.0,126 190.0,168" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190.0" y="116" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">r3 &gt; r2 ?</text><text x="190.0" y="137" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">slot 5: past the end?</text><path d="M330.0,126.0 L368.0,126.0" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-prevail-cfg)"/><text x="338.0" y="113" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">yes</text><rect x="368.0" y="100" width="112" height="52" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="424.0" y="116.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">slot 18</text><text x="424.0" y="137.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">exit, r0 = 2</text><path d="M190.0,168.0 L190.0,214.0" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-prevail-cfg)"/><text x="180.0" y="180" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">no</text><rect x="40" y="214" width="300" height="52" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190.0" y="230.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">slots 6 and 7</text><text x="190.0" y="251.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">w2 = 0, r3 = 0</text><path d="M190.0,266.0 L190.0,296.0" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-prevail-cfg)"/><rect x="40" y="296" width="300" height="96" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2.6"/><text x="190.0" y="315.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#0F6E56" font-weight="700">slots 8 to 12, loop head at 8</text><text x="190.0" y="336.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">r4 = r1 + r3</text><text x="190.0" y="355.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">read 1 byte at r4 (slot 10)</text><text x="190.0" y="374.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">w2 += byte, r3 += 1</text><path d="M190.0,392.0 L190.0,416.0" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-prevail-cfg)"/><polygon points="50.0,458 190.0,416 330.0,458 190.0,500" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190.0" y="448" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">r3 &gt;= 16 ?</text><text x="190.0" y="469" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">slot 13: loop done?</text><path d="M190.0,500.0 L190.0,534.0" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-prevail-cfg)"/><text x="180.0" y="512" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">yes</text><rect x="40" y="534" width="300" height="52" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="190.0" y="550.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">slots 15 to 18</text><text x="190.0" y="571.5" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">return 2 - (w2 &amp; 1)</text><path d="M50.0,458.0 L14.0,458.0 L14.0,344.0 L40.0,344.0" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-prevail-cfg)"/><text x="40.0" y="445" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">no</text><text x="362" y="184" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">len in [16, 65535]</text><text x="362" y="272" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">r3 in [0, 0]  (entry)</text><text x="362" y="314" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">at the head, after the fixpoint:</text><text x="362" y="332" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">r3 in [0, 15]</text><text x="362" y="350" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">w2 in [0, 4294967295]</text><text x="362" y="374" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#0F6E56" font-weight="700">read: r4 = pkt + [0, 15], 15 + 1 &lt;= 16 &lt;= len</text><text x="362" y="449" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">slot 14, back to 8:</text><text x="362" y="467" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">r3 in [1, 15]</text><text x="362" y="512" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">r3 in [16, 16]</text><text x="362" y="560" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">r0 in [1, 2]</text></svg>