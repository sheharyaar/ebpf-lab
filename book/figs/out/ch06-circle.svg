<svg viewBox="0 0 680 282" width="100%" role="img" aria-label="A circle of sixteen values, unsigned 0 to 15 outside and signed −8 to 7 inside, with a thick arc from 14 to 2 holding 14, 15, 0, 1 and 2: read as signed it is −2 to 2, five values, exact; read as unsigned with a min and a max it must be 0 to 15, since the arc crosses 15 to 0. v7.1 kept both pairs and reconciled them; v7.2 keeps the arc and reads both off it." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>A circular range on four bits</title><defs><marker id="ah-6-4p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><circle cx="168" cy="150" r="96" fill="none" stroke="#9AA0A6" stroke-width="1.3"/><path d="M100.1,82.1 A96,96 0 0 1 235.9,82.1" fill="none" stroke="#0F6E56" stroke-width="6" stroke-linecap="round"/><circle cx="168.0" cy="54.0" r="5.5" fill="#0F6E56" stroke="#0F6E56" stroke-width="1.2"/><text x="168.0" y="33.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#0F6E56" font-weight="700">0</text><text x="168.0" y="77.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#0F6E56" font-weight="700">0</text><circle cx="204.7" cy="61.3" r="5.5" fill="#0F6E56" stroke="#0F6E56" stroke-width="1.2"/><text x="212.8" y="41.9" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#0F6E56" font-weight="700">1</text><text x="195.9" y="82.6" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#0F6E56" font-weight="700">1</text><circle cx="235.9" cy="82.1" r="5.5" fill="#0F6E56" stroke="#0F6E56" stroke-width="1.2"/><text x="250.7" y="67.3" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#0F6E56" font-weight="700">2</text><text x="219.6" y="98.4" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#0F6E56" font-weight="700">2</text><circle cx="256.7" cy="113.3" r="3.5" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.2"/><text x="276.1" y="105.2" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">3</text><text x="235.4" y="122.1" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">3</text><circle cx="264.0" cy="150.0" r="3.5" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.2"/><text x="285.0" y="150.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">4</text><text x="241.0" y="150.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">4</text><circle cx="256.7" cy="186.7" r="3.5" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.2"/><text x="276.1" y="194.8" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">5</text><text x="235.4" y="177.9" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">5</text><circle cx="235.9" cy="217.9" r="3.5" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.2"/><text x="250.7" y="232.7" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">6</text><text x="219.6" y="201.6" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">6</text><circle cx="204.7" cy="238.7" r="3.5" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.2"/><text x="212.8" y="258.1" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">7</text><text x="195.9" y="217.4" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">7</text><circle cx="168.0" cy="246.0" r="3.5" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.2"/><text x="168.0" y="267.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">8</text><text x="168.0" y="223.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">−8</text><circle cx="131.3" cy="238.7" r="3.5" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.2"/><text x="123.2" y="258.1" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">9</text><text x="140.1" y="217.4" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">−7</text><circle cx="100.1" cy="217.9" r="3.5" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.2"/><text x="85.3" y="232.7" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#1F2328">10</text><text x="116.4" y="201.6" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">−6</text><circle cx="79.3" cy="186.7" r="3.5" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.2"/><text x="59.9" y="194.8" text-anchor="middle" dominant-baseline="central"