<svg viewBox="0 0 680 360" width="100%" role="img" aria-label="Three columns for the same expression. Stack machine, WebAssembly from clang --target=wasm32, b, c, d in locals 0, 1, 2: local.get 1, local.get 0, i64.add, local.get 2, i64.mul, leaving a on top of the stack; 5 instructions, 12 memory accesses. Accumulator machine, classic BPF, b, c, d in scratch M[1] to M[3]: ld M[1], ldx M[2], add x, ldx M[3], mul x, leaving a in A; 5 instructions, 3 accesses. Register machine, eBPF from clang -target bpf, b, c, d in r1, r2, r3: r0 = r2, r0 += r1, r0 *= r3, leaving a in r0; 3 instructions, 0 accesses; on hardware the same line is leaq; imulq on x86-64 and add; mul on RISC-V." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>a = (b + c) * d on a stack machine, an accumulator machine and a register machine</title><defs><marker id="ah-P-1p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="114.0" y="14" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">Stack machine</text><text x="114.0" y="34" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">WebAssembly, from clang --target=wasm32</text><rect x="8" y="48" width="212" height="46" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="114.0" y="62" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">b, c, d in locals 0, 1, 2</text><text x="114.0" y="81" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">the operand stack is memory too</text><rect x="8" y="104" width="212" height="26" rx="4" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="18" y="117" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">local.get 1</text><text x="108" y="117" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">stack: c</text><circle cx="208" cy="117" r="4" fill="#0F6E56"/><circle cx="197" cy="117" r="4" fill="#0F6E56"/><rect x="8" y="135" width="212" height="26" rx="4" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="18" y="148" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">local.get 0</text><text x="108" y="148" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">stack: c b</text><circle cx="208" cy="148" r="4" fill="#0F6E56"/><circle cx="197" cy="148" r="4" fill="#0F6E56"/><rect x="8" y="166" width="212" height="26" rx="4" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="18" y="179" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">i64.add</text><text x="108" y="179" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">stack: b+c</text><circle cx="208" cy="179" r="4" fill="#0F6E56"/><circle cx="197" cy="179" r="4" fill="#0F6E56"/><circle cx="186" cy="179" r="4" fill="#0F6E56"/><rect x="8" y="197" width="212" height="26" rx="4" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="18" y="210" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">local.get 2</text><text x="108" y="210" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">stack: b+c d</text><circle cx="208" cy="210" r="4" fill="#0F6E56"/><circle cx="197" cy="210" r="4" fill="#0F6E56"/><rect x="8" y="228" width="212" height="26" rx="4" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="18" y="241" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">i64.mul</text><text x="108" y="241" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">stack: a</text><circle cx="208" cy="241" r="4" fill="#0F6E56"/><circle cx="197" cy="241" r="4" fill="#0F6E56"/><circle cx="186" cy="241" r="4" fill="#0F6E56"/><text x="114.0" y="278" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">a is left on top of the stack</text><rect x="8" y="292" width="212" height="30" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.8"/><text x="114.0" y="307" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">5 instructions · 12 accesses</text><text x="340.0" y="14" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">Accumulator machine</text><text x="340.0" y="34" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">classic BPF, the 1993 machine</text><rect x="234" y="48" width="212" height="46" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="340.0" y="62" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">b, c, d in scratch M[1]–M[3]</text><text x="340.0" y="81" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">only A and X are registers</text><rect x="234" y="104" width="212" height="26" rx="4" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="244" y="117" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">ld M[1]</text><text x="334" y="117" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">A = b</text><circle cx="434" cy="117" r="4" fill="#0F6E56"/><rect x="234" y="135" width="212" height="26" rx="4" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="244" y="148" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">ldx M[2]</text><text x="334" y="148" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">X = c</text><circle cx="434" cy="148" r="4" fill="#0F6E56"/><rect x="234" y="166" width="212" height="26" rx="4" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="244" y="179" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">add x</text><text x="334" y="179" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">A = b+c</text><rect x="234" y="197" width="212" height="26" rx="4" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="244" y="210" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">ldx M[3]</text><text x="334" y="210" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">X = d</text><circle cx="434" cy="210" r="4" fill="#0F6E56"/><rect x="234" y="228" width="212" height="26" rx="4" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="244" y="241" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">mul x</text><text x="334" y="241" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">A = a</text><text x="340.0" y="278" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">a is left in A</text><rect x="234" y="292" width="212" height="30" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.8"/><text x="340.0" y="307" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">5 instructions · 3 accesses</text><text x="566.0" y="14" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">Register machine</text><text x="566.0" y="34" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">eBPF, from clang -target bpf</text><rect x="460" y="48" width="212" height="46" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="566.0" y="62" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">b, c, d in r1, r2, r3</text><text x="566.0" y="81" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">ten registers to hold values</text><rect x="460" y="104" width="212" height="26" rx="4" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="470" y="117" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">r0 = r2</text><text x="560" y="117" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">r0 = c</text><rect x="460" y="135" width="212" height="26" rx="4" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="470" y="148" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">r0 += r1</text><text x="560" y="148" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">r0 = b+c</text><rect x="460" y="166" width="212" height="26" rx="4" fill="#FFFFFF" stroke="#4A5056" stroke-width="1"/><text x="470" y="179" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">r0 *= r3</text><text x="560" y="179" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">r0 = a</text><text x="566.0" y="278" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">a is left in r0</text><rect x="460" y="292" width="212" height="30" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.8"/><text x="566.0" y="307" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">3 instructions · 0 accesses</text><rect x="460" y="198" width="212" height="62" rx="4" fill="#FFFFFF" stroke="#4A5056" stroke-width="1" stroke-dasharray="4 3"/><text x="470" y="213" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">the same line on hardware:</text><text x="470" y="231" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">x86-64</text><text x="530" y="231" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#4A5056">leaq; imulq</text><text x="470" y="249" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">RISC-V</text><text x="530" y="249" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#4A5056">add; mul</text><circle cx="16" cy="344" r="4" fill="#0F6E56"/><text x="28" y="344" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">one read or write of memory, counted with the operand stack in memory and A, X, r0–r3 in processor registers</text></svg>