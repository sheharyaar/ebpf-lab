<svg viewBox="0 0 680 410" width="100%" role="img" aria-label="Three bands. User space maps the arena of 1,024 pages at 0x7f5cac7d3000 and finds the hash table at 0x7f5cac7d3fe8 on page 0. The program holds the same pointer as a register of type arena whose value is the low 32 bits, 0xac7d3fe8; a cast to the kernel space keeps the low 32 bits and a cast back adds the mapping's upper 32 bits. The kernel set aside 4 GiB plus 64 KiB of addresses from kern_vm_start; each load or store in the program goes to kern_vm_start plus the offset, with kern_vm_start held in register r12. Both mappings point at the same 4 KiB page, which a user-space fault or bpf_arena_alloc_pages put there." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>One arena page seen three ways</title><defs><marker id="ah-mem-arena" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="40" y="16" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">user space: the loader’s mapping of the arena (1,024 pages, 4 MiB)</text><rect x="40" y="32" width="630" height="40" rx="4" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><rect x="40" y="32" width="64" height="40" rx="4" fill="#F3F4F2" stroke="#0F6E56" stroke-width="2.6"/><text x="72" y="52" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#0F6E56" font-weight="700">page 0</text><text x="390" y="52" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">0x7f5cac7d3000 … 0x7f5cacbd3000</text><text x="40" y="92" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">the table: 0x7f5cac7d3fe8</text><rect x="40" y="150" width="290" height="44" rx="4" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="185" y="172" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">0x00000000ac7d3fe8</text><text x="350" y="140" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">the program: a register of type arena</text><text x="350" y="164" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">solid: cast to the kernel’s space,</text><text x="350" y="182" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">keep the low 32 bits; dashed: cast</text><text x="350" y="200" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">back, add the mapping’s upper 32 bits</text><path d="M120,102 L120,146" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-mem-arena)"/><path d="M210,146 L210,102" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah-mem-arena)"/><text x="40" y="234" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">the kernel: 4 GiB + 64 KiB of addresses, set aside when the map was created</text><text x="40" y="254" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="14.5" fill="#4A5056">each load or store: [kern_vm_start + 0xac7d3fe8 + off], kern_vm_start in r12</text><rect x="40" y="270" width="630" height="40" rx="4" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><rect x="440" y="270" width="64" height="40" rx="4" fill="#F3F4F2" stroke="#0F6E56" stroke-width="2.6"/><text x="472" y="290" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#0F6E56" font-weight="700">page 0</text><text x="50" y="290" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">kern_vm_start</text><rect x="240" y="350" width="280" height="50" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2.6"/><text x="380.0" y="365.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">one 4 KiB page</text><text x="380.0" y="386.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">the same memory on both sides</text><path d="M40,52 L20,52 L20,375 L236,375" fill="none" stroke="#0F6E56" stroke-width="2" marker-end="url(#ah-mem-arena)"/><path d="M472,310 L472,346" fill="none" stroke="#0F6E56" stroke-width="2" marker-end="url(#ah-mem-arena)"/><text x="30" y="336" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">mapped in by a user fault</text><text x="484" y="330" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">or by bpf_arena_alloc_pages()</text></svg>