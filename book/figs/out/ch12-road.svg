<svg viewBox="0 0 680 484" width="100%" role="img" aria-label="Flowchart: the author may first open a pull request against bpf-next_base, where BPF CI runs the selftests. The patch goes by git send-email to the bpf mailing list with PATCH bpf-next in its subject, waits in patchwork, and is reviewed by the BPF maintainers; if changes are requested it goes back to the list. Otherwise it is applied to the bpf-next tree and goes on to net-next, then mainline." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>The road from a change to mainline</title><defs><marker id="ah-12-4p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><defs><marker id="ah-12-4p-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="ah-12-4p-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="ah-12-4p-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5056"/></marker></defs><rect x="60" y="10" width="280" height="54" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="200" y="27.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">the author</text><text x="200" y="47.0" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#4A5056" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">a feature or cleanup, for bpf-next</tspan></text><rect x="430" y="6" width="242" height="86" rx="5" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.3" stroke-dasharray="6 4"/><text x="551.0" y="24" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">BPF CI on GitHub</text><text x="551.0" y="44" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#4A5056" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">pull request against </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">bpf-next_base</tspan></text><text x="551.0" y="64" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">selftests pass or fail</text><path d="M340,28 L428,28" fill="none" stroke="#4A5056" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah-12-4p-g)"/><path d="M430,50 L342,50" fill="none" stroke="#4A5056" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah-12-4p-g)"/><text x="385.0" y="76" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">optional</text><path d="M200,64 L200,92" fill="none" stroke="#1F2328" stroke-width="2.2" marker-end="url(#ah-12-4p-k)"/><rect x="60" y="94" width="280" height="66" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="200" y="107.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">git send-email</text><text x="200" y="127.0" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#4A5056" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">to the bpf mailing list,</tspan></text><text x="200" y="147.0" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#4A5056" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">subject </tspan><tspan font-family="'Ubuntu Mono', 'JetBrains Mono', monospace">PATCH bpf-next</tspan></text><path d="M200,160 L200,186" fill="none" stroke="#1F2328" stroke-width="2.2" marker-end="url(#ah-12-4p-k)"/><rect x="60" y="188" width="280" height="52" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="200" y="204.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">patchwork</text><text x="200" y="224.0" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#4A5056" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">queued for review</tspan></text><path d="M200,240 L200,264" fill="none" stroke="#1F2328" stroke-width="2.2" marker-end="url(#ah-12-4p-k)"/><polygon points="68,316 200,266 332,316 200,366" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="200" y="306" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">BPF maintainers</text><text x="200" y="326" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328">review: changes requested?</text><path d="M332,316 L400,316 L400,127 L342,127" fill="none" stroke="#1F2328" stroke-width="2.2" marker-end="url(#ah-12-4p-k)"/><text x="342" y="304" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">yes</text><path d="M200,366 L200,396" fill="none" stroke="#1F2328" stroke-width="2.2" marker-end="url(#ah-12-4p-k)"/><text x="212" y="380" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">no</text><rect x="60" y="398" width="280" height="52" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="200" y="414.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">bpf-next tree</text><text x="200" y="434.0" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#4A5056" xml:space="preserve"><tspan font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif">applied</tspan></text><text x="200" y="468" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="700">on to net-next, then mainline</text><path d="M430,420 L470,420" fill="none" stroke="#1F2328" stroke-width="2.2"/><text x="478" y="420" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">the road</text><path d="M430,444 L470,444" fill="none" stroke="#4A5056" stroke-width="1.6" stroke-dasharray="6 4"/><text x="478" y="444" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">optional</text></svg>