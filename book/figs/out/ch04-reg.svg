<svg viewBox="0 0 680 250" width="100%" role="img" aria-label="Three entries from the verifier log. After slot 8: R0=map_value_or_null(id=1,map=write_counts,ks=4,vs=8), taken apart: map_value, what r0 points at, a value inside a map; _or_null, maybe NULL, no read through r0 until a test; id=1, shared by every copy of this pointer; map=write_counts, which map the value lives in; ks=4,vs=8, key 4 bytes, value 8, reads stay inside vs. After slot 9, on the path where the test failed: the same entry with _or_null gone. At slot 12: R3=scalar(smin=0,smax=umax=0xffffffff,…), a plain number, with bounds." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>One register's state at one instruction, part by part</title><defs><marker id="ah-4-3p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="20" y="12" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">after slot 8, the call to the map lookup, the kernel writes down:</text><text x="20" y="38" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" xml:space="preserve"><tspan fill="#1F2328">R0=</tspan><tspan fill="#1F2328" font-weight="700">map_value</tspan><tspan fill="#0F6E56" font-weight="700">_or_null</tspan><tspan fill="#1F2328">(</tspan><tspan fill="#1F2328" font-weight="700">id=1</tspan><tspan fill="#1F2328">,</tspan><tspan fill="#1F2328" font-weight="700">map=write_counts</tspan><tspan fill="#1F2328">,</tspan><tspan fill="#1F2328" font-weight="700">ks=4,vs=8</tspan><tspan fill="#1F2328">)</tspan></text><path d="M45.0,50 v5 H115.0 v-5" fill="none" stroke="#1F2328" stroke-width="1.2"/><path d="M80.0,55 L68,80" fill="none" stroke="#1F2328" stroke-width="1.2"/><text x="68" y="92" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">what r0 points at:</text><text x="68" y="110" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">a value inside a map</text><path d="M117.0,50 v5 H179.0 v-5" fill="none" stroke="#0F6E56" stroke-width="2.2"/><path d="M148.0,55 L204,80" fill="none" stroke="#0F6E56" stroke-width="2.2"/><text x="204" y="92" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#0F6E56" font-weight="700">maybe NULL: no read</text><text x="204" y="110" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#0F6E56">through r0 until a test</text><path d="M189.0,50 v5 H219.0 v-5" fill="none" stroke="#1F2328" stroke-width="1.2"/><path d="M204.0,55 L340,80" fill="none" stroke="#1F2328" stroke-width="1.2"/><text x="340" y="92" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">shared by every copy</text><text x="340" y="110" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">of this pointer</text><path d="M229.0,50 v5 H355.0 v-5" fill="none" stroke="#1F2328" stroke-width="1.2"/><path d="M292.0,55 L476,80" fill="none" stroke="#1F2328" stroke-width="1.2"/><text x="476" y="92" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">which map the</text><text x="476" y="110" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">value lives in</text><path d="M365.0,50 v5 H435.0 v-5" fill="none" stroke="#1F2328" stroke-width="1.2"/><path d="M400.0,55 L612,80" fill="none" stroke="#1F2328" stroke-width="1.2"/><text x="612" y="92" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">key 4 bytes, value 8:</text><text x="612" y="110" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">reads stay inside vs</text><text x="20" y="146" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">after slot 9, on the path where the test failed (r0 is not 0):</text><text x="20" y="172" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" xml:space="preserve"><tspan fill="#1F2328">R0=</tspan><tspan fill="#1F2328" font-weight="700">map_value</tspan><tspan fill="#1F2328">(id=1,map=write_counts,ks=4,vs=8)</tspan></text><text x="404.0" y="172" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#0F6E56" font-weight="700">_or_null is gone</text><text x="20" y="206" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">at slot 12, the key read back as a number:</text><text x="20" y="232" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" xml:space="preserve"><tspan fill="#1F2328">R3=</tspan><tspan fill="#1F2328" font-weight="700">scalar</tspan><tspan fill="#1F2328">(smin=0,smax=umax=0xffffffff,…)</tspan></text><text x="364.0" y="232" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056" font-style="italic">a plain number, with bounds</text></svg>