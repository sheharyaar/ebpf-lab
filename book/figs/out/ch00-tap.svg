<svg viewBox="0 0 680 418" width="100%" role="img" aria-label="Redrawn from Figure 1 of the 1993 BSD Packet Filter paper: three link-level drivers take packets from the network and call BPF, the tap, which runs every listener’s filter on the packet where it lies; only accepted bytes are copied up into each listener’s buffer, read by two network monitors and rarpd in user space. One driver also passes the packet on to the protocol stack." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>The BSD network tap</title><defs><marker id="ah-0-2p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><defs><marker id="ah-0-2p-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="ah-0-2p-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="ah-0-2p-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker></defs><text x="12" y="14" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">user space</text><rect x="25.0" y="26" width="150" height="36" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="100" y="44" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">network monitor</text><rect x="195.0" y="26" width="150" height="36" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="270" y="44" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">network monitor</text><rect x="365.0" y="26" width="150" height="36" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="440" y="44" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">rarpd</text><line x1="8" y1="80" x2="672" y2="80" stroke="#4A5056" stroke-width="1" stroke-dasharray="6 4"/><text x="12" y="94" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">kernel</text><rect x="25.0" y="104" width="150" height="34" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="100" y="121" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">buffer</text><rect x="25.0" y="172" width="150" height="34" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.6"/><text x="100" y="189" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">filter</text><path d="M100,104 L100,64" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-0-2p-k)"/><path d="M100,172 L100,141" fill="none" stroke="#0F6E56" stroke-width="3.2" marker-end="url(#ah-0-2p-t)"/><path d="M100,238 L100,209" fill="none" stroke="#0F6E56" stroke-width="3.2" marker-end="url(#ah-0-2p-t)"/><rect x="195.0" y="104" width="150" height="34" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="270" y="121" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">buffer</text><rect x="195.0" y="172" width="150" height="34" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.6"/><text x="270" y="189" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">filter</text><path d="M270,104 L270,64" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-0-2p-k)"/><path d="M270,172 L270,141" fill="none" stroke="#0F6E56" stroke-width="3.2" marker-end="url(#ah-0-2p-t)"/><path d="M270,238 L270,209" fill="none" stroke="#0F6E56" stroke-width="3.2" marker-end="url(#ah-0-2p-t)"/><rect x="365.0" y="104" width="150" height="34" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="440" y="121" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">buffer</text><rect x="365.0" y="172" width="150" height="34" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.6"/><text x="440" y="189" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">filter</text><path d="M440,104 L440,64" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-0-2p-k)"/><path d="M440,172 L440,141" fill="none" stroke="#0F6E56" stroke-width="3.2" marker-end="url(#ah-0-2p-t)"/><path d="M440,238 L440,209" fill="none" stroke="#0F6E56" stroke-width="3.2" marker-end="url(#ah-0-2p-t)"/><text x="454" y="155" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">only accepted bytes are copied up</text><rect x="25" y="238" width="490" height="48" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.6"/><text x="270" y="253" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">BPF: the tap</text><text x="270" y="273" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">runs every listener’s filter on the packet where it lies</text><rect x="545" y="172" width="125" height="114" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="607" y="220" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">protocol</text><text x="607" y="240" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">stack</text><rect x="30" y="322" width="140" height="34" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="100" y="339" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">link-level driver</text><path d="M100,384 L100,359" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-0-2p-k)"/><path d="M100,322 L100,289" fill="none" stroke="#0F6E56" stroke-width="3.2" marker-end="url(#ah-0-2p-t)"/><rect x="230" y="322" width="140" height="34" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="300" y="339" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">link-level driver</text><path d="M300,384 L300,359" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-0-2p-k)"/><path d="M300,322 L300,289" fill="none" stroke="#0F6E56" stroke-width="3.2" marker-end="url(#ah-0-2p-t)"/><rect x="410" y="322" width="140" height="34" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="480" y="339" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">link-level driver</text><path d="M480,384 L480,359" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-0-2p-k)"/><path d="M480,322 L480,289" fill="none" stroke="#0F6E56" stroke-width="3.2" marker-end="url(#ah-0-2p-t)"/><path d="M530,322 L586,289" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah-0-2p-k)"/><line x1="8" y1="386" x2="672" y2="386" stroke="#1F2328" stroke-width="2.2"/><text x="12" y="402" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">network</text><path d="M330,404 L372,404" fill="none" stroke="#0F6E56" stroke-width="3.2"/><text x="380" y="404" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">a packet, through BPF</text><path d="M516,404 L558,404" fill="none" stroke="#1F2328" stroke-width="1.5"/><text x="566" y="404" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">the rest of the path</text></svg>