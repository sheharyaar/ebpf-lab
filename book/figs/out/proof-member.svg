<svg viewBox="0 0 680 284" width="100%" role="img" aria-label="The tnum 1x0x is the pair value 1000, mask 0101. A four-bit x belongs to it when x AND NOT m equals v: 1101 passes, 0101 does not. Of the sixteen values 0 to 15, the members are 8, 9, 12 and 13." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>What a tnum stands for</title><defs><marker id="ah-proof-member" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="136" y="31.0" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328">the tnum</text><rect x="150" y="14" width="40" height="34" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.2"/><text x="170.0" y="31.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="18" fill="#1F2328" font-weight="700">1</text><rect x="190" y="14" width="40" height="34" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/><text x="210.0" y="31.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="18" fill="#0F6E56" font-weight="700">x</text><rect x="230" y="14" width="40" height="34" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.2"/><text x="250.0" y="31.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="18" fill="#1F2328" font-weight="700">0</text><rect x="270" y="14" width="40" height="34" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/><text x="290.0" y="31.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="18" fill="#0F6E56" font-weight="700">x</text><text x="136" y="73.0" text-anchor="end" dominant-baseline="central" font-family="