" y="115.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328">0</text><rect x="270" y="98" width="40" height="34" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.2"/><text x="290.0" y="115.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328">1</text><text x="230" y="146" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">bit 3 on the left, bit 0 on the right</text><text x="345" y="24" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">the test: x &amp; ~m == v</text><text x="345" y="58" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15.5" fill="#1F2328">x = 1101:  1101 &amp; 1010 = 1000</text><text x="593" y="58" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#0F6E56" font-weight="700">in</text><text x="345" y="86" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15.5" fill="#1F2328">x = 0101:  0101 &amp; 1010 = 0000</text><text x="593" y="86" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15.5" fill="#1F2328" font-weight="700">not in</text><text x="345" y="116" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">~m = 1010 keeps the known bits 3 and 1</text><text x="340" y="176" text-anchor="middle" dominant-baseline="central" font-family