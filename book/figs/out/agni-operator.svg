<svg viewBox="0 0 680 500" width="100%" role="img" aria-label="Flowchart of the kernel's 64-bit AND on two registers P and Q, each with five values: tnum, u64, s64, u32, s32. For the refined specification only, each input first passes through the tail. Then tnum_and computes the tnum, scalar32_min_max_and the 32-bit bounds, from the new tnum and the inputs, and scalar_min_max_and the 64-bit bounds, again reading the new tnum; in 5.12 the 32-bit function returns early when both low halves are known. The tail, __update_reg_bounds, __reg_deduce_bounds and __reg_bound_offset, ends every ALU operator. The claim is that x AND y lies in each of the five values of the result R; in 5.12 it fails for u32 and s32, in 5.13 it holds in all five." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>One AND, five values, a shared tail</title><defs><marker id="ah-agni-operator" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="40" y="22.0" text-anchor="end" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">P</text><rect x="52" y="8" width="54" height="28" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.1"/><text x="79.0" y="22.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">tnum</text><rect x="106" y="8" width="54" height="28" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.1"/><text x="133.0" y="22.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">u64</text><rect x="160" y="8" width="54" height="28" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.1"/><text x="187.0" y="22.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">s64</text><rect x="214" y="8" width="54" height="28" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.1"/><text x="241.0" y="22.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">u32</text><rect x="268" y="8" width="54" height="28" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.1"/><text x="295.0" y="22.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">s32</text><text x="40" y="56.0" text-anchor="end" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">Q</text><rect x="52" y="42" width="54" height="28" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.1"/><text x="79.0" y="56.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">tnum</text><rect x="106" y="42" width="54" height="28" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.1"/><text x="133.0" y="56.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">u64</text><rect x="160" y="42" width="54" height="28" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.1"/><text x="187.0" y="56.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">s64</text><rect x="214" y="42" width="54" height="28" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.1"/><text x="241.0" y="56.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">u32</text><rect x="268" y="42" width="54" height="28" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.1"/><text x="295.0" y="56.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">s32</text><text x="350" y="16" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">two registers, five values each;</text><text x="350" y="34" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">x is in all five of P, y in all five of Q</text><path d="M180.0,72.0 L180.0,92.0" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-agni-operator)"/><rect x="30" y="92" width="300" height="46" rx="5" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.4" stroke-dasharray="6 4"/><text x="180.0" y="115.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="16" fill="#1F2328" font-weight="700">the tail, on P and on Q</text><text x="350" y="104" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">sro only; gen skips this step</text><rect x="30" y="160" width="300" height="46" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="180.0" y="183.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">tnum_and()</text><rect x="30" y="226" width="300" height="46" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="180.0" y="249.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">scalar32_min_max_and()</text><rect x="30" y="292" width="300" height="46" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="180.0" y="315.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">scalar_min_max_and()</text><path d="M180.0,138.0 L180.0,160.0" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-agni-operator)"/><path d="M180.0,206.0 L180.0,226.0" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-agni-operator)"/><path d="M180.0,272.0 L180.0,292.0" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-agni-operator)"/><path d="M180.0,338.0 L180.0,358.0" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-agni-operator)"/><text x="350" y="183" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">tnum from the two tnums</text><text x="350" y="234" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">u32 min from the new tnum; s32 from u32</text><text x="350" y="252" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">if both s32 minima are not negative</text><text x="350" y="270" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#0F6E56" font-weight="700">5.12: returns early if both low halves are known</text><text x="350" y="304" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">u64 min from the new tnum; s64 from u64</text><text x="350" y="322" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">if both s64 minima are not negative</text><rect x="30" y="358" width="300" height="84" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="180.0" y="378" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">__update_reg_bounds()</text><text x="180.0" y="399" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">__reg_deduce_bounds()</text><text x="180.0" y="420" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">__reg_bound_offset()</text><text x="350" y="372" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">the tail every ALU operator ends with:</text><text x="350" y="390" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">bounds from the tnum, signed from</text><text x="350" y="408" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">unsigned, tnum from the bounds</text><path d="M180.0,442.0 L180.0,462.0" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-agni-operator)"/><text x="40" y="476.0" text-anchor="end" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">R</text><rect x="52" y="462" width="54" height="28" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.1"/><text x="79.0" y="476.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">tnum</text><rect x="106" y="462" width="54" height="28" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.1"/><text x="133.0" y="476.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">u64</text><rect x="160" y="462" width="54" height="28" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.1"/><text x="187.0" y="476.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#1F2328">s64</text><rect x="214" y="462" width="54" height="28" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2.4"/><text x="241.0" y="476.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#0F6E56" font-weight="700">u32</text><rect x="268" y="462" width="54" height="28" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2.4"/><text x="295.0" y="476.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#0F6E56" font-weight="700">s32</text><text x="350" y="470" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">is x &amp; y in each of the five values of R?</text><text x="350" y="488" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">5.12: not in u32 or s32; 5.13: in all</text></svg>