<svg viewBox="0 0 680 384" width="100%" role="img" aria-label="Log-log plot of seconds against bit width from 4 to 64. The exhaustive checker on tnum_and rises from 0.02 s at 4 bits to 987 s at 8 bits, sixteenfold per bit. Z3 proves tnum_add in 0.012 s at 8 bits up to 0.77 s at 64, and tnum_and in 2 to 6 ms. Z3 proves the multiplication of Linux 5.12 in 13 s at 8 bits and gives no answer within 60 s at 16 bits; the CGO 2022 paper reports none within 24 hours." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>Time against width</title><defs><marker id="ah-proof-time" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect x="96" y="30" width="504" height="300" fill="none" stroke="#4A5056" stroke-width="1"/><line x1="91" y1="330.0" x2="96" y2="330.0" stroke="#4A5056" stroke-width="1"/><text x="87" y="330.0" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">1 ms</text><line x1="91" y1="255.0" x2="96" y2="255.0" stroke="#4A5056" stroke-width="1"/><text x="87" y="255.0" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">0.1 s</text><line x1="91" y1="180.0" x2="96" y2="180.0" stroke="#4A5056" stroke-width="1"/><text x="87" y="180.0" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">10 s</text><line x1="91" y1="105.0" x2="96" y2="105.0" stroke="#4A5056" stroke-width="1"/><text x="87" y="105.0" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">1,000 s</text><line x1="91" y1="30.0" x2="96" y2="30.0" stroke="#4A5056" stroke-width="1"/><text x="87" y="30.0" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">100,000 s</text><line x1="96.0" y1="330" x2="96.0" y2="335" stroke="#4A5056" stroke-width="1"/><text x="96.0" y="348" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">4</text><line x1="222.0" y1="330" x2="222.0" y2="335" stroke="#4A5056" stroke-width="1"/><text x="222.0" y="348" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">8</text><line x1="348.0" y1="330" x2="348.0" y2="335" stroke="#4A5056" stroke-width="1"/><text x="348.0" y="348" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">16</text><line x1="474.0" y1="330" x2="474.0" y2="335" stroke="#4A5056" stroke-width="1"/><text x="474.0" y="348" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">32</text><line x1="600.0" y1="330" x2="600.0" y2="335" stroke="#4A5056" stroke-width="1"/><text x="600.0" y="348" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">64</text><text x="348.0" y="370" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328">width of the bit-vectors, in bits</text><line x1="96" y1="32.4" x2="600" y2="32.4" stroke="#B8BCC0" stroke-width="1.2" stroke-dasharray="2 4"/><text x="594" y="21.3807346570415" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">one day</text><path d="M96.0,281.2 L136.6,241.4 L169.7,195.8 L197.7,150.9 L222.0,105.2" fill="none" stroke="#0F6E56" stroke-width="2.6"/><circle cx="96.0" cy="281.2" r="4.5" fill="#0F6E56"/><circle cx="136.6" cy="241.4" r="4.5" fill="#0F6E56"/><circle cx="169.7" cy="195.8" r="4.5" fill="#0F6E56"/><circle cx="197.7" cy="150.9" r="4.5" fill="#0F6E56"/><circle cx="222.0" cy="105.2" r="4.5" fill="#0F6E56"/><path d="M222.0,105.2 L251.3,42.0" fill="none" stroke="#0F6E56" stroke-width="2.2" stroke-dasharray="5 4"/><text x="106" y="49.60795294801267" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#0F6E56" font-weight="700">checker, tnum_and:</text><text x="106" y="67.60795294801267" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#0F6E56" font-weight="700">16 min at 8 bits,</text><text x="106" y="85.60795294801267" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#0F6E56">×16 for each bit more</text><path d="M222.0,289.5 L348.0,262.8 L474.0,250.6 L600.0,221.7" fill="none" stroke="#1F2328" stroke-width="2.2"/><rect x="217.5" y="285.0" width="9" height="9" fill="#1F2328"/><rect x="343.5" y="258.3" width="9" height="9" fill="#1F2328"/><rect x="469.5" y="246.1" width="9" height="9" fill="#1F2328"/><rect x="595.5" y="217.2" width="9" height="9" fill="#1F2328"/><text x="592.0" y="203.7354608230891" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328" font-weight="700">Z3, tnum_add: 0.77 s</text><path d="M222.0,318.7 L348.0,312.1 L474.0,312.1 L600.0,300.8" fill="none" stroke="#4A5056" stroke-width="1.8" stroke-dasharray="3 3"/><circle cx="222.0" cy="318.7" r="4" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.6"/><circle cx="348.0" cy="312.1" r="4" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.6"/><circle cx="474.0" cy="312.1" r="4" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.6"/><circle cx="600.0" cy="300.8" r="4" fill="#FFFFFF" stroke="#4A5056" stroke-width="1.6"/><text x="592.0" y="284.81932811061336" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056">Z3, tnum_and: 6 ms</text><path d="M222.0,169.5 l6,6 l-6,6 l-6,-6 z" fill="#1F2328"/><text x="234.0" y="167.47847757978064" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">Z3, tnum_mul</text><text x="234.0" y="185.47847757978064" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#1F2328">of 5.12: 13 s</text><path d="M348.0,144.8 l6,6 l-6,6 l-6,-6 z" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.4"/><path d="M348.0,142.8 L348.0,40.4" fill="none" stroke="#1F2328" stroke-width="1.4" marker-end="url(#ah-proof-time)"/><text x="358.0" y="152.81932811061336" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">at 16 bits: no answer in 60 s,</text><text x="358.0" y="170.81932811061336" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#4A5056" font-style="italic">none in 24 hours (CGO 2022)</text></svg>