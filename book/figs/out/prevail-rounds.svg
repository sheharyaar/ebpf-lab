<svg viewBox="0 0 680 384" width="100%" role="img" aria-label="Seven number lines from 0 to 20 with an arrow to infinity. Entry: r3 is 0. Round 1, join: 0 to 1. Round 2, widen: 0 to infinity. Round 3 with the test r3 &gt;= 16: kept at 0 to 15, inside the limit of 15 that the read at slot 10 needs. Round 3 with --no-narrow, and round 3 with the compiled test r3 == 16: still 0 to infinity, past the limit. Linux: sixteen separate points, 0 to 15, one state for each round." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>r3 at the loop head, round by round</title><defs><marker id="ah-prevail-rounds" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><line x1="540.2" y1="26" x2="540.2" y2="340" stroke="#0F6E56" stroke-width="1.6" stroke-dasharray="5 4"/><text x="534.25" y="18" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="14.5" fill="#0F6E56" font-weight="700">the read at slot 10 needs r3 &lt;= 15</text><text x="284" y="50" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328">entry, from slot 7</text><line x1="300" y1="50" x2="640" y2="50" stroke="#B8BCC0" stroke-width="1"/><line x1="300.0" y1="46" x2="300.0" y2="54" stroke="#B8BCC0" stroke-width="1"/><line x1="377.5" y1="46" x2="377.5" y2="54" stroke="#B8BCC0" stroke-width="1"/><line x1="455.0" y1="46" x2="455.0" y2="54" stroke="#B8BCC0" stroke-width="1"/><line x1="532.5" y1="46" x2="532.5" y2="54" stroke="#B8BCC0" stroke-width="1"/><line x1="610.0" y1="46" x2="610.0" y2="54" stroke="#B8BCC0" stroke-width="1"/><circle cx="300.0" cy="50" r="5" fill="#1F2328"/><text x="284" y="94" text-anchor="end" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open S