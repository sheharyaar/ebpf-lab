<svg viewBox="0 0 680 476" width="100%" role="img" aria-label="The program looks up slot 0 of an array of maps, which holds a pointer to hash A, and then looks up a key in A. User space replaces slot 0 with hash B in one update, and A is freed after a grace period. Below, the template the outer map keeps: hash, 4-byte key, 8-byte value, flags 0, BTF fields, against which loads and updates are checked." font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>A map of maps: two lookups, a template checked at load and at update, and a swap of a whole inner map</title><defs><marker id="ah-16-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><defs><marker id="ah-16-3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker></defs><path d="M420,16 L462,16" fill="none" stroke="#1F2328" stroke-width="1.8"/><text x="470" y="16" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328">a lookup follows</text><path d="M420,40 L462,40" fill="none" stroke="#0F6E56" stroke-width="2.4" stroke-dasharray="7 5"/><text x="470" y="40" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#0F6E56" font-weight="600">user space swaps slot 0</text><rect x="10" y="92" width="160" height="62" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="90.0" y="113.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">count_writes</text><text x="90.0" y="134.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">two lookups</text><text x="315.0" y="64" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="600">outer map</text><text x="315.0" y="80" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#4A5056">ARRAY_OF_MAPS</text><rect x="240" y="92" width="150" height="34" rx="0" fill="#E4E6E8" stroke="#1F2328" stroke-width="1.1"/><text x="256" y="109.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#4A5056">0</text><text x="274" y="109.0" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328">points to A</text><rect x="240" y="126" width="150" height="34" rx="0" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.1"/><text x="256" y="143.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#4A5056">1</text><text x="274" y="143.0" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">empty</text><rect x="240" y="160" width="150" height="34" rx="0" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.1"/><text x="256" y="177.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#4A5056">2</text><text x="274" y="177.0" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">empty</text><rect x="240" y="194" width="150" height="34" rx="0" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.1"/><text x="256" y="211.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15" fill="#4A5056">3</text><text x="274" y="211.0" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">empty</text><rect x="480" y="92" width="190" height="62" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="575.0" y="113.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">HASH  A</text><text x="575.0" y="134.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">the counts so far</text><rect x="480" y="196" width="190" height="62" rx="5" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.3"/><text x="575.0" y="217.0" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="16" fill="#1F2328" font-weight="700">HASH  B</text><text x="575.0" y="238.0" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">empty, ready</text><path d="M170,109 L238,109" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-16-3)"/><text x="205.0" y="96" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="600">lookup 1</text><path d="M390,109 L478,109" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah-16-3)"/><text x="435.0" y="96" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="600">lookup 2</text><path d="M390,116 L440,116 L440,227 L478,227" fill="none" stroke="#0F6E56" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ah-16-3a)"/><text x="452" y="175" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#0F6E56" font-weight="600">one update:</text><text x="530" y="175" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15.5" fill="#0F6E56" font-weight="700">slot 0 = B</text><text x="575.0" y="276" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">A is freed after an RCU grace</text><text x="575.0" y="295" text-anchor="middle" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056">period if nothing else holds it</text><path d="M315.0,228 L315.0,328" fill="none" stroke="#4A5056" stroke-width="1.3" stroke-dasharray="3 3"/><text x="323.0" y="279.0" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#4A5056" font-style="italic">kept by the outer map</text><rect x="10" y="330" width="660" height="64" rx="5" fill="#E4E6E8" stroke="#4A5056" stroke-width="1.1"/><text x="24" y="350" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328" font-weight="600">inner-map template, copied at creation from the map given as inner_map_fd</text><text x="24" y="374" text-anchor="start" dominant-baseline="central" font-family="'Ubuntu Mono', 'JetBrains Mono', monospace" font-size="15.5" fill="#1F2328">HASH · key 4 B · value 8 B · flags 0 · BTF fields</text><text x="10" y="418" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328">At load, the verifier checks lookup 2 against the template, since any matching map may be in the slot.</text><text x="10" y="440" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328">At update, a map of another type, key size, value size or flags is refused with ‑EINVAL;</text><text x="10" y="460" text-anchor="start" dominant-baseline="central" font-family="'Open Sans Condensed', 'Open Sans', 'Myriad Pro', sans-serif" font-size="15" fill="#1F2328">an array inside must also match max_entries unless the template has BPF_F_INNER_MAP.</text></svg>