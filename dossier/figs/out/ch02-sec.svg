<svg viewBox="0 0 680 406" width="100%" role="img" aria-label="Three section names from the learner's exercises, each split at the first slash; the prefix picks the program type and the rest names the hook" font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>From a SEC() name to a program type and a hook</title><defs><marker id="ah-2-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="40" y="16" text-anchor="start" dominant-baseline="central" font-size="11" fill="#5F5E5A" font-style="italic">your SEC() string, cut at the first slash</text><text x="380" y="16" text-anchor="start" dominant-baseline="central" font-size="11" fill="#5F5E5A" font-style="italic">what libbpf makes of each part</text><text x="40" y="42" text-anchor="start" dominant-baseline="central" font-size="11" fill="#444B52">your write counter · maps/02-hash-map</text><g><rect x="40" y="66" width="90.5" height="32" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="85.25" y="82.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">tracepoint</text></g><g><rect x="130.5" y="66" width="199.25" height="32" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.9"/><text x="230.125" y="82.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">/syscalls/sys_enter_write</text></g><g><rect x="380" y="34" width="260" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="510.0" y="48.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="600" fill="#085041" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">BPF_PROG_TYPE_TRACEPOINT</text><text x="510.0" y="65.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">table entry tracepoint+, no attach type yet</text></g><g><rect x="380" y="86" width="260" height="44" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.9"/><text x="510.0" y="100.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="600" fill="#633806" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">syscalls / sys_enter_write</text><text x="510.0" y="117.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">a fixed tracepoint, found by its number</text></g><path d="M85.25,66 V56 H376" fill="none" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#ah-2-2)"/><path d="M329.75,82 H352 V108 H376" fill="none" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#ah-2-2)"/><text x="40" y="150" text-anchor="start" dominant-baseline="central" font-size="11" fill="#444B52">your kprobe exercise · hello_world/02-kprobe</text><g><rect x="40" y="174" width="61.5" height="32" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="70.75" y="190.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">kprobe</text></g><g><rect x="101.5" y="174" width="126.75" height="32" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.9"/><text x="164.875" y="190.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">/do_sys_openat2</text></g><g><rect x="380" y="142" width="260" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="510.0" y="156.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="600" fill="#085041" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">BPF_PROG_TYPE_KPROBE</text><text x="510.0" y="173.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">table entry kprobe+, no attach type yet</text></g><g><rect x="380" y="194" width="260" height="44" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.9"/><text x="510.0" y="208.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="600" fill="#633806" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">do_sys_openat2</text><text x="510.0" y="225.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">the entry of a kernel function, by name</text></g><path d="M70.75,174 V164 H376" fill="none" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#ah-2-2)"/><path d="M228.25,190 H352 V216 H376" fill="none" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#ah-2-2)"/><text x="40" y="258" text-anchor="start" dominant-baseline="central" font-size="11" fill="#444B52">your fork tracer · hello_world/03-tracepoint</text><g><rect x="40" y="282" width="61.5" height="32" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="70.75" y="298.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">tp_btf</text></g><g><rect x="101.5" y="282" width="155.75" height="32" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.9"/><text x="179.375" y="298.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">/sched_process_fork</text></g><g><rect x="380" y="250" width="260" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="510.0" y="264.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="600" fill="#085041" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">BPF_PROG_TYPE_TRACING</text><text x="510.0" y="281.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">entry tp_btf+, attach type BPF_TRACE_RAW_TP</text></g><g><rect x="380" y="302" width="260" height="44" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.9"/><text x="510.0" y="316.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="600" fill="#633806" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">sched_process_fork</text><text x="510.0" y="333.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">a tracepoint with typed arguments</text></g><path d="M70.75,282 V272 H376" fill="none" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#ah-2-2)"/><path d="M257.25,298 H352 V324 H376" fill="none" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#ah-2-2)"/><rect x="40" y="360" width="600" height="36" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="340" y="378.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Before the first slash: which program type. After it: which hook. Both come from the section name.</text></svg>