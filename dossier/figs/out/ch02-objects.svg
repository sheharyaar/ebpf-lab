<svg viewBox="0 0 680 374" width="100%" role="img" aria-label="The loader process holds descriptors for two maps, the program and the link; the link holds the program and the tracepoint, the program holds both maps; a pin can hold any of them" font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>Who holds whom after load and attach</title><defs><marker id="ah-2-4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="140" y="18" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A" font-weight="600">your loader process</text><text x="470" y="18" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A" font-weight="600">in the kernel</text><rect x="40" y="32" width="200" height="236" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><g><rect x="54" y="49" width="172" height="30" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="140.0" y="64.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#444441" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">map fd · write_counts</text></g><g><rect x="54" y="99" width="172" height="30" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="140.0" y="114.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#444441" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">map fd · …_.rodata</text></g><g><rect x="54" y="157" width="172" height="30" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="140.0" y="172.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#444441" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">program fd</text></g><g><rect x="54" y="229" width="172" height="30" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="140.0" y="244.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#444441" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">link fd</text></g><g><rect x="480" y="44" width="160" height="40" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.9"/><text x="560.0" y="56.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#712B13" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">write_counts</text><text x="560.0" y="73.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">the hash map</text></g><g><rect x="480" y="94" width="160" height="40" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.9"/><text x="560.0" y="106.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#712B13" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">hashmap_.rodata</text><text x="560.0" y="123.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">the bpf_printk string</text></g><g><rect x="300" y="150" width="140" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="370.0" y="164.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">count_writes</text><text x="370.0" y="181.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">the program, 27 slots</text></g><g><rect x="300" y="222" width="140" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="370.0" y="236.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041">link</text><text x="370.0" y="253.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">one program on one hook</text></g><g><rect x="480" y="222" width="160" height="44" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.9"/><text x="560.0" y="236.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#712B13" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">sys_enter_write</text><text x="560.0" y="253.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">tracepoint, as a perf event</text></g><line x1="226" y1="64" x2="478" y2="64" stroke="#5F5E5A" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah-2-4)"/><line x1="226" y1="114" x2="478" y2="114" stroke="#5F5E5A" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah-2-4)"/><line x1="226" y1="172" x2="298" y2="172" stroke="#5F5E5A" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah-2-4)"/><line x1="226" y1="244" x2="298" y2="244" stroke="#5F5E5A" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah-2-4)"/><line x1="370" y1="222" x2="370" y2="197" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ah-2-4)"/><line x1="440" y1="162" x2="478" y2="70" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ah-2-4)"/><line x1="440" y1="168" x2="478" y2="120" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ah-2-4)"/><line x1="440" y1="244" x2="478" y2="244" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ah-2-4)"/><text x="418" y="136" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#5F5E5A" font-style="italic">holds</text><text x="459" y="234" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#5F5E5A" font-style="italic">holds</text><text x="380" y="210" text-anchor="start" dominant-baseline="central" font-size="10.5" fill="#5F5E5A" font-style="italic">holds</text><rect x="40" y="284" width="200" height="32" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.9" stroke-dasharray="4 3"/><text x="140" y="300" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">a pin: a file in /sys/fs/bpf</text><path d="M240,300 H330 V269" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah-2-4)"/><text x="338" y="300" text-anchor="start" dominant-baseline="central" font-size="11" fill="#5F5E5A" font-style="italic">holds whatever it names, with no process at all</text><rect x="40" y="330" width="600" height="34" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="340" y="347.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Each arrow is one reference. An object is freed when its last reference goes.</text></svg>