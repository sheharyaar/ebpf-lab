<svg viewBox="0 0 680 276" width="100%" role="img" aria-label="A seven-line rejection log split into C source lines, walked instructions, the stopping instruction, the reason and the statistics line" font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>The parts of one rejection log</title><defs><marker id="ah-5-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect x="44" y="18" width="596" height="26" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.7"/><text x="54" y="31.0" dominant-baseline="central" font-size="10.5" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#444441">; if (curr_val) { @ past.bpf.c:18</text><text x="632" y="31.0" text-anchor="end" dominant-baseline="central" font-size="10.5" fill="#5F5E5A" font-style="italic">your C line, from the object's BTF</text><rect x="44" y="48" width="596" height="26" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/><text x="54" y="61.0" dominant-baseline="central" font-size="10.5" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#085041">9: (15) if r0 == 0x0 goto pc+2 ; R0=map_value(…,vs=8)</text><text x="632" y="61.0" text-anchor="end" dominant-baseline="central" font-size="10.5" fill="#0F6E56" font-style="italic">an instruction, then what it changed</text><rect x="44" y="78" width="596" height="26" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.7"/><text x="54" y="91.0" dominant-baseline="central" font-size="10.5" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#444441">; __atomic_fetch_add(…, *(curr_val + 1), …); @ past.bpf.c:19</text><text x="632" y="91.0" text-anchor="end" dominant-baseline="central" font-size="10.5" fill="#5F5E5A" font-style="italic">your C line</text><rect x="44" y="108" width="596" height="26" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.7"/><text x="54" y="121.0" dominant-baseline="central" font-size="10.5" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#633806" font-weight="600">10: (79) r1 = *(u64 *)(r0 +8)</text><text x="632" y="121.0" text-anchor="end" dominant-baseline="central" font-size="10.5" fill="#854F0B" font-style="italic">where the walk stopped</text><rect x="44" y="138" width="596" height="26" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.7"/><text x="54" y="151.0" dominant-baseline="central" font-size="10.5" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#712B13" font-weight="600">invalid access to map value, value_size=8 off=8 size=8</text><text x="632" y="151.0" text-anchor="end" dominant-baseline="central" font-size="10.5" fill="#993C1D" font-style="italic">the reason: which rule failed,</text><rect x="44" y="168" width="596" height="26" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.7"/><text x="54" y="181.0" dominant-baseline="central" font-size="10.5" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#712B13" font-weight="600">R0 min value is outside of the allowed memory range</text><text x="632" y="181.0" text-anchor="end" dominant-baseline="central" font-size="10.5" fill="#993C1D" font-style="italic">and for which register</text><rect x="44" y="198" width="596" height="26" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.7"/><text x="54" y="211.0" dominant-baseline="central" font-size="10.5" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#444441">processed 10 insns (limit 1000000) … total_states 1 …</text><text x="632" y="211.0" text-anchor="end" dominant-baseline="central" font-size="10.5" fill="#5F5E5A" font-style="italic">statistics, printed even on rejection</text><line x1="28" y1="220" x2="28" y2="22" stroke="#854F0B" stroke-width="2.2" marker-end="url(#ah-5-2)"/><text x="14" y="121.0" font-size="11" fill="#854F0B" text-anchor="middle" transform="rotate(-90 14 121.0)" dominant-baseline="central">read from the bottom up</text><rect x="40" y="236" width="600" height="30" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="340" y="251.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Skip the statistics, read the reason, then climb the walk to the line where the proof went missing.</text></svg>