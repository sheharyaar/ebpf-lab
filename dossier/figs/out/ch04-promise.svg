<svg viewBox="0 0 680 388" width="100%" role="img" aria-label="Six things a loaded eBPF program never does, each paired with the load-time check that rules it out" font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>What a loaded program never does, and how the kernel made sure</title><defs><marker id="ah-4-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="40" y="14" text-anchor="start" dominant-baseline="central" font-size="12" fill="#993C1D" font-weight="600">A program the kernel has loaded never …</text><text x="420" y="14" text-anchor="start" dominant-baseline="central" font-size="12" fill="#0F6E56" font-weight="600">how the kernel made sure, at load time</text><g><rect x="40" y="30" width="330" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/></g><text x="56" y="44" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">jumps outside itself, or keeps code</text><text x="56" y="60" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">that no path can reach</text><g><rect x="400" y="30" width="240" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/></g><text x="414" y="44" text-anchor="start" dominant-baseline="central" font-size="11" fill="#5F5E5A">the shape check, before the walk</text><text x="414" y="60" text-anchor="start" dominant-baseline="central" font-size="11" fill="#5F5E5A">one look at every jump</text><line x1="372" y1="52" x2="398" y2="52" stroke="#5F5E5A" stroke-width="1.0" marker-end="url(#ah-4-1)"/><g><rect x="40" y="82" width="330" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/></g><text x="56" y="104" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">reads a register it never wrote</text><g><rect x="400" y="82" width="240" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/></g><text x="414" y="96" text-anchor="start" dominant-baseline="central" font-size="11" fill="#0F6E56">the walk: every register has a type,</text><text x="414" y="112" text-anchor="start" dominant-baseline="central" font-size="11" fill="#0F6E56">and "never written" is one of them</text><line x1="372" y1="104" x2="398" y2="104" stroke="#5F5E5A" stroke-width="1.0" marker-end="url(#ah-4-1)"/><g><rect x="40" y="134" width="330" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/></g><text x="56" y="156" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">reads through a pointer that may be NULL</text><g><rect x="400" y="134" width="240" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/></g><text x="414" y="148" text-anchor="start" dominant-baseline="central" font-size="11" fill="#0F6E56">the walk: the pointer stays "maybe NULL"</text><text x="414" y="164" text-anchor="start" dominant-baseline="central" font-size="11" fill="#0F6E56">until a test on that path removes it</text><line x1="372" y1="156" x2="398" y2="156" stroke="#5F5E5A" stroke-width="1.0" marker-end="url(#ah-4-1)"/><g><rect x="40" y="186" width="330" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/></g><text x="56" y="200" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">reads or writes outside the memory</text><text x="56" y="216" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">it was given</text><g><rect x="400" y="186" width="240" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/></g><text x="414" y="200" text-anchor="start" dominant-baseline="central" font-size="11" fill="#0F6E56">the walk: every pointer carries the size</text><text x="414" y="216" text-anchor="start" dominant-baseline="central" font-size="11" fill="#0F6E56">of what it points at</text><line x1="372" y1="208" x2="398" y2="208" stroke="#5F5E5A" stroke-width="1.0" marker-end="url(#ah-4-1)"/><g><rect x="40" y="238" width="330" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/></g><text x="56" y="252" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">calls a helper its program type does not</text><text x="56" y="268" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">allow, or with the wrong arguments</text><g><rect x="400" y="238" width="240" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/></g><text x="414" y="252" text-anchor="start" dominant-baseline="central" font-size="11" fill="#0F6E56">the walk: each call is checked against</text><text x="414" y="268" text-anchor="start" dominant-baseline="central" font-size="11" fill="#0F6E56">the helper's list of argument types</text><line x1="372" y1="260" x2="398" y2="260" stroke="#5F5E5A" stroke-width="1.0" marker-end="url(#ah-4-1)"/><g><rect x="40" y="290" width="330" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/></g><text x="56" y="312" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">runs without end</text><g><rect x="400" y="290" width="240" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/></g><text x="414" y="304" text-anchor="start" dominant-baseline="central" font-size="11" fill="#0F6E56">the walk must reach every exit within</text><text x="414" y="320" text-anchor="start" dominant-baseline="central" font-size="11" fill="#0F6E56">one million instructions</text><line x1="372" y1="312" x2="398" y2="312" stroke="#5F5E5A" stroke-width="1.0" marker-end="url(#ah-4-1)"/><rect x="40" y="346" width="600" height="32" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="340" y="362.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Proved for every path before the program runs once. Whether it counts what you meant is not checked.</text></svg>