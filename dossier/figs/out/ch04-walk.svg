<svg viewBox="0 0 680 212" width="100%" role="img" aria-label="Program blocks for slots 0 to 26 with the path being walked drawn thick, the saved states, and a status row" font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>The kernel walking both paths of your write counter</title><defs><marker id="ah-4-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="20" y="12" text-anchor="start" dominant-baseline="central" font-size="12" fill="#0F6E56" font-weight="600" data-step="1">1 · the first path, as far as the branch</text><text x="20" y="12" text-anchor="start" dominant-baseline="central" font-size="12" fill="#0F6E56" font-weight="600" data-step="2">2 · the first path, on to the exit</text><text x="20" y="12" text-anchor="start" dominant-baseline="central" font-size="12" fill="#0F6E56" font-weight="600" data-step="3">3 · back for the second path</text><g><rect x="20" y="44" width="150" height="50" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="95.0" y="61.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">slots 0 to 8</text><text x="95.0" y="78.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">key on the stack · look up</text></g><g><rect x="196" y="47" width="104" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="248.0" y="61.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">slot 9</text><text x="248.0" y="78.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">is r0 == 0 ?</text></g><g><rect x="334" y="24" width="120" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="394.0" y="36.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#444441" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">slots 10, 11</text><text x="394.0" y="53.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">read count · add</text></g><g><rect x="488" y="44" width="172" height="50" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="574.0" y="61.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">slots 12 to 26</text><text x="574.0" y="78.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">print · update · exit</text></g><line x1="172" y1="69" x2="194" y2="69" stroke="#5F5E5A" stroke-width="1.0" marker-end="url(#ah-4-2)"/><line x1="302" y1="60" x2="332" y2="46" stroke="#5F5E5A" stroke-width="1.0" marker-end="url(#ah-4-2)"/><line x1="456" y1="44" x2="486" y2="56" stroke="#5F5E5A" stroke-width="1.0" marker-end="url(#ah-4-2)"/><path d="M248,93 V124 H520 V96" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#ah-4-2)"/><text x="310" y="36" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#444B52" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">r0 ≠ 0</text><text x="384" y="134" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#444B52" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">r0 == 0: jump to slot 12</text><path d="M24,100 H166" stroke="#0F6E56" stroke-width="3.2" fill="none" data-step="1,2"/><line x1="172" y1="69" x2="194" y2="69" stroke="#0F6E56" stroke-width="2.4" marker-end="url(#ah-4-2)" data-step="1,2"/><line x1="302" y1="60" x2="332" y2="46" stroke="#0F6E56" stroke-width="2.4" marker-end="url(#ah-4-2)" data-step="2"/><line x1="456" y1="44" x2="486" y2="56" stroke="#0F6E56" stroke-width="2.4" marker-end="url(#ah-4-