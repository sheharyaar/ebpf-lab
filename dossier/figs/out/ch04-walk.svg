0" data-step="3">none</text><text x="435.0" y="184" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-weight="600" data-step="3">at slots 9, 25</text><text x="590.0" y="184" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-weight="600" data-step="3">36</text></svg>