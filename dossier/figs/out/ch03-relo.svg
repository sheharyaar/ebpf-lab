<svg viewBox="0 0 680 244" width="100%" role="img" aria-label="Slot 2 of the fork tracer carries the March offset of task_struct.pid; libbpf finds pid by name in the running kernel and patches the offset, or fails the load if no such field exists" font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>One CO-RE relocation in the fork tracer, followed from compile to load</title><defs><marker id="ah-3-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="115" y="14" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5F5E5A" font-weight="600">your object, compiled in March</text><text x="340" y="14" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5F5E5A" font-weight="600" data-step="2+">libbpf, at load</text><text x="565" y="14" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5F5E5A" font-weight="600" data-step="2+">your kernel's types, today</text><g><rect x="20" y="28" width="190" height="52" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="115.0" y="45.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#085041">slot 2, as compiled</text><text x="115.0" y="64.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">w4 = *(u32 *)(r1 + 0xad0)</text></g><g><rect x="20" y="92" width="190" height="52" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.9"/><text x="115.0" y="109.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#633806">a record for slot 2</text><text x="115.0" y="128.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">task_struct.pid: offset?</text></g><g data-step="2+"><rect x="250" y="92" width="180" height="52" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="340.0" y="109.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#444441">libbpf</text><text x="340.0" y="128.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">matches by name</text></g><g data-step="2+"><rect x="470" y="28" width="190" height="52" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.9"/><text x="565.0" y="45.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#712B13" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">struct task_struct</text><text x="565.0" y="64.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">6144 bytes, 269 fields</text></g><g data-step="2,3"><rect x="470" y="92" width="190" height="52" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.9"/><text x="565.0" y="109.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#712B13">field 95: pid</text><text x="565.0" y="128.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">at byte 2872 = 0xb38</text></g><g data-step="4"><rect x="470" y="92" width="190" height="52" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.9" stroke-dasharray="4 3"/><text x="565.0" y="109.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#712B13">no field named pid</text><text x="565.0" y="128.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">say, after a rename</text></g><line x1="212" y1="118" x2="247" y2="118" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#ah-3-3)" data-step="2+"/><line x1="432" y1="118" x2="467" y2="118" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#ah-3-3)" data-step="2+"/><text x="115" y="156" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#5F5E5A" font-style="italic" data-step="2+">0xad0 = 2768: field 97 in the March header</text><line x1="340" y1="146" x2="340" y2="168" stroke="#0F6E56" stroke-width="2.4" marker-end="url(#ah-3-3)" data-step="3"/><g data-step="3"><rect x="20" y="172" width="640" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.6"/><text x="340.0" y="185.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#085041">slot 2, as loaded</text><text x="340.0" y="204.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">w4 = *(u32 *)(r1 + 0xb38)</text></g><line x1="340" y1="146" x2="340" y2="168" stroke="#993C1D" stroke-width="2.4" marker-end="url(#ah-3-3)" data-step="4"/><g data-step="4"><rect x="20" y="172" width="640" height="44" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1.6"/><text x="340.0" y="185.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#712B13">slot 2 becomes a call to helper 195896080, "bad relo"</text><text x="340.0" y="204.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">the load fails: failed to resolve CO-RE relocation …</text></g><text x="340" y="232" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#444B52" font-style="italic" data-step="1">clang wrote the March offset into slot 2, and a record that asks for it again at load</text><text x="340" y="232" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#444B52" font-style="italic" data-step="2">libbpf looks up task_struct, then pid, by name in the running kernel's types</text><text x="340" y="232" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#444B52" font-style="italic" data-step="3">it writes the new offset into slot 2; the kernel receives a plain load</text><text x="340" y="232" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#444B52" font-style="italic" data-step="4">on a kernel with no field of that name, the load fails instead of reading the wrong bytes</text></svg>