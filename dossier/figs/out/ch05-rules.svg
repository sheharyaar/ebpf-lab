<svg viewBox="0 0 680 298" width="100%" role="img" aria-label="Three rejection messages from the learner's program, each mapped to the rule it enforces and to the place where the program lost the proof" font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>From reason line to rule to the lost proof</title><defs><marker id="ah-5-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="130.0" y="14" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D" font-weight="600">the reason line says</text><text x="345.0" y="14" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56" font-weight="600">the rule behind it</text><text x="560.0" y="14" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B" font-weight="600">where the proof was lost</text><g><rect x="20" y="28" width="220" height="66" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/></g><text x="30" y="53.0" dominant-baseline="central" font-size="10.5" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#712B13" font-weight="600">R0 invalid mem access</text><text x="30" y="69.0" dominant-baseline="central" font-size="10.5" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#712B13" font-weight="600">'map_value_or_null'</text><g><rect x="250" y="28" width="190" height="66" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/></g><text x="345.0" y="45.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">a pointer that may be NULL</text><text x="345.0" y="61.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">is read only after a test</text><text x="345.0" y="77.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">on the same path</text><g><rect x="460" y="28" width="200" height="66" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.9"/></g><text x="560.0" y="45.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">slots 9 to 10: the lookup's</text><text x="560.0" y="61.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">result is read with no test</text><text x="560.0" y="77.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">of r0 in between</text><line x1="242" y1="61.0" x2="248" y2="61.0" stroke="#5F5E5A" stroke-width="1.0" marker-end="url(#ah-5-3)"/><line x1="442" y1="61.0" x2="458" y2="61.0" stroke="#5F5E5A" stroke-width="1.0" marker-end="url(#ah-5-3)"/><g><rect x="20" y="104" width="220" height="66" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/></g><text x="30" y="129.0" dominant-baseline="central" font-size="10.5" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#712B13" font-weight="600">invalid access to map value,</text><text x="30" y="145.0" dominant-baseline="central" font-size="10.5" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#712B13" font-weight="600">value_size=8 off=8 size=8</text><g><rect x="250" y="104" width="190" height="66" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/></g><text x="345.0" y="121.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">every access through a map</text><text x="345.0" y="137.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">value stays inside the</text><text x="345.0" y="153.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">value's size</text><g><rect x="460" y="104" width="200" height="66" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.9"/></g><text x="560.0" y="121.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">curr_val + 1: offset 8 of</text><text x="560.0" y="137.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">an 8-byte value, on every</text><text x="560.0" y="153.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">path through that line</text><line x1="242" y1="137.0" x2="248" y2="137.0" stroke="#5F5E5A" stroke-width="1.0" marker-end="url(#ah-5-3)"/><line x1="442" y1="137.0" x2="458" y2="137.0" stroke="#5F5E5A" stroke-width="1.0" marker-end="url(#ah-5-3)"/><g><rect x="20" y="180" width="220" height="66" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/></g><text x="30" y="205.0" dominant-baseline="central" font-size="10.5" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#712B13" font-weight="600">BPF program is too large.</text><text x="30" y="221.0" dominant-baseline="central" font-size="10.5" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#712B13" font-weight="600">Processed 1000001 insn</text><g><rect x="250" y="180" width="190" height="66" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/></g><text x="345.0" y="197.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">the walk must reach every</text><text x="345.0" y="213.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">exit within one million</text><text x="345.0" y="229.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">instructions</text><g><rect x="460" y="180" width="200" height="66" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.9"/></g><text x="560.0" y="197.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">the loop test: its bound is</text><text x="560.0" y="213.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">read from the map, so the</text><text x="560.0" y="229.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">walk never sees a last round</text><line x1="242" y1="213.0" x2="248" y2="213.0" stroke="#5F5E5A" stroke-width="1.0" marker-end="url(#ah-5-3)"/><line x1="442" y1="213.0" x2="458" y2="213.0" stroke="#5F5E5A" stroke-width="1.0" marker-end="url(#ah-5-3)"/><rect x="40" y="258" width="600" height="30" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="340" y="273.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">The log says where the walk stopped. The fix goes where the proof was lost.</text></svg>