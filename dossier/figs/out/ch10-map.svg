oke-width="0.9"/><text x="561.0" y="313.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#444441" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">reg_type_str()</text></g><text x="561" y="338" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5F5E5A">log.c · words the type</text><line x1="472" y1="313" x2="494" y2="313" stroke="#5F5E5A" stroke-width="1.0" marker-end="url(#ah-10-2)"/><line x1="340" y1="348" x2="340" y2="362" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#ah-10-2)"/><g><rect x="40" y="364" width="600" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/></g><text x="60" y="379" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A" font-weight="600">3 · rewrite for running</text><text x="60" y="396" text-anchor="start" dominant-baseline="central" font-size="11" fill="#5F5E5A">context reads, helper calls, small fixes</text><text x="452" y="386" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-weight="600">bpf_do_misc_fixups() …</text><text x="620" y="386" text-anchor="end" dominant-baseline="central" font-size="11" fill="#5F5E5A" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">fixups.c</text><rect x="40" y="420" width="600" height="32" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="340" y="436.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Your rejection is one verbose() call inside the walk, in the checker for loads.</text></svg>