<svg viewBox="0 0 680 462" width="100%" role="img" aria-label="The three phases of bpf_check with the file each lives in, and the path from do_check_insn down to the line that printed the rejection" font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>Where the verifier lives in Linux v7.2</title><defs><marker id="ah-10-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><g><rect x="190" y="8" width="300" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="340.0" y="22.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">bpf_check()  ·  verifier.c</text><text x="340.0" y="39.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">runs once each time a program is loaded</text></g><line x1="340" y1="54" x2="340" y2="70" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#ah-10-2)"/><g><rect x="40" y="72" width="600" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/></g><text x="60" y="87" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A" font-weight="600">1 · check the shape</text><text x="60" y="104" text-anchor="start" dominant-baseline="central" font-size="11" fill="#5F5E5A">jumps in range · no dead code · loops found</text><text x="452" y="94" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-weight="600">bpf_check_cfg()</text><text x="620" y="94" text-anchor="end" dominant-baseline="central" font-size="11" fill="#5F5E5A" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">cfg.c</text><line x1="340" y1="118" x2="340" y2="132" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#ah-10-2)"/><rect x="40" y="134" width="600" height="212" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="60" y="150" text-anchor="start" dominant-baseline="central" font-size="12" fill="#0F6E56" font-weight="600">2 · walk every path</text><text x="620" y="150" text-anchor="end" dominant-baseline="central" font-size="11" fill="#0F6E56" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">do_check()  ·  verifier.c</text><g><rect x="150" y="164" width="280" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="290.0" y="176.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">do_check_insn()</text><text x="290.0" y="193.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">picks a checker by kind of instruction</text></g><g><rect x="450" y="164" width="176" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="538.0" y="176.0" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#444441" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">bpf_is_state_visited()</text><text x="538.0" y="193.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">states.c · seen this state?</text></g><g><rect x="52" y="232" width="136" height="34" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="120.0" y="249.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#085041" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">check_alu_op()</text></g><line x1="290" y1="206" x2="120" y2="230" stroke="#5F5E5A" stroke-width="1.0" marker-end="url(#ah-10-2)"/><g><rect x="196" y="232" width="136" height="34" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.9"/><text x="264.0" y="249.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fi