<svg viewBox="0 0 680 482" width="100%" role="img" aria-label="Two columns comparing the 1993 classic BPF machine with the 2014 eBPF machine, row by row" font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>Classic BPF and eBPF side by side</title><defs><marker id="ah-1-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="165" y="22" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#5F5E5A" font-weight="600">Classic BPF · 1993</text><text x="515" y="22" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#0F6E56" font-weight="600">eBPF · 2014</text><g><rect x="40" y="44" width="250" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="165.0" y="58.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">A and X</text><text x="165.0" y="75.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">two registers, 32 bits</text></g><g><rect x="390" y="44" width="250" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="515.0" y="58.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#085041" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">r0 … r9</text><text x="515.0" y="75.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">ten registers, 64 bits</text></g><line x1="298" y1="66.0" x2="382" y2="66.0" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#ah-1-1)"/><g><rect x="40" y="98" width="250" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="165.0" y="112.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">a hidden frame pointer</text><text x="165.0" y="129.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">the program cannot see it</text></g><g><rect x="390" y="98" width="250" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="515.0" y="112.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#085041" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">r10</text><text x="515.0" y="129.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">read-only frame pointer to the stack</text></g><line x1="298" y1="120.0" x2="382" y2="120.0" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#ah-1-1)"/><g><rect x="40" y="152" width="250" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="165.0" y="166.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">scratch memory</text><text x="165.0" y="183.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">a few words to park values in</text></g><g><rect x="390" y="152" width="250" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="515.0" y="166.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#085041">stack</text><text x="515.0" y="183.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">reached through r10; your key lives here</text></g><line x1="298" y1="174.0" x2="382" y2="174.0" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#ah-1-1)"/><g><rect x="40" y="206" width="250" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="165.0" y="220.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">reads one packet</text><text x="165.0" y="237.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">its only input</text></g><g><rect x="390" y="206" width="250" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="515.0" y="220.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#085041">reads what r1 points at</text><text x="515.0" y="237.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">the hook decides what that is</text></g><line x1="298" y1="228.0" x2="382" y2="228.0" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#ah-1-1)"/><g><rect x="40" y="260" width="250" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="165.0" y="274.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">returns bytes to keep</text><text x="165.0" y="291.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">0 drops the packet</text></g><g><rect x="390" y="260" width="250" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="515.0" y="274.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#085041">returns a value in r0</text><text x="515.0" y="291.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">its meaning depends on the hook</text></g><line x1="298" y1="282.0" x2="382" y2="282.0" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#ah-1-1)"/><g><rect x="40" y="314" width="250" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="165.0" y="328.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">no calls</text><text x="165.0" y="345.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">the program is on its own</text></g><g><rect x="390" y="314" width="250" height="44" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.9"/><text x="515.0" y="328.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#712B13" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">call</text><text x="515.0" y="345.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">into helper functions in the kernel</text></g><line x1="298" y1="336.0" x2="382" y2="336.0" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#ah-1-1)"/><g><rect x="40" y="368" width="250" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="165.0" y="382.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">no memory between packets</text><text x="165.0" y="399.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">every run starts empty</text></g><g><rect x="390" y="368" width="250" height="44" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.9"/><text x="515.0" y="382.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#712B13" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">maps</text><text x="515.0" y="399.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">tables that outlive a run</text></g><line x1="298" y1="390.0" x2="382" y2="390.0" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#ah-1-1)"/><rect x="40" y="426" width="600" height="46" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="340" y="441" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Both are a small machine inside the kernel that returns one value.</text><text x="340" y="458" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">The 2014 machine added width, a stack, calls into the kernel, and maps.</text></svg>