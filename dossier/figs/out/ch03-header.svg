<svg viewBox="0 0 680 332" width="100%" role="img" aria-label="The kernel build turns debug info into BTF exposed in sysfs; bpftool dumps it as vmlinux.h; clang compiles the program with records; libbpf reads the target kernel BTF again at load" font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>Where vmlinux.h comes from, and where the kernel types are read again</title><defs><marker id="ah-3-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="40" y="16" text-anchor="start" dominant-baseline="central" font-size="11" fill="#5F5E5A" font-style="italic">the kernel build: once per kernel</text><g><rect x="40" y="28" width="100" height="50" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="90.0" y="44.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#444441">kernel source</text><text x="90.0" y="63.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">and its config</text></g><g><rect x="170" y="28" width="110" height="50" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="225.0" y="44.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#444441">DWARF</text><text x="225.0" y="63.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">compiler debug info</text></g><g><rect x="310" y="28" width="120" height="50" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.9"/><text x="370.0" y="44.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#712B13">BTF</text><text x="370.0" y="63.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">pahole converts it</text></g><g><rect x="460" y="28" width="180" height="50" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.9"/><text x="550.0" y="44.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#712B13" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">/sys/kernel/btf/vmlinux</text><text x="550.0" y="63.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">6.5 MB on your machine</text></g><line x1="140" y1="53" x2="168" y2="53" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#ah-3-1)"/><line x1="280" y1="53" x2="308" y2="53" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#ah-3-1)"/><line x1="430" y1="53" x2="458" y2="53" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#ah-3-1)"/><text x="40" y="110" text-anchor="start" dominant-baseline="central" font-size="11" fill="#5F5E5A" font-style="italic">your build machine: once per header</text><g><rect x="460" y="122" width="180" height="50" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="550.0" y="138.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">bpftool btf dump</text><text x="550.0" y="157.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">file … format c</text></g><g><rect x="310" y="122" width="120" height="50" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="370.0" y="138.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">vmlinux.h</text><text x="370.0" y="157.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">161,305 lines</text></g><g><rect x="170" y="122" width="110" height="50" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="225.0" y="138.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#085041">clang</text><text x="225.0" y="157.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">notes each read</text></g><g><rect x="40" y="122" width="100" height="50" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="90.0" y="138.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">your .bpf.o</text><text x="90.0" y="157.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">code + records</text></g><line x1="550" y1="80" x2="550" y2="120" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#ah-3-1)"/><line x1="458" y1="147" x2="432" y2="147" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#ah-3-1)"/><line x1="308" y1="147" x2="282" y2="147" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#ah-3-1)"/><line x1="168" y1="147" x2="142" y2="147" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#ah-3-1)"/><text x="196" y="204" text-anchor="start" dominant-baseline="central" font-size="11" fill="#5F5E5A" font-style="italic">the machine that loads it: at every start</text><g><rect x="460" y="216" width="180" height="50" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.9"/><text x="550.0" y="232.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#712B13" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">/sys/kernel/btf/vmlinux</text><text x="550.0" y="251.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">that machine's kernel</text></g><g><rect x="170" y="216" width="262" height="50" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.6"/><text x="301.0" y="232.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#085041">libbpf, at load</text><text x="301.0" y="251.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">answers each record from that kernel's types</text></g><path d="M90,174 V241 H166" fill="none" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#ah-3-1)"/><line x1="458" y1="241" x2="434" y2="241" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#ah-3-1)"/><rect x="40" y="286" width="600" height="36" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="340" y="304.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">The kernel's types are read twice: once to write the header, once by libbpf when the program loads.</text></svg>