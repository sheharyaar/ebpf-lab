<svg viewBox="0 0 680 382" width="100%" role="img" aria-label="Redrawn from Figure 1 of the 1993 BSD Packet Filter paper: link-level drivers call BPF, which runs each listening program’s filter on the packet and copies only accepted bytes into that program’s buffer" font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>The BSD network tap</title><defs><marker id="ah-0-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="20" y="16" text-anchor="start" dominant-baseline="central" font-size="10.5" fill="#5F5E5A" font-style="italic">user space</text><g><rect x="60" y="26" width="140" height="32" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="130.0" y="42.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">network monitor</text></g><g><rect x="230" y="26" width="140" height="32" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="300.0" y="42.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">network monitor</text></g><g><rect x="400" y="26" width="140" height="32" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="470.0" y="42.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">rarpd</text></g><line x1="20" y1="76" x2="660" y2="76" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="5 4"/><text x="20" y="90" text-anchor="start" dominant-baseline="central" font-size="10.5" fill="#5F5E5A" font-style="italic">kernel</text><g><rect x="60" y="100" width="140" height="30" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="130.0" y="115.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">buffer</text></g><g><rect x="60" y="158" width="140"