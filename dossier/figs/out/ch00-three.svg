<svg viewBox="0 0 680 448" width="100%" role="img" aria-label="Three columns comparing a kernel module, copying every packet to user space, and a filter machine, row by row: how the code runs, what it can read, what a bug means, what a rejected packet costs, and what happens on the next kernel" font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>Three ways to put code in the kernel</title><defs><marker id="ah-0-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="120" y="18" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#5F5E5A" font-weight="600">Kernel module</text><text x="120" y="36" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A" font-style="italic">your code becomes kernel code</text><text x="340" y="18" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#5F5E5A" font-weight="600">Copy everything out</text><text x="340" y="36" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A" font-style="italic">the kernel hands packets to you</text><text x="560" y="18" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#0F6E56" font-weight="600">Filter machine</text><text x="560" y="36" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56" font-style="italic">the kernel runs your small program</text><text x="20" y="63" text-anchor="start" dominant-baseline="central" font-size="10.5" fill="#5F5E5A" font-weight="600">Runs as</text><g><rect x="20" y="72" width="200" height="42" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="120.0" y="85.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#444441">native kernel code</text><text x="120.0" y="102.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">loaded into the kernel</text></g><g><rect x="240" y="72" width="200" height="42" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="340.0" y="85.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#444441">a user-space program</text><text x="340.0" y="102.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">outside the kernel</text></g><g><rect x="460" y="72" width="200" height="42" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="560.0" y="85.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#085041">filter instructions</text><text x="560.0" y="102.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">interpreted, once per packet</text></g><text x="20" y="133" text-anchor="start" dominant-baseline="central" font-size="10.5" fill="#5F5E5A" font-weight="600">Can read</text><g><rect x="20" y="142" width="200" height="42" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="120.0" y="155.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#444441">all kernel memory</text><text x="120.0" y="172.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">and write it</text></g><g><rect x="240" y="142" width="200" height="42" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="340.0" y="155.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#444441">only its copies</text><text x="340.0" y="172.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">nothing inside the kernel</text></g><g><rect x="460" y="142" width="200" height="42" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="560.0" y="155.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#085041">one packet</text><text x="560.0" y="172.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">plus 16 words of scratch</text></g><text x="20" y="203" text-anchor="start" dominant-baseline="central" font-size="10.5" fill="#854F0B" font-weight="600">A bug means</text><g><rect x="20" y="212" width="200" height="42" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.9"/><text x="120.0" y="225.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#633806">the kernel crashes</text><text x="120.0" y="242.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">the machine goes down</text></g><g><rect x="240" y="212" width="200" height="42" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.9"/><text x="340.0" y="225.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#633806">your program crashes</text><text x="340.0" y="242.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">the kernel is untouched</text></g><g><rect x="460" y="212" width="200" height="42" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.9"/><text x="560.0" y="225.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#633806">wrong packets kept</text><text x="560.0" y="242.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">the kernel is untouched</text></g><text x="20" y="273" text-anchor="start" dominant-baseline="central" font-size="10.5" fill="#5F5E5A" font-weight="600">A rejected packet costs</text><g><rect x="20" y="282" width="200" height="42" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="120.0" y="295.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#444441">almost nothing</text><text x="120.0" y="312.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">it runs at full speed</text></g><g><rect x="240" y="282" width="200" height="42" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="340.0" y="295.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#444441">a full copy</text><text x="340.0" y="312.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">made, then thrown away</text></g><g><rect x="460" y="282" width="200" height="42" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="560.0" y="295.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#085041">a few instructions</text><text x="560.0" y="312.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">no copy at all</text></g><text x="20" y="343" text-anchor="start" dominant-baseline="central" font-size="10.5" fill="#5F5E5A" font-weight="600">On the next kernel</text><g><rect x="20" y="352" width="200" height="42" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="120.0" y="365.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#444441">rebuild the module</text><text x="120.0" y="382.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">it is tied to one version</text></g><g><rect x="240" y="352" width="200" height="42" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/><text x="340.0" y="373.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#444441">runs unchanged</text></g><g><rect x="460" y="352" width="200" height="42" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="560.0" y="373.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#085041">runs unchanged</text></g><rect x="20" y="408" width="640" height="30" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="340" y="423" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">eBPF keeps the third column and widens what the program may do: chapters 1 to 9.</text></svg>