<svg viewBox="0 0 680 298" width="100%" role="img" aria-label="The kernel record of r0 after the map lookup, split into type, maybe-NULL flag, id, map and sizes" font-family="Literata, 'Source Serif 4', Charter, Georgia, serif" xmlns="http://www.w3.org/2000/svg"><title>One register's state at one instruction, part by part</title><defs><marker id="ah-4-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="20" y="14" text-anchor="start" dominant-baseline="central" font-size="11" fill="#5F5E5A">after slot 8, the call to the map lookup, the kernel writes down:</text><text x="40" y="42" dominant-baseline="central" font-size="14" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#444441">R0=</text><rect x="64.2" y="30" width="77.60000000000001" height="24" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="65.2" y="42" dominant-baseline="central" font-size="14" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#085041">map_value</text><rect x="139.8" y="30" width="69.2" height="24" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="140.8" y="42" dominant-baseline="central" font-size="14" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#633806">_or_null</text><text x="208.0" y="42" dominant-baseline="central" font-size="14" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#444441">(</text><rect x="215.4" y="30" width="35.6" height="24" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="216.4" y="42" dominant-baseline="central" font-size="14" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#085041">id=1</text><text x="250.0" y="42" dominant-baseline="central" font-size="14" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#444441">,</text><rect x="257.4" y="30" width="136.4" height="24" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="258.4" y="42" dominant-baseline="central" font-size="14" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#085041">map=write_counts</text><text x="392.79999999999995" y="42" dominant-baseline="central" font-size="14" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#444441">,</text><rect x="400.19999999999993" y="30" width="77.60000000000001" height="24" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="401.19999999999993" y="42" dominant-baseline="central" font-size="14" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#085041">ks=4,vs=8</text><text x="476.79999999999995" y="42" dominant-baseline="central" font-size="14" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#444441">)</text><path d="M103.0,55 V68 H92 V84" fill="none" stroke="#0F6E56" stroke-width="1"/><g><rect x="30" y="86" width="124" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/></g><text x="92" y="100" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#0F6E56">what r0 points at:</text><text x="92" y="116" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#0F6E56">a value inside a map</text><path d="M174.4,55 V68 H222 V84" fill="none" stroke="#854F0B" stroke-width="1"/><g><rect x="160" y="86" width="124" height="44" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.9"/></g><text x="222" y="100" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#854F0B">maybe NULL: no read</text><text x="222" y="116" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#854F0B">through r0 until a test</text><path d="M233.2,55 V68 H352 V84" fill="none" stroke="#0F6E56" stroke-width="1"/><g><rect x="290" y="86" width="124" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/></g><text x="352" y="100" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#0F6E56">shared by every copy</text><text x="352" y="116" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#0F6E56">of this pointer</text><path d="M325.59999999999997,55 V68 H482 V84" fill="none" stroke="#0F6E56" stroke-width="1"/><g><rect x="420" y="86" width="124" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/></g><text x="482" y="100" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#0F6E56">which map the</text><text x="482" y="116" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#0F6E56">value lives in</text><path d="M438.99999999999994,55 V68 H612 V84" fill="none" stroke="#0F6E56" stroke-width="1"/><g><rect x="550" y="86" width="124" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/></g><text x="612" y="100" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#0F6E56">key 4 bytes, value 8:</text><text x="612" y="116" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#0F6E56">reads stay inside vs</text><text x="20" y="152" text-anchor="start" dominant-baseline="central" font-size="11" fill="#5F5E5A">after slot 9, on the path where the test failed (r0 is not 0):</text><text x="40" y="176" dominant-baseline="central" font-size="14" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#444441">R0=</text><rect x="64.2" y="164" width="77.60000000000001" height="24" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="65.2" y="176" dominant-baseline="central" font-size="14" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#085041">map_value</text><text x="140.8" y="176" dominant-baseline="central" font-size="14" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#444441">(id=1,map=write_counts,ks=4,vs=8)</text><text x="500" y="176" text-anchor="start" dominant-baseline="central" font-size="11" fill="#854F0B" font-weight="600">_or_null is gone</text><text x="20" y="208" text-anchor="start" dominant-baseline="central" font-size="11" fill="#5F5E5A">at slot 12, the key read back as a number:</text><text x="40" y="232" dominant-baseline="central" font-size="14" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#444441">R3=</text><rect x="64.2" y="220" width="52.400000000000006" height="24" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="65.2" y="232" dominant-baseline="central" font-size="14" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#085041">scalar</text><text x="115.60000000000001" y="232" dominant-baseline="central" font-size="14" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" fill="#444441">(smin=0,smax=umax=0xffffffff,…)</text><text x="395" y="232" text-anchor="start" dominant-baseline="central" font-size="11" fill="#0F6E56">a plain number, with bounds</text><rect x="40" y="258" width="600" height="30" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="340" y="273.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">One register, one instruction: a type, which object, its sizes, and an id that links its copies.</text></svg>